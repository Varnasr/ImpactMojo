hin an egocentric network who is identified by another focal person in the network.",expanded:"Alter is a term used in egocentric social network analysis to describe an individual nominated by an ego, or focal person. All of the alters in an ego's network make up the ego's personal network. Alters in social network analysis are similar to reference groups for social norms.",example:"Mariam (ego) reports that she thinks her mother (alter) would disapprove if she engaged in premarital sex (injunctive norm). John (ego) reports that his three best friends and his two cousins (alters) frequently engage in premarital sex (descriptive norm).",category:"Network analysis"},{letter:"A",term:"Attitude",quick:"How I feel about something.",expanded:"Value judgments and feelings towards something. Attitudes may agree with actions, or be counter to them; they influence but do not determine behaviors. This distinction (Mackie et al. 2015) is central to social norms theory: knowing what people personally prefer is not the same as knowing how they will act, because action is also constrained by what they think others expect or do.",example:"I personally believe girls should attend secondary school. But in my community, girls are pulled out after Class 8. I do not stop my daughter from leaving school even though my attitude is in favor of her staying.",category:"Individual cognition"},{letter:"B",term:"Behavior",quick:"Something I do.",expanded:"Observable action by an individual or group. Behaviors are the targets of behavior-change interventions. Distinguish behaviors from beliefs, attitudes, and intentions, which are mental states that may or may not translate into action.",example:"Hand washing with soap. Open defecation. Using a contraceptive method. Attending school. Reporting domestic violence to authorities.",category:"Action"},{letter:"B",term:"Behavioral Intentions",quick:"What I plan to do.",expanded:"Intentions are the plans or ideas that an individual or group aims to act upon. Social norms about a behavior are associated with individual plans to engage or not engage in that behavior. Intentions are the closest mental antecedent to behavior in the Theory of Planned Behavior (Ajzen 1991).",example:"I plan to use a family planning method to space my pregnancies. My sister intended to go to school, but my parents couldn't afford the fees.",category:"Individual cognition"},{letter:"B",term:"Belief",quick:"What I think is true.",expanded:"A mental representation of how the world is (factual belief) or how it should be (normative belief). Distinguished from knowledge in that beliefs may or may not correspond to verifiable facts. Social norms theory distinguishes empirical expectations (beliefs about what others do) from normative expectations (beliefs about what others expect).",example:"I believe that vaccines prevent disease (factual belief). I believe that girls should be educated through secondary school (normative belief).",category:"Individual cognition"},{letter:"C",term:"Compliance",quick:"I act in line with what I believe others expect.",expanded:"Behavioral conformity with a social norm because of perceived expectations from others, often regardless of one's own attitudes. Compliance is the mechanism through which injunctive norms exert influence. A person who complies may privately disagree with the expected behavior but enacts it to avoid sanctions or gain rewards.",example:"I do not personally believe my daughter should be married at 15, but I arrange her marriage because the community expects it and I fear social censure.",category:"Norms mechanism"},{letter:"C",term:"Context",quick:"The setting in which a behavior occurs.",expanded:"The physical, social, cultural, economic, and political environment in which an individual or group operates. Social norms are context-specific: a norm that holds in one setting may not hold in another. Programmes that ignore context risk transplanting interventions from one place to another without sensitivity to local meanings.",example:"Open defecation is a behavior; its meaning in a rural Bihar village (linked to caste, water access, gendered routines) differs from its meaning in an urban Mumbai slum (linked to toilet construction quality, fear of harassment at public toilets).",category:"Environmental"},{letter:"D",term:"Descriptive Norm",quick:"What I think others do.",expanded:"An individual's belief about how prevalent a behavior is among a relevant reference group. Descriptive norms operate by signalling what is typical or normal; people often align their behavior with what they think others are doing, especially under uncertainty (Cialdini, Reno, Kallgren 1990). Distinguished from injunctive norms (what I think others expect).",example:"I think most men in my village beat their wives when angry (descriptive norm). I think my neighbours expect me to discipline my wife (injunctive norm).",category:"Norms mechanism"},{letter:"D",term:"Diffusion (of innovations)",quick:"How ideas and behaviors spread across a group of people.",expanded:"Diffusion is a social process describing how an innovation spreads within a group or social network. Rogers's (2003) diffusion of innovations theory identifies five adopter categories: innovators, early adopters, early majority, late majority, and laggards. To maximise effectiveness, norms-shifting programmes may tailor interventions for each category.",example:"My husband was one of the first men in our town to get a vasectomy. He told his brothers, who also had the surgery. They are now telling their friends.",category:"Network analysis"},{letter:"E",term:"Ego",quick:"The individual from whose perspective the social world or network is being reported or described.",expanded:"In egocentric social network analysis, the ego is the focal person whose connections are being mapped. The ego's alters and the ties among them constitute the ego's personal network.",example:"When mapping a young woman's social network for reproductive health research, she is the ego; the family members, friends, and health workers she names are her alters.",category:"Network analysis"},{letter:"G",term:"Gatekeepers",quick:"People who control access to resources, information, or decision-making.",expanded:"Individuals or institutions who influence whether others can access services, information, or participate in decisions. Gatekeepers may be formal (e.g., a service provider who decides who gets care) or informal (e.g., a mother-in-law who controls a daughter-in-law's mobility). Norms-shifting interventions often need to engage gatekeepers explicitly.",example:"Mothers-in-law as gatekeepers for daughters-in-law's contraceptive use. Husbands as gatekeepers for women's antenatal care attendance. Village panchayat leaders as gatekeepers for community programme uptake.",category:"Social influence"},{letter:"G",term:"Gender",quick:"The socially constructed roles, behaviors, expressions, and identities of women, men, and gender-diverse people.",expanded:"Distinguished from sex, which refers to biological characteristics. Gender is constructed through social processes and varies across cultures and over time. It interacts with other identity dimensions (caste, class, religion, age) through intersectionality.",example:"The norm that women should not work outside the home for wages is a gender norm; it reflects socially constructed expectations about women's roles, not biological facts about women's capacities.",category:"Gender"},{letter:"G",term:"Gender Integration Continuum",quick:"A spectrum from gender-exploitative to gender-transformative programming.",expanded:"The Interagency Gender Working Group's continuum places programmes on a scale: gender-exploitative (reinforces inequitable norms) → gender-blind (ignores gender) → gender-aware (acknowledges gender) → gender-accommodating (works within existing norms) → gender-transformative (seeks to change inequitable norms). The continuum is now standard in donor reporting and programme design.",example:"A nutrition programme that targets only mothers without engaging fathers is gender-blind. A programme that engages mothers, fathers, and grandmothers and explicitly challenges the assumption that nutrition is only a mother's responsibility is gender-transformative.",category:"Gender"},{letter:"G",term:"Gender Norm",quick:"Social norms about how people of different genders should behave.",expanded:"Gender norms are social norms that are interdependent on the conceptualisation of gender within a given society. They specify what is appropriate, expected, or required behavior for people based on their perceived gender. Many harmful practices (child marriage, FGM, son preference, domestic violence) are sustained by gender norms.",example:"The norm that girls should marry before age 18 in some communities. The norm that men should not perform unpaid care work. The norm that women should defer to husbands on financial decisions.",category:"Gender"},{letter:"G",term:"Gender Relations",quick:"The social, political, and economic relationships between women, men, and gender-diverse people.",expanded:"Gender relations are the dynamics of power between and among people of different genders. They are shaped by gender norms, institutional structures, and individual interactions. Programmes that seek norm change must engage with gender relations, not just with individual women or men.",example:"The dynamics through which household financial decisions are made between a husband and wife, and how those dynamics are influenced by norms about who controls money.",category:"Gender"},{letter:"G",term:"Gender-Transformative Approaches",quick:"Programming that actively seeks to change inequitable gender norms.",expanded:"The right end of the gender integration continuum. Gender-transformative approaches engage participants in critical reflection on inequitable norms and work to shift them. Examples include couples-based programming on shared decision-making, men's engagement programmes, and norms-focused life-skills curricula for adolescents.",example:"Programme H (Brazil/India) engages young men in critical reflection on masculinity norms. SASA! (Uganda) addresses community-level power dynamics around violence. ARCHES (Nairobi/India) addresses reproductive coercion.",category:"Gender"},{letter:"I",term:"Injunctive Norm",quick:"What I think others expect me to do.",expanded:"An individual's belief about what behaviors are approved or disapproved by a relevant reference group. Injunctive norms operate through anticipation of social sanctions: people behave to avoid disapproval or gain approval. Distinguished from descriptive norms (what others actually do). The injunctive-descriptive distinction is the central conceptual tool in modern social norms theory.",example:"I think my neighbours would disapprove if I sent my daughter to school after Class 10 (injunctive norm). I think most families in my community pull their daughters out after Class 8 (descriptive norm).",category:"Norms mechanism"},{letter:"I",term:"Intersectionality",quick:"How multiple identity dimensions combine to shape experience.",expanded:"Coined by Kimberlé Crenshaw (1989), intersectionality describes how identity dimensions like gender, caste, class, race, religion, sexuality, disability, and age interact to produce distinct experiences of privilege and oppression. Norms-shifting work that treats women as a uniform category misses how a Dalit woman's experience differs from a Brahmin woman's, even when both face gender-based constraints.",example:"Sex-selective abortion in north India shows stronger correlations with caste and economic status than with gender alone. A poor Dalit woman's experience of healthcare access combines barriers from gender, caste, and poverty.",category:"Identity"},{letter:"K",term:"Key Influencers",quick:"People who influence me or others.",expanded:"Individuals who sway the opinions, beliefs, actions, or behaviors of others, both consciously and unconsciously. Key influencers often drive social norms and can act as barriers to or facilitators of norm change. They may hold official positions of power or function as community gatekeepers. Often used synonymously with role model.",example:"Popular older students influencing younger students' behaviors. ASHA workers as key influencers for maternal health behaviors. Religious leaders as key influencers for family planning decisions.",category:"Social influence"},{letter:"K",term:"Knowledge",quick:"What I know.",expanded:"Information that an individual or group possesses. Knowledge is necessary but not sufficient for behavior change: people often know what they should do (e.g., wash hands, use condoms) but do not do it. The KAP (knowledge, attitudes, practices) framework is widely used but limited because it treats knowledge as the primary driver, which evidence does not support.",example:"Most adolescents in India know that early marriage is legally prohibited under the Prohibition of Child Marriage Act 2006. Knowledge of the law has not by itself eliminated child marriage.",category:"Individual cognition"},{letter:"M",term:"Meta-Norms",quick:"Norms about norms.",expanded:"Norms about how to respond to norm violations, including who has the standing to sanction violators and how. Meta-norms are part of what makes social norms self-sustaining: if there is no expectation that you will sanction someone who deviates, the norm weakens.",example:"A norm against domestic violence may exist alongside a meta-norm that family violence is a private matter outsiders should not intervene in. Norm change requires shifting both.",category:"Norms mechanism"},{letter:"M",term:"Motive / Motivation",quick:"Why I do what I do.",expanded:"Internal and external drivers of behavior. Motivation can be intrinsic (the behavior is rewarding in itself) or extrinsic (the behavior produces external rewards or avoids punishment). Norms operate through extrinsic motivation primarily, via anticipated social sanctions and rewards.",example:"Intrinsic motivation: I exercise because it makes me feel good. Extrinsic motivation: I attend my husband's family functions because his mother expects it.",category:"Individual cognition"},{letter:"N",term:"Normative",quick:"Relating to norms or standards of expected behavior.",expanded:"Pertaining to what should be or is expected, as opposed to what is. Distinguishes prescriptive claims from descriptive ones. In social norms research, normative expectations (what others expect of me) are distinguished from empirical expectations (what others do).",example:"It is normative in many South Asian communities that the eldest son lives with his parents. Whether he actually does is a descriptive question.",category:"Conceptual"},{letter:"N",term:"Norms-Shifting Interventions",quick:"Programmes designed to change social norms.",expanded:"Interventions that target social norms as the primary mechanism for behavior change, rather than (or in addition to) individual knowledge or attitudes. Norms-shifting interventions typically work at the community or network level, engage reference groups, and explicitly address the gap between private attitudes and perceived public expectations.",example:"Tostan in West Africa for FGM abandonment. SASA! in Uganda for intimate partner violence. Voices for Change (V4C) in northern Nigeria for adolescent girls' rights. UNICEF-supported BCC interventions on child marriage in Bihar and West Bengal.",category:"Programming"},{letter:"O",term:"Outcome Expectations",quick:"My perception of the benefits of engaging in a certain behavior.",expanded:"An individual's belief that a certain behavior will lead to expected outcomes, including social acceptance. Outcome expectations influence motivation to act. Closely linked to self-efficacy in Bandura's social cognitive theory.",example:"Students who perceive that drinking alcohol will help them be socially accepted are more likely to drink. I am careful about washing my hands because I believe it could save my life.",category:"Individual cognition"},{letter:"R",term:"Reference Group",quick:"People whose behaviors and beliefs shape my own behaviors and beliefs.",expanded:"Networks of people with whom a person identifies and to whom they compare themselves. Reference groups inform a person's ideas about what is socially acceptable. Depending on the behavior or norm, the most salient reference group(s) may be friends, family, broader community, or aspirational groups not yet part of the person's immediate network. Identifying the relevant reference group for a given behavior is a central methodological challenge in norms measurement.",example:"For a married woman's contraceptive use, the salient reference groups may include her husband, mother-in-law, female peers, and the ASHA worker. For an adolescent boy's risk-taking, the salient reference group is usually male peers.",category:"Social influence"},{letter:"S",term:"Sanctions (Social)",quick:"Rewards and punishments imposed by others in response to behavior.",expanded:"Social rewards (approval, inclusion, status) and punishments (disapproval, exclusion, stigma, gossip, violence) used by reference groups to enforce norms. Sanctions are the enforcement mechanism that makes norms sticky even when individual attitudes diverge.",example:"Gossip, social exclusion, withdrawal of marriage prospects, public shaming, and in extreme cases violence are all sanctions deployed to enforce gender norms.",category:"Norms mechanism"},{letter:"S",term:"Self-Efficacy",quick:"My belief that I can perform a behavior.",expanded:"Bandura's (1977) concept: an individual's perceived capability to execute a course of action. Self-efficacy is distinguished from outcome expectations (belief about what the behavior will produce) and from actual ability (capacity to perform). High self-efficacy predicts behavior change attempt and persistence.",example:"An adolescent girl may know condoms prevent pregnancy (knowledge) and believe condoms are effective (outcome expectation) but still believe she cannot negotiate condom use with her partner (low self-efficacy).",category:"Individual capacity"},{letter:"S",term:"Sensitivity to Social Sanctions",quick:"How much the rewards and punishments for engaging in a behavior matter to or affect me.",expanded:"How sensitive a group or individual is to social sanctions influences how willing they are to engage in a given behavior. Someone who is sensitive to sanctions is very likely to change future behavior in response to sanctions; someone who is not sensitive is unlikely to be influenced by them. Sensitivity varies by individual, by behavior, and by the strength of the relationship with the reference group.",example:"An older man whose social standing is high may be less sensitive to gossip about his decisions than a younger newlywed woman whose mobility depends on her in-laws' approval.",category:"Norms mechanism"},{letter:"S",term:"Social Network",quick:"The web of relationships through which information, influence, and resources flow.",expanded:"The structure of social ties surrounding an individual or group. Social network analysis maps these ties to understand how norms, behaviors, and innovations spread. Both ego-centric (one focal person and their alters) and full-network approaches are used.",example:"An adolescent girl's social network might include her parents, siblings, in-school friends, out-of-school friends, ASHA worker, schoolteacher, and a few extended family members. Each tie may carry different norms.",category:"Network analysis"},{letter:"S",term:"Social Norms",quick:"Informal rules of behavior shared by members of a group.",expanded:"Patterned behaviors that group members follow because of the perceived (or actual) approval, disapproval, expectations, or behaviors of other group members. Social norms are distinguished from laws (formal rules with formal sanctions), moral norms (internalised principles applied universally), and habits (individual routines without social enforcement). Cialdini and colleagues distinguish injunctive from descriptive norms; Bicchieri (2006, 2017) provides the most rigorous philosophical treatment.",example:"The expectation that women in some communities should not eat before serving the family. The expectation that boys should not cry. The expectation that wedding gifts to the bride's family should reach a certain value (dowry).",category:"Core concept"},{letter:"S",term:"Social Norms Assessment",quick:"Systematic measurement of social norms in a population.",expanded:"Methods to measure both injunctive and descriptive norms, identify reference groups, and assess the strength of norms (the gap between personal attitudes and perceived expectations). Quantitative methods include surveys with vignettes and pluralistic ignorance questions. Qualitative and participatory methods are covered in the Participatory Research Toolkit.",example:"ACT Framework (Cislaghi, Sood) for measuring social norms change around FGM. The Social Norms Diagnostic from Bicchieri's lab. Vignette-based survey items used in NFHS for attitudes toward IPV.",category:"Measurement"},{letter:"S",term:"Socio-Ecological Model",quick:"Framework that locates behavior within nested levels of influence.",expanded:"The SEM identifies five nested levels that influence behavior: individual, family/friends, community, institutions/services, and policy/society/environment. Originally developed by Bronfenbrenner (1979) for child development; adapted widely in public health. UNICEF uses it as its foundational SBC framework.",example:"Open defecation cessation depends on individual decision (level 1), family agreement (level 2), community sanitation norms (level 3), availability of toilets and water (level 4), and policy support like Swachh Bharat (level 5).",category:"Theory"},{letter:"S",term:"Socio-Structural Driver",quick:"A broader social, political, or economic force that shapes behavior at scale.",expanded:"Macro-level forces (poverty, inequality, conflict, climate change, formal laws, market structures) that shape the contexts in which individual behaviors occur. Norms-shifting interventions that ignore structural drivers may produce short-term shifts that do not persist because the underlying conditions remain.",example:"Child marriage in South Asia is driven by poverty (parents marry daughters early to reduce household burden), insecurity (early marriage seen as protection), and norms about female sexuality. Programmes that address only norms without engaging structural drivers tend to have limited impact.",category:"Environmental"},{letter:"S",term:"Stigma",quick:"A label of social disgrace I experience because I participate in socially undesirable behaviors, beliefs, identities, or traits.",expanded:"A figurative label of disapproval or discrimination applied to a person by society based on undesirable behaviors, beliefs, identities, or traits. Stigma can be public (inflicted by society) or self-stigma (internalised). Three conditions are necessary: human differences are labelled; norms dictate desirable vs undesirable; individuals are categorised and treated inequitably (Link & Phelan 2001).",example:"HIV-positive women in India face stigma that prevents disclosure and treatment access. Widows in some communities face stigma that restricts mobility and social participation. Mental illness carries stigma that prevents help-seeking.",category:"Norms mechanism"},{letter:"W",term:"Women's and Girls' Empowerment",quick:"The expansion of women's and girls' capacity to make and act on choices.",expanded:"Following Kabeer (1999), empowerment is the process by which those who have been denied the ability to make choices acquire that ability. Empowerment has three dimensions: resources (material, human, social), agency (decision-making, voice), and achievements (outcomes that reflect expanded choices). Measurement is contested; the EMERGE framework (Center on Gender Equity and Health, UCSD) is one influential approach.",example:"An adolescent girl's empowerment can be assessed across resource dimensions (school enrollment, financial literacy, peer networks), agency dimensions (decision-making about her education, marriage, fertility), and achievement dimensions (years of schooling completed, age at marriage, freedom from violence).",category:"Gender"}],c=[{level:"Policy, society and environment",description:"The laws, norms and conditions that govern our lives",example:"Prohibition of Child Marriage Act 2006. Swachh Bharat Mission. Cultural norms around son preference. Economic conditions shaping household decisions."},{level:"Institutions and services",description:"The organisations we interact with, the services available to us and our experience of them",example:"Anganwadi centres. Primary health centres. Schools. ASHA worker networks. Police stations. NGO programmes."},{level:"Community",description:"Our social groups, those who live in a similar geographic area or share characteristics or interests with us",example:"Village panchayat. Caste groupings. Religious community. Self-help groups. Adolescent peer groups. Women's collectives."},{level:"Family and friends",description:"The people who we interact with on a regular basis",example:"Mother-in-law, husband, sisters-in-law, female friends, male peers. The reference groups that exert the most immediate normative pressure."},{level:"Individual",description:"Our own cognitive experience and perceptions",example:"Knowledge, attitudes, beliefs, self-efficacy, intentions. The level that traditional KAP surveys assess, but only one of five."}],d=[{name:"Psychology",icon:"P",color:"#7c3aed",description:"The demographic and social characteristics that make people unique. Beliefs, intentions, perceptions and biases that influence decision-making.",components:"Demographic and physical characteristics · Self-efficacy · Personal cognition · Behavioural mindsets · Personal characteristics"},{name:"Sociology",icon:"S",color:"#0891b2",description:"The notion that people are never fully autonomous. The effects of social influence and norms. People are heavily influenced by and concerned about the opinions and actions of others.",components:"Social influence · Social norms · Reference groups · Identity and roles · Power dynamics"},{name:"Environment",icon:"E",color:"#16a34a",description:"The wide range of influences that exist in the space around us. Public and private discourse. Government policies and services. The context in which people live and form behaviours.",components:"Physical environment · Institutional environment · Public discourse · Media · Markets and infrastructure"}],f=[{name:"Body Mapping",purpose:"Explore norms by asking what a character in a vignette would see, hear, say, think, and feel.",when:"When researchers want to understand the embodied dimensions of norms — what people experience physically and emotionally when navigating norm-bound situations.",how:"Present a vignette describing a norm-relevant situation. Ask participants to describe what the character would see, hear, say, think, feel in their stomach, do with their hands and feet, in response to specific prompts.",example:"Used in Jamaica to explore gender norms around adolescent behaviour (UNICEF). A male and a female vignette were used in parallel to surface gender-differentiated experiences.",output:"A table of embodied responses by sense and body part, comparable across vignettes and across groups."},{name:"Cannot Do, Will Not Do, Should Not Do",purpose:"Classify why a behavior does not occur: lack of capacity, lack of will, or social prohibition.",when:"To examine restricted behaviours that the programme wants to increase. Effective only if the population currently does not engage in the behavior.",how:"Present a list of behaviours. For each, participants categorise: cannot do (no ability or resources), will not do (no intention or motivation), or should not do (norm prohibits).",example:"Used in the GARIMA programme in rural India to understand menstrual hygiene restrictions. Distinguished restrictions imposed by lack of supplies (cannot) from those imposed by social norms (should not).",output:"A categorised list of behaviours with reasons, supporting design of context-appropriate interventions."},{name:"Complete-the-Story",purpose:"Surface norms by asking participants to complete a partially told story.",when:"When direct questions about norms might generate socially desirable responses. The projective format reduces self-presentation bias.",how:"Begin a story that ends at a norm-relevant decision point. Ask participants in small groups what happens next, why, and how others respond.",example:"A story about a daughter-in-law deciding whether to attend a prenatal check-up. The completions reveal what participants believe is expected, what consequences are anticipated, and which reference groups matter.",output:"Narrative data showing perceived norms, sanctions, and reference groups for the behaviour of interest."},{name:"Free Listing",purpose:"Generate a list of items in a category, ordered by salience.",when:"Early in research, to surface what categories and behaviours the community itself recognises, before imposing researcher-defined categories.",how:"Ask participants to list as many items as they can in a given category (e.g., 'reasons girls drop out of school'). Cumulative ordering reveals salience.",example:"Used to identify locally salient drivers of an outcome before designing a structured measurement instrument.",output:"A ranked list of community-identified items with salience scores."},{name:"Gender Boxes",purpose:"Map gender norms by listing what 'real men' and 'real women' do and do not do.",when:"When examining gender norms specifically. The exercise surfaces the policing of gender expression within a community.",how:"Two boxes (male, female). Inside each box: behaviours expected. Outside each box: behaviours that would violate the norm and the sanctions for violation.",example:"Used widely in men's engagement programmes (e.g., Programme H, MenEngage) to surface and then critique masculine norms.",output:"Visual representation of gender norms and their enforcement mechanisms."},{name:"Genealogy",purpose:"Trace the intergenerational transmission of norms within families.",when:"When norms are deeply rooted across generations and the research seeks to understand how they persist and how they might change.",how:"Map family relationships across generations. For each generation, identify norms that were enforced and behaviours that were sanctioned.",example:"Tracing FGM practice across grandmother, mother, and daughter generations to identify points of generational discontinuity that can be amplified.",output:"A genealogical map annotated with norm enforcement and change points."},{name:"Lifeline",purpose:"Plot the major events in a life and the norms that operated at each.",when:"When examining how norms operate differently across life stages and how individual norm experiences accumulate.",how:"Participants draw a timeline of their lives, marking key events. For each event, they note the norms that shaped what they could and did do.",example:"Used with adolescent girls to plot puberty, school transitions, marriage decisions, and the norms operating at each.",output:"Individual lifelines annotated with norm experiences, comparable across participants."},{name:"Pile Sorting",purpose:"Reveal categories by asking participants to sort items into groups.",when:"When researchers want to understand how a community categorises behaviours, identities, or attributes, rather than imposing external categories.",how:"Provide a set of cards (with words or images). Ask participants to sort them into piles based on similarity. Discuss what each pile represents.",example:"Sorting reproductive health behaviours into 'acceptable', 'discussable in public', 'discussable only privately', and 'not discussable' surfaces communication taboos.",output:"A community-derived classification of behaviours with explanatory rationales."},{name:"2x2 Tables for Social Norms",purpose:"Distinguish private attitudes from perceived public expectations to identify pluralistic ignorance.",when:"Core method for diagnosing whether a norm is sustained by genuine majority preference or by pluralistic ignorance (where most people privately disagree but think others agree).",how:"Two axes: 'I personally believe X' (yes/no) and 'Most people in my community believe X' (yes/no). The four cells map onto: shared support, lonely supporter, lonely opponent, shared opposition.",example:"Often reveals that opposition to harmful practices is more widespread than community members realise. Programmes can then publicise the actual distribution to break the pluralistic ignorance.",output:"Diagnostic 2x2 distribution showing where a community's actual opinions sit and where the norm-perception gap is largest."}],p=[{issue:"Child marriage",norm:"Daughters should marry by age 18 (or earlier); delaying marriage damages family reputation and limits marriage prospects.",context:"About 23% of women aged 20-24 were married before 18 (NFHS-5, 2019-21). Down from 47% in NFHS-3 (2005-06) but still high. Concentrated in Bihar, West Bengal, Jharkhand, Rajasthan, Madhya Pradesh.",programming:"UNICEF-supported programmes in Bihar and West Bengal use community dialogue, adolescent girls' groups (KGBV residential schools, Kishori Samooh), and engagement with parents and panchayat members. The PRACHAR project in Bihar (Pathfinder International) explicitly addressed both injunctive and descriptive norms.",methods:"2x2 tables (to break pluralistic ignorance), Genealogy (to trace intergenerational change), Complete-the-Story (to surface anticipated consequences)."},{issue:"Female genital mutilation/cutting (FGM/C) in Bohra community",norm:"Khatna (female circumcision) is required to mark girls' membership in the Dawoodi Bohra community.",context:"Bohra Muslim community in Gujarat, Maharashtra, Rajasthan. Estimated 75-80% prevalence within the community. Practice was hidden until SAHIYO and WeSpeakOut campaigns from 2015 onward. PIL in Supreme Court (Sunita Tiwari v. Union of India 2017) pending.",programming:"Survivor-led advocacy by SAHIYO and WeSpeakOut. Engagement with religious leaders. The UNFPA-UNICEF Joint Programme on FGM (which sponsored the Participatory Research Toolkit) is the global reference; India-specific work has been more activist-led.",methods:"Complete-the-Story (anticipated consequences of refusal), Body Mapping (embodied experience of the practice), 2x2 tables (to identify hidden opposition)."},{issue:"Son preference and sex-selective abortion",norm:"Sons are required for old-age support, family continuation, and ritual obligations; daughters are a financial burden.",context:"Sex ratio at birth was 929 girls per 1000 boys (NFHS-5 2019-21), worse than natural ratio of about 952. Highly concentrated in Punjab, Haryana, Delhi, Uttarakhand, parts of Maharashtra. Pre-Conception and Pre-Natal Diagnostic Techniques (PCPNDT) Act 1994/2003 prohibits sex determination but enforcement is weak.",programming:"Beti Bachao Beti Padhao (2015) is the flagship government programme, criticised for under-investment. UNFPA-supported work focuses on norms change through media and community engagement. Punjab's 'Nawanshahr model' under Krishan Kumar (2005-08) used administrative enforcement combined with community engagement.",methods:"2x2 tables (genuine vs perceived majority preference), Gender Boxes (norms about son obligations), Lifeline (intergenerational norm shift)."},{issue:"Menstrual hygiene management",norm:"Menstruating women and girls should not enter kitchens, temples, or sleep in certain rooms; the topic should not be discussed in mixed company.",context:"Pan-Indian norms with significant regional variation. Affects girls' school attendance and dignity. The MHM movement gained traction post-2010; the GST Council removed the tax on sanitary pads in 2018 after sustained advocacy.",programming:"GARIMA programme (Bihar, UNICEF-supported, 2017-19) used the Cannot Do, Will Not Do, Should Not Do method explicitly. UDAYA programme (Bihar/UP). Menstrual Health Alliance India network of NGOs.",methods:"Cannot Do, Will Not Do, Should Not Do (which restrictions are about access vs norms), Free Listing (community-defined restrictions), Pile Sorting (discussable vs taboo aspects)."},{issue:"Domestic violence and acceptance of wife-beating",norm:"Husbands have the right to discipline wives; certain wife behaviours (refusing sex, going out without permission, burning food) justify violence.",context:"NFHS-5 (2019-21): about 30% of ever-married women aged 18-49 reported experiencing spousal physical, sexual, or emotional violence. Attitudes to IPV (the 'wife-beating justified' module in NFHS) show persistent acceptance: about 45% of women and 38% of men in NFHS-5 said wife-beating is justified in at least one circumstance.",programming:"Protection of Women from Domestic Violence Act 2005. One Stop Centres under Ministry of Women and Child Development. NGO-led work by Jagori (Delhi), SNEHA (Mumbai), Sakhi (Kerala), Breakthrough (national).",methods:"Vignette-based survey (NFHS-style), 2x2 tables (private opposition vs perceived majority), Reference group mapping (whose disapproval would deter violence)."},{issue:"Open defecation",norm:"Defecating in fields is preferable to using a household toilet because of caste-based purity norms, gendered routines, and beliefs about ventilation and disease.",context:"Swachh Bharat Mission (Gramin) 2014-19 claimed elimination of open defecation. Independent assessments (Coffey, Spears, Khurana, Hueso 2017 EPW) found persistence even with toilet construction because of underlying norms. Caste dimension is critical: cleaning latrines is associated wi
