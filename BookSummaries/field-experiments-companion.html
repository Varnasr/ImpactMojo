aming helps explain why methodological debates in Indian dev econ rarely engage with experimental economics journals like the JEEA or Experimental Economics."},{num:2,title:"Types and goals of economics experiments",pages:"10-25",what:"Surveys the existing typologies of economics experiments, drawing on Roth (1995), Harrison and List (2004), and others. Distinguishes three types of experiments by target construct: decision-theoretic, game-theoretic, and market experiments. Examines two philosophical interests served by economics experiments: the logic of inductive inference (severe testing in Mayo's sense) and the methodological convergence between economics and psychology.",keyConcepts:["Three-part typology by target construct (Table 2.1): decision-theoretic, game-theoretic, market","Threefold typology of economics itself (Table 2.2): positive, normative, art-of-economics","Severe testing (Deborah Mayo) as the inductive logic appropriate to experimental science","Exhibitory experiments vs theory-testing experiments"],arguments:"Existing typologies focus on the lab-field continuum and miss the philosophical structure underneath. The chapter sets up the framework the rest of the book will use: experiments serve epistemic purposes (testing theories, establishing robust phenomena) and policy purposes (evaluating interventions), and the lab-field dichotomy is orthogonal to this epistemic-policy distinction.",southAsia:"Decision-theoretic and game-theoretic experiments are rarely conducted on Indian populations beyond classroom samples. Notable exceptions include trust games and ultimatum games run with rural populations (Henrich et al. 2001, 2005 WEIRD studies). The art-of-economics distinction matters for policy work: NITI Aayog, the World Bank India team, and 3ie all sit in the art-of-economics zone where positive findings get translated into prescriptive recommendations."},{num:3,title:"Two historical strands",pages:"26-41",what:"The book's core historical chapter. Traces the first strand — field experiments as an extension of lab economic experiments — through Vernon Smith's market experiments (1962), Charles Plott's work on auctions, and John List's auction experiments at sports card shows (List & Lucking-Reiley 2000). Traces the second strand — field experiments as policy evaluation — through the Negative Income Tax experiments of the late 1960s through the 1970s in the US, then to Heather Ross's framework, to development economics RCTs (Banerjee, Duflo, Kremer) from the late 1990s onward. Concludes with a spectrum of empirical methods (Figure 3.1) running from purely controlled lab to purely naturally-occurring data.",keyConcepts:["First strand: lab-extension. Authors: Vernon Smith, Charles Plott, Glenn Harrison, John List","Second strand: policy-evaluation. Authors: NIT researchers, Banerjee, Duflo, Kremer","Different conceptions of control: lab-strand controls variables, policy-strand controls assignment","Different conceptions of external validity follow from different control concepts","The Spectrum of Empirical Methods (Fig 3.1): from lab to natural experiment to observational data"],arguments:"The two strands are not just substantively different; they have different epistemic ancestries. The lab-strand inherits from experimental physics and chemistry via mid-century experimental economics. The policy-strand inherits from agricultural field trials (Fisher's randomisation in the 1920s-30s), medical RCTs, and the 1960s-70s US social policy experiments. Treating them as one methodological family obscures both their distinct strengths and their distinct weaknesses.",southAsia:"All major Indian J-PAL South Asia studies (Pratham TaRL, ASER-linked evaluations, NREGA biometric smartcards by Muralidharan, Niehaus, Sukhtankar 2016 AER) sit in the second strand. The first strand is largely absent from the Indian development economics literature, which is itself a methodological observation worth making. Banerjee and Duflo's 'Poor Economics' (2011) is the public face of the second strand applied to India."},{num:4,title:"External validity: methodological issues and practices",pages:"42-57",what:"Develops the book's most pointed methodological critique. External validity has 'two faces': artificiality (in the lab-strand, are lab findings generalisable to natural settings?) and generalisability (in the policy-strand, do RCT findings travel to other populations or contexts?). The chapter examines responses from proponents of randomised field experiments (RFEs) — structured speculative judgments (Banerjee, Duflo, Glennerster, Kothari 2017), combining machine learning with RFEs (Chernozhukov et al. 2018) — and compares the proposals to actual practice in published RFEs. Uses Pascaline Dupas's bednet pricing experiments (Cohen and Dupas 2010) as a running case study (Box 4.1).",keyConcepts:["Two faces of external validity: artificiality (lab→field) vs generalisability (field→field)","Deaton's critique: RCTs estimate ATEs at a specific site; the 'average' may not apply anywhere","Cartwright's critique: RCTs need a theory of why results would travel; randomisation doesn't supply one","Pritchett & Sandefur's critique: external validity claims are typically not licensed by the evidence","Structured speculative judgments (Banerjee et al. 2017) as J-PAL's response","Machine learning + RFEs (Chernozhukov et al. 2018) as another response"],arguments:"The orthodoxy treats internal validity as the gold standard and external validity as a secondary concern, to be patched up post hoc with subjective judgments or meta-analyses. The authors argue the practice does not match the proposals: published RFEs typically claim policy implications well beyond what their identification strategy licenses. The Cohen-Dupas bednet experiment is presented as emblematic: the result that fully subsidised bednets are taken up at much higher rates than priced bednets gets read as a general result about user fees in public health, but the experimental setting fixes many local features that may not hold elsewhere.",southAsia:"Pritchett's 2002 'When will they ever learn?' essay and his subsequent work (Pritchett & Sandefur 2015) are central to this debate and explicitly anchored in Indian education data. The TaRL programme has been evaluated by RCTs in multiple Indian states; the question of whether the Tamil Nadu result transfers to Uttar Pradesh is exactly the generalisability question the authors raise. NREGA evaluations face the same question across states with very different state-capacity baselines."},{num:5,title:"Bringing two strands together",pages:"58-73",what:"The constructive chapter. Argues that the two strands are complementary, not competitive, and proposes ways to combine them productively. Examines the role of behavioural economics as a source of models of choice that can bridge lab-strand and policy-strand work. Develops the concept of economic experiments as 'exhibits' — robust phenomena that can inform both theory and policy. Illustrates with examples and discusses combining experiments with field studies, including qualitative case work alongside RFEs.",keyConcepts:["Experiments as exhibits (drawing on Sugden 2005): robust empirical regularities that ground both theory and policy","Behavioural economics (Kahneman, Tversky, Thaler) as a meeting ground between the strands","Functions of field experiments as exhibits (Table 5.1)","Combining RFEs with field studies and qualitative case work (Blattman et al. 2017 as illustration)","The role of baseline surveys and qualitative interviews in 'restoring the missing field'"],arguments:"The unified framework treats experiments as producing exhibits — robust phenomena that can simultaneously inform theory, suggest policy mechanisms, and supply candidate interventions. Combining RFEs with qualitative case studies (in the Shadish, Cook, and Campbell 2002 sense) is one practical bridge. The chapter is explicit that this is a methodological proposal, not a description of current practice — most published RFEs treat their results as standalone, not as exhibits requiring further triangulation.",southAsia:"Combining RFEs with qualitative field studies is rare in published Indian dev econ, but more common in NGO-led evaluation work. CMS (Centre for Microfinance) at IFMR, J-PAL's own internal process evaluations, and 3ie-funded mixed methods studies are starting to publish in this register. Banerjee and Duflo's 'Good Economics for Hard Times' (2019) is more explicit than 'Poor Economics' about the limits of RCT-only inference."},{num:6,title:"Participatory experiments, or constructing the field",pages:"74-97",what:"The most substantively distinct chapter. Introduces a 'third strand' not in the standard Harrison-List typology: participatory experiments. Traces the participatory tradition from Kurt Lewin's action research (1940s), through Robert Chambers's participatory rural appraisal (PRA) in development practice, to contemporary participatory experiments in sustainability science and development economics. Connects this to Amartya Sen's capability approach and the operationalisations by Robeyns (2003) and Alkire (2005). Discusses Sheila Jasanoff's STS framework of co-production of knowledge and governance.",keyConcepts:["Participatory experiments as a third strand alongside lab-extension and policy-evaluation","Kurt Lewin's action research (1940s) as the origin","Robert Chambers's PRA (Participatory Rural Appraisal) tradition","Sen's capability approach: capabilities = capacities + possibilities","Robeyns (2003), Alkire (2005) operationalisations; Nussbaum's list (which Sen opposes)","Sheila Jasanoff's co-production thesis: knowledge and governance produce each other","Control in participatory experiments differs from lab-strand and policy-strand control"],arguments:"Both the lab-extension and the policy-evaluation strands position the experimenter as the source of intervention and the subjects as the object of study. Participatory approaches invert this: research subjects co-design the intervention, co-interpret the results, and exercise meaningful control over how findings are used. This is not just methodological window dressing — it changes what counts as a valid result and what role science plays in governance. Sen's capability approach supplies the philosophical foundation for why participatory methods are needed: capabilities are what individuals themselves should identify and weight through public reasoning, not what outside experts assign.",southAsia:"This chapter is the most directly relevant to Indian development practice. Robert Chambers spent significant time in India developing PRA. The Indian NGO sector (PRADAN, MYRADA, SEWA) has used participatory methods for decades. Sen's capability approach was developed with sustained engagement with Indian poverty data. The contrast between J-PAL's lab-coat empiricism and the participatory tradition is a live debate in Indian development economics, sometimes framed as the Banerjee-Duflo vs Sen-Drèze divide (though both Banerjee and Drèze have explicitly resisted this framing)."},{num:7,title:"Conclusion",pages:"98-102",what:"Synthesises the argument. The unified framework treats lab-extension, policy-evaluation, and participatory experiments as three complementary methodological approaches, each suited to different epistemic and political questions. Returns to the political and ethical values embedded in experimental design and emphasises the need to make these values explicit rather than hide them behind methodological technicalities.",keyConcepts:["Three-strand framework: lab-extension, policy-evaluation, participatory","Methodological pluralism, not methodological monism","Ethical and political values are constitutive of experimental design, not external to it","Open methodological questions for future research"],arguments:"The book closes by arguing for methodological pluralism. The Nobel Prize awarded to Banerjee, Duflo, and Kremer in 2019 marked the institutional consolidation of the policy-evaluation strand. The authors argue this should not become a methodological monopoly: lab-extension experiments answer different questions, and participatory experiments answer still others. The political question is who gets to decide which questions matter.",southAsia:"The pluralism argument matters for Indian dev econ pedagogy. J-PAL training (now institutionalised at ISB and at Krea/IFMR) emphasises RCT methods; doctoral programmes at JNU, ISI, and DSE retain stronger qualitative and political-economy traditions. The book suggests these are not rivals but partners, though that framing is itself contested."}],c=[{title:"Deaton's critique (2010, JEL)",summary:"RCTs estimate an average treatment effect at a specific site. The average may not apply to any actual individual or context. Worse, RCTs systematically displace attention from the structural causes of poverty toward small, evaluable interventions.",book:"Treated at length in Ch 4, especially in the discussion of generalisability. The authors take Deaton's critique seriously and use it to motivate the unified framework in Ch 5.",reading:"Deaton (2010), 'Instruments, Randomization, and Learning about Development', JEL 48(2). Deaton & Cartwright (2018), 'Understanding and misunderstanding randomized controlled trials', SSM."},{title:"Cartwright's critique",summary:"Causal inference requires a theory of mechanism, not just a clean identification strategy. Randomisation is a useful tool but it does not, by itself, license claims about causal mechanisms or about transportability of findings to new settings. You need to know why the result happened to know whether it will happen again.",book:"Anchors much of Ch 4. The authors propose that combining RFEs with qualitative case studies (Ch 5) is one practical response: case work supplies the mechanism theory that randomisation cannot.",reading:"Cartwright & Hardie (2012), 'Evidence-Based Policy: A Practical Guide to Doing It Better'. Cartwright (2007), 'Are RCTs the Gold Standard?'."},{title:"Pritchett & Sandefur's critique",summary:"External validity claims in published RCTs typically extrapolate well beyond what the evidence licenses. Policy uptake of RCT findings often ignores the heterogeneity in the underlying data and the gap between trial setting and policy setting.",book:"Cited in Ch 4. Pritchett's broader work on the limits of evidence-based policy is implicit throughout the book's critique of the second strand.",reading:"Pritchett & Sandefur (2015), 'Learning from experiments when context matters', AER P&P. Pritchett (2002), 'When will they ever learn? Why all governments produce schooling'."},{title:"Ravallion's critique",summary:"Development economics had a rich tradition of programme evaluation using observational and quasi-experimental methods (matching, IV, regression discontinuity, DiD) before RCTs arrived. The framing of RCTs as a 'credibility revolution' overstates the prior state and understates the substantive trade-offs.",book:"Implicit in Ch 3's historical reconstruction. The authors argue the two-strand history makes more sense than the credibility-revolution narrative.",reading:"Ravallion (2009, 2018) various critiques in WBRO and elsewhere. Ravallion (2020), 'Should the randomistas (continue to) rule?', NBER WP 27554."},{title:"Banerjee-Duflo response: structured speculative judgments",summary:"Banerjee, Duflo, Glennerster, and Kothari (2017) propose that researchers can responsibly extrapolate RCT findings to new contexts by making explicit, structured judgments about which features of the experimental setting matter for the result. This is an honest acknowledgement that external validity requires judgment beyond the data.",book:"Discussed in Ch 4 §4.4. The authors note this is a promising direction but the practice has not yet caught up with the proposal.",reading:"Banerjee, Duflo, Glennerster, Kothari (2017), 'The Miracle of Microfinance? Evidence from a Randomized Evaluation', AEJ:Applied. Vivalt (2020), 'How much can we generalize from impact evaluations?', JEEA."},{title:"Chernozhukov et al.: ML for heterogeneous treatment effects",summary:"Machine learning methods (causal forests, generic ML) can estimate how treatment effects vary across covariates in an RCT. This is a technical response to the heterogeneity question raised by Deaton: rather than assuming the ATE applies everywhere, estimate where it applies and where it doesn't.",book:"Mentioned in Ch 4 §4.4. The authors are cautiously positive but note this addresses only one slice of the external validity problem.",reading:"Chernozhukov, Demirer, Duflo, Fernández-Val (2018), 'Generic Machine Learning Inference on Heterogeneous Treatment Effects'. Wager & Athey (2018), 'Estimation and Inference of Heterogeneous Treatment Effects using Random Forests', JASA."}],d=[{label:"Pratham TaRL evaluations",citation:"Banerjee, Banerji, Berry, Duflo, Kannan, Mukerji, Shotland, Walton (2017), JEP",strand:"Policy-evaluation",note:"Multi-state stratified cluster RCTs of Teaching at the Right Level. The book's framework would ask: does the Bihar result transport to Madhya Pradesh? The studies themselves engage with this honestly but the policy uptake has been more confident than the data licenses."},{label:"NREGA biometric smartcards",citation:"Muralidharan, Niehaus, Sukhtankar (2016), AER",strand:"Policy-evaluation, with quasi-experimental design",note:"Stepped-wedge cluster RCT across Andhra Pradesh sub-districts. A landmark second-strand study. The authors note in 2016 the Andhra context (relatively high state capacity by Indian standards) limits generalisation to weaker-capacity states."},{label:"Teacher absenteeism, Rajasthan",citation:"Duflo, Hanna, Ryan (2012), AER",strand:"Policy-evaluation",note:"Cluster RCT with NGO-administered camera-based monitoring of teachers. Effect on attendance is large; effect on learning is smaller. Mechanism: incentives changed behaviour but not pedagogy. Illustrates Cartwright's point about needing mechanism theory."},{label:"Microfinance impact",citation:"Banerjee, Duflo, Glennerster, Kinnan (2015), AEJ:Applied",strand:"Policy-evaluation",note:"Hyderabad slum cluster RCT. Notable for the authors' explicit treatment of structured speculative judgments in companion papers (Banerjee et al. 2017). Findings: microfinance has positive but modest effects, less transformative than the original microfinance literature claimed."},{label:"PRA tradition, Indian NGOs",citation:"Chambers (1994, 1997); ongoing PRADAN, MYRADA, SEWA work",strand:"Participatory",note:"Robert Chambers developed PRA in significant part through Indian fieldwork. PRADAN's livelihood programmes, MYRADA's self-help group work, SEWA's organising methodology all draw on participatory traditions that the book identifies as the third strand. These rarely appear in J-PAL bibliographies."},{label:"Drèze-Sen capabilities critique",citation:"Drèze & Sen (2013), 'An Uncertain Glory: India and its Contradictions'",strand:"Cross-strand commentary",note:"Drèze and Sen argue that India's development trajectory cannot be evaluated through average effects on narrow outcomes. The capability approach insists that outcomes be identified and weighted by the people they affect. This is the philosophical position the book's third strand articulates."}],f={lineHeight:1.7,color:"#1e293b",marginBottom:"1rem",fontSize:"1rem"},p={background:"white",border:"1px solid #e2e8f0",borderRadius:8,padding:"1.25rem",boxShadow:"0 1px 2px rgba(15, 23, 42, 0.04)"},h={color:"#D4520A",textDecoration:"underline"};function m({children:e}){return(0,l.jsx)("h2",{style:{fontFamily:"Inter, sans-serif",fontSize:"1.5rem",color:"#0F172A",marginTop:"2rem",marginBottom:"0.75rem",fontWeight:700,letterSpacing:"-0.01em"},children:e})}function g({children:e}){return(0,l.jsx)("div",{style:{fontFamily:"Inter, sans-serif",fontSize:"0.75rem",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.1em",color:"#1e3a5f",marginTop:"1rem",marginBottom:"0.5rem"},children:e})}function y(){return(0,l.jsxs)("div",{children:[(0,l.jsx)(m,{children:"What this book is"}),(0,l.jsxs)("p",{style:f,children:[(0,l.jsx)("em",{children:"Field Experiments in Economics: History and Methodology"})," (Routledge, 2025) is a history-and-philosophy-of-science treatment of how field experiments became dominant in empirical economics. The authors are Judith Favereau (Lyon 2, philosophy of economics) and Michiru Nagatsu (Helsinki, philosophy of social science). Open access via the Universities of Lyon 2 and Helsinki."]}),(0,l.jsx)("p",{style:f,children:"The book is short — 7 chapters across about 100 pages — but it does substantial work. It is not a how-to manual for running RCTs (for that, see Glennerster & Takavarasha 2013). It is a critical examination of how the methodology evolved, what its proponents claim for it, and where those claims outrun the evidence."}),(0,l.jsx)(m,{children:"The core thesis"}),(0,l.jsxs)("p",{style:f,children:["Field experiments in economics come from ",(0,l.jsx)("strong",{children:"two distinct historical strands"})," ","with different aims and different methodological commitments:"]}),(0,l.jsxs)("ol",{style:{...f,paddingLeft:"1.5rem"},children:[(0,l.jsxs)("li",{children:[(0,l.jsx)("strong",{children:"Lab-extension strand."})," Field experiments that extend laboratory experimental economics into naturalistic settings. Origin: Vernon Smith's market experiments (1962), Charles Plott's auction work, John List's sports card show auctions (List & Lucking-Reiley 2000). Aim: test economic theories under more realistic conditions while preserving controlled assignment of treatments."]}),(0,l.jsxs)("li",{children:[(0,l.jsx)("strong",{children:"Policy-evaluation strand."})," Field experiments as a tool for evaluating social programmes. Origin: the US Negative Income Tax experiments of the 1960s and 1970s. Aim: estimate the effect of a programme on a relevant population so that policymakers can make resource-allocation decisions. Current practitioners: Banerjee, Duflo, Kremer (Nobel Prize 2019), and the J-PAL network."]})]}),(0,l.jsx)("p",{style:f,children:"The book argues that conflating the two strands has produced confused methodological debates, especially around external validity. The unified framework the authors propose treats the strands as complementary, with a third strand (participatory experiments) added in Chapter 6."}),(0,l.jsx)(m,{children:"Why a development economist should read this"}),(0,l.jsx)("p",{style:f,children:"Most Indian development economics work in the empirical mode sits in the policy-evaluation strand without recognising that the methodology has alternatives. The book provides three things a working practitioner can use:"}),(0,l.jsxs)("ul",{style:{...f,paddingLeft:"1.5rem"},children:[(0,l.jsx)("li",{children:"A historically grounded vocabulary for the methodological debates around RCTs. The Deaton-Cartwright-Pritchett critiques and the Banerjee-Duflo responses become easier to position once you can name which strand is making which move."}),(0,l.jsx)("li",{children:"A serious treatment of the participatory tradition (Robert Chambers, Sen's capabilities, Robeyns, Alkire) as a third methodological strand, not just an NGO-world alternative to academic econ."}),(0,l.jsx)("li",{children:"An explicit acknowledgement that experimental design carries ethical and political values. The choice of outcome, the choice of comparison group, the choice of subpopulation — these are not technical decisions; they are political ones."})]}),(0,l.jsx)(m,{children:"Companion structure"}),(0,l.jsxs)("ul",{style:{...f,paddingLeft:"1.5rem"},children:[(0,l.jsxs)("li",{children:[(0,l.jsx)("strong",{children:"Two Strands"}),": the central historical claim laid out, with major figures and works in each strand."]}),(0,l.jsxs)("li",{children:[(0,l.jsx)("strong",{children:"Chapter Map"}),": all 7 chapters with what they argue, key concepts, and South Asia application notes."]}),(0,l.jsxs)("li",{children:[(0,l.jsx)("strong",{children:"Validity Debate"}),": the critiques (Deaton, Cartwright, Pritchett, Ravallion) and the responses (structured judgments, ML for heterogeneity)."]}),(0,l.jsxs)("li",{children:[(0,l.jsx)("strong",{children:"Participatory Turn"}),": the third strand, its origins in Lewin and Chambers, its philosophical anchor in Sen."]}),(0,l.jsxs)("li",{children:[(0,l.jsx)("strong",{children:"South Asia Lens"}),": how the debates play out in Indian dev econ, with named studies."]}),(0,l.jsxs)("li",{children:[(0,l.jsx)("strong",{children:"Ask"}),": Gemini Q&A trained on this companion's content."]})]})]})}function v(){return(0,l.jsxs)("div",{children:[(0,l.jsx)(m,{children:"The two-strand thesis, in one paragraph"}),(0,l.jsx)("p",{style:f,children:"Field experiments in economics share a name but not a parentage. One lineage grew out of experimental economics in the lab; the other grew out of social policy evaluation traditions that include the US Negative Income Tax experiments, medical RCTs, and agricultural field trials going back to R. A. Fisher in the 1920s. The two lineages carry different assumptions about what control means, what external validity is, and what the experiment is for."}),(0,l.jsxs)("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit, minmax(320px, 1fr))",gap:"1.25rem",marginTop:"1.5rem"},children:[(0,l.jsxs)("div",{style:{...p,borderTop:"4px solid #1e3a5f"},children:[(0,l.jsx)("div",{style:{fontFamily:"Inter, sans-serif",fontSize:"0.7rem",letterSpacing:"0.1em",textTransform:"uppercase",color:"#1e3a5f",fontWeight:700,marginBottom:"0.4rem"},children:"First strand"}),(0,l.jsx)("h3",{style:{fontFamily:"Inter, sans-serif",fontSize:"1.25rem",margin:"0 0 0.75rem",color:"#0F172A"},children:"Lab-extension"}),(0,l.jsx)("p",{style:{...f,fontSize:"0.95rem"},children:"Field experiments are seen as extensions of laboratory economic experiments. The lab is the reference point; the field is a less controlled but more naturalistic setting in which lab findings can be probed for robustness."}),(0,l.jsx)(g,{children:"Origin and key figures"}),(0,l.jsxs)("ul",{style:{...f,paddingLeft:"1.25rem",fontSize:"0.92rem"},children:[(0,l.jsxs)("li",{children:[(0,l.jsx)("strong",{children:"Vernon Smith"})," — induced-value market experiments (1962), Nobel Prize 2002"]}),(0,l.jsxs)("li",{children:[(0,l.jsx)("strong",{children:"Charles Plott"})," — auction experiments, public goods experiments"]}),(0,l.jsxs)("li",{children:[(0,l.jsx)("strong",{children:"Glenn Harrison & John List (2004)"})," — JEL survey that became the standard typology of field experiments along a lab-to-field continuum"]}),(0,l.jsxs)("li",{children:[(0,l.jsx)("strong",{children:"John List & David Lucking-Reiley (2000)"})," — sports card auction experiments, Denver 1995"]}),(0,l.jsxs)("li",{children:[(0,l.jsx)("strong",{children:"Pascaline Dupas"})," — bednet pricing experiments in Kenya (Cohen & Dupas 2010), which the book treats as second-strand but uses first-strand techniques"]})]}),(0,l.jsx)(g,{children:"Conception of control"}),(0,l.jsx)("p",{style:{...f,fontSize:"0.92rem",marginBottom:0},children:"Control over variables. The experimenter constructs the choice environment, specifies the action set, induces preferences via monetary incentives, and varies specific parameters between treatment arms."})]}),(0,l.jsxs)("div",{style:{...p,borderTop:"4px solid #D4520A"},children:[(0,l.jsx)("div",{style:{fontFamily:"Inter, sans-serif",fontSize:"0.7rem",letterSpacing:"0.1em",textTransform:"uppercase",color:"#D4520A",fontWeight:700,marginBottom:"0.4rem"},children:"Second strand"}),(0,l.jsx)("h3",{style:{fontFamily:"Inter, sans-serif",fontSize:"1.25rem",margin:"0 0 0.75rem",color:"#0F172A"},children:"Policy-evaluation"}),(0,l.jsx)("p",{style:{...f,fontSize:"0.95rem"},children:"Field experiments are seen as tools for evaluating so or a specific village population at a specific time. Will the same effect hold for a different population or a different time? The two faces of external validity are not the same problem, and proposed responses to one face may not address the other."}),(0,l.jsx)("p",{style:f,children:"The same applies to control. Lab-strand control over variables is mostly about ruling out confounders within the experiment. Policy-strand control over assignment is mostly about ruling out selection between treatment and comparison groups. Both are species of control, but they protect against different threats."}),(0,l.jsx)(m,{children:"Spectrum of empirical methods (Fig 3.1)"}),(0,l.jsx)("p",{style:f,children:"The book's Figure 3.1 places empirical methods on a spectrum from purely controlled (laboratory experiments) to purely naturally-occurring (observational data and historical analysis). Between these poles sit artefactual field experiments, framed field experiments, natural field experiments (Harrison & List's terms), randomised field experiments (the second strand's category), natural experiments (in the IV/RDD sense of Angrist and Krueger), and quasi-experiments. The spectrum is a useful teaching device but the book is careful to note that the lab-to-field continuum is only one dimension; the epistemic-vs-policy distinction is orthogonal to it."})]})}function b({expandedChapter:e,setExpandedChapter:t}){return(0,l.jsxs)("div",{children:[(0,l.jsx)(m,{children:"All 7 chapters"}),(0,l.jsx)("p",{style:f,children:"The book is short and densely argued. Each chapter card below summarises what the chapter does, its key concepts, its central argument, and its application to South Asian development practice."}),(0,l.jsx)("div",{style:{display:"grid",gap:"0.75rem",marginTop:"1.5rem"},children:u.map(n=>(0,l.jsx)(w,{ch:n,expanded:e===n.num,onToggle:()=>t(e===n.num?null:n.num)},n.num))})]})}function w({ch:e,expanded:t,onToggle:n}){return(0,l.jsxs)("div",{style:{...p,padding:0,overflow:"hidde
