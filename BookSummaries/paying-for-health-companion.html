"Ajay Tandon, Christoph Kurowski, David B. Evans (World Bank)",what:"Compares the two main public revenue mechanisms — general taxation and social health insurance (SHI) — and argues both can support progress to UHC but that LMICs with large informal economies cannot rely on contributory SHI alone. The chapter is the most directly relevant of the volume for Indian policymakers because Tandon and Kurowski are among the World Bank's senior India health-financing economists.",keyConcepts:["General taxation: broad-based, less volatile, dependent on revenue mobilisation capacity","Social health insurance: contributory, payroll-linked, hard to extend to informal workers","The blurring of the distinction: most countries now mix the two","Earmarked taxes (tobacco, alcohol, sugar) as additional revenue streams","Old-age dependency ratio rising in middle-income countries; SHI sustainability under pressure","Box 1.1.1 on India's parallel tax and SHI systems: PM-JAY (tax-financed), CGHS (central govt employees), ESIS (private formal-sector workers)"],indiaApp:"India's case is treated explicitly in Box 1.1.1. The chapter's key argument that LMICs with high informality should not over-rely on SHI directly speaks to India: about 90% of India's workforce is informal (PLFS 2022-23). The shift from contributory schemes (RSBY 2008, replaced) to tax-financed PM-JAY (2018) reflects exactly the trajectory the chapter recommends."},{id:"1.2",section:"Revenue raising",sectionRoman:"1",num:"1.2",title:"Community-based health insurance",pages:"63-90",authors:"Lucy Kanya, Manuela De Allegri, Valéry Ridde",what:"Examines community-based health insurance (CBHI) schemes — voluntary, often donor-supported, locally administered risk pools — common in sub-Saharan Africa and parts of South Asia. Concludes CBHI is insufficient on its own for UHC progress but can act as a stepping stone, generating organisational capacity and community trust that later supports mandatory pooling.",keyConcepts:["Community ownership and participatory management as defining features","Voluntary enrolment leads to adverse selection: the sickest enrol, the healthy don't, premiums rise","CBHI as a precursor to formal insurance in 19th-20th century Europe","Ridde et al. (2018) BMJ Global Health: time to move beyond amateurism and volunteerism","Limited risk pooling because pools are small and demographically narrow"],indiaApp:"SEWA's community health work in Gujarat, Yeshasvini Trust in Karnataka (a cooperative-based scheme), and various microinsurance products by Indian NGOs sit in this category. The Yeshasvini scheme covered farmers in Karnataka cooperatives from 2003; uptake was sustained but coverage shallow. CBHI in India is a small share of total financing and the chapter's verdict (insufficient for UHC) matches the Indian policy direction toward PM-JAY-style tax-financed cover."},{id:"1.3",section:"Revenue raising",sectionRoman:"1",num:"1.3",title:"Voluntary health insurance",pages:"91-115",authors:"Anna Sagan, Sarah Thomson",what:"Covers private VHI markets: their structure, regulation, market failures, and equity implications. VHI accounts for 10%+ of health spending in only a handful of countries, mostly in the Americas. Its expansion does not, on the evidence, reduce OOP — public spending growth does that.",keyConcepts:["VHI types: substitutive (replaces public), complementary (fills gaps), supplementary (better access)","Risk selection by insurers; adverse selection by consumers; both lead to market segmentation","Regulatory tools: community rating, mandatory open enrolment, risk equalisation","Figure 1.3.5: public spending reduces OOP more than VHI does","VHI rarely a substitute for public financing in UHC progress"],indiaApp:"India's private health insurance market grew rapidly post-2000 with IRDAI-regulated standalone health insurers (Star Health, Niva Bupa, ManipalCigna) and group employer products. NSSO 75th round (2017-18) found only about 14% of Indian households had any health insurance cover including PM-JAY. Premium intensity is low; reimbursement frequently denied for high-cost claims. The chapter's verdict that VHI does not substitute for public financing is directly applicable: private cover in India has not reduced OOP at the system level."},{id:"1.4",section:"Revenue raising",sectionRoman:"1",num:"1.4",title:"Official development assistance for health",pages:"116-134",authors:"Azusa Sato",what:"Examines health ODA: its history, key actors (Gavi, the Global Fund, World Bank, bilateral donors), and limits. Makes a case for ODA's continuing importance especially post-COVID, while noting the trend toward graduation of middle-income countries out of donor eligibility.",keyConcepts:["Major actors: Global Fund (HIV/TB/malaria), Gavi (vaccines), GFF, World Bank IDA","Fragmentation of donor financing as a transaction-cost problem for recipient ministries","Sustainability and transition: how countries graduate from ODA dependence","Pooled funding vs project funding tradeoffs","COVID-19 disruption: ODA prioritised pandemic response, displacing other priorities"],indiaApp:"India is now a net contributor rather than recipient in most categorisations. The Global Fund continues in India for HIV/TB programming. India's own development aid (the India Development Initiative, lines of credit through Exim Bank) increasingly mirrors traditional donor instruments. Lessons from the chapter on coordination and fragmentation apply to India's own donor activity in Africa."},{id:"2.1",section:"Pooling and benefits",sectionRoman:"2",num:"2.1",title:"Approaches to risk pooling",pages:"137-164",authors:"Sophie Witter, Joseph Kutzin, Susan Sparkes (WHO)",what:"The most conceptually important chapter in Section 2. Develops a typology of pooling arrangements (Figure 2.1.1) and argues that the size, breadth, and depth of pools determine how effectively financial protection is delivered. Larger, more demographically diverse pools handle risk better.",keyConcepts:["Pool size matters: small pools are unstable, large pools are not","Pool breadth (coverage of population) and depth (services included) as separate dimensions","Fragmentation of pools (by region, occupation, scheme) reduces redistributive capacity","Single-payer vs multi-payer architectures: tradeoffs","Risk equalisation mechanisms when multiple pools coexist"],indiaApp:"India's pooling is severely fragmented: PM-JAY (national tax-financed for bottom 40%), CGHS (central government), ESIS (formal-sector private workers), state health insurance schemes in TN, Karnataka, AP/Telangana, Rajasthan (each with different benefits), private VHI, and the residual public delivery system. This fragmentation is exactly what the chapter warns against. Recent moves to integrate state schemes under PM-JAY (the 'AB-PMJAY' umbrella) try to address this but coverage gaps remain."},{id:"2.2",section:"Pooling and benefits",sectionRoman:"2",num:"2.2",title:"Setting a health benefits package",pages:"165-195",authors:"Michael Drummond, Aleksandra Torbica, Jonas Schreyögg",what:"How countries decide what services to cover. Covers HTA (health technology assessment), priority-setting frameworks, the 'best buys' analysis (Figure 2.2.2), and context-specific application (Figure 2.2.3). Drummond is one of the architects of HTA methodology globally.",keyConcepts:["Three dimensions of benefits: cost, services covered, population covered (Figure 2.2.1, the WHO cube)","HTA: cost-effectiveness analysis, budget impact, equity weighting","Disease control priorities (DCP3) as a global reference","Marginal cost-effectiveness: which intervention to add at the next budget threshold","Procedural justice: who decides what is in the package"],indiaApp:"India established the Health Technology Assessment Board (HTAIn) under DHR in 2017. HTAIn studies inform PM-JAY package design but the package is criticised for being hospital-care heavy and primary-care light (Reddy 2020, EPW). The chapter's framework is directly usable for HTAIn's methodological development."},{id:"2.3",section:"Pooling and benefits",sectionRoman:"2",num:"2.3",title:"Decommissioning and disinvestment",pages:"196-223",authors:"Michael Anderson, Humza Malik, Elias Mossialos",what:"The mirror image of benefits-package expansion: how to remove low-value care from coverage. Frames disinvestment as a political-economy problem more than a technical one. Develops a conceptual framework (Figure 2.3.1) and reviews country experiences.",keyConcepts:["Low-value care: interventions with little or no benefit but real costs","Choosing Wisely campaigns (US, UK, Canada) as professional-led disinvestment","Political-economy barriers: providers, suppliers, and patients all resist","NICE in the UK, IQWiG in Germany as institutional disinvestment mechanisms","Why disinvestment is harder than investment: salience and concentrated losses"],indiaApp:"Disinvestment is barely on India's policy agenda. PM-JAY's package design has expanded with each revision; no procedure has been removed for low-value-care reasons. The political economy is more acute in India because private providers run a large share of hospital care under PM-JAY contracts and have organised resistance to rate cuts (Reddy & Mary 2013, BMJ)."},{id:"2.4",section:"Pooling and benefits",sectionRoman:"2",num:"2.4",title:"User charges",pages:"224-244",authors:"Jonathan Cylus, Riya Doshi, Sarah Thomson, Tamás Evetovits",what:"User charges (co-payments, deductibles, ceilings) as a financing mechanism and as a barrier to access. The chapter is empirically pointed: OOP spending disproportionately finances pharmacies (Figure 2.4.1); the poorest quintile experiences the highest catastrophic spending (Figure 2.4.2); user charges push households into and below the poverty line (Figure 2.4.3).",keyConcepts:["User charges reduce utilisation, but disproportionately reduce poor households' use","Catastrophic health spending: when OOP exceeds 10% (or 25%) of household consumption","Impoverishing health spending: when OOP pushes households below the poverty line","Pharmacies and outpatient care are where OOP concentrates","Exemption mechanisms (means-tested, conditions-based) often fail to reach intended beneficiaries"],indiaApp:"India is the global poster child for the costs of high user charges. NSSO 75th round (2017-18) found that medicines account for over 70% of OOP. About 7% of Indian households face catastrophic health spending; about 4% are pushed below the poverty line each year by health costs (Garg & Karan 2009, Health Policy & Planning; updates by Bhojani et al.). PM-JAY targets hospitalisation but the OOP burden is largely outpatient and pharmacy, so the policy design only partially addresses the documented problem."},{id:"2.5",section:"Pooling and benefits",sectionRoman:"2",num:"2.5",title:"Long-term care: financing and provision",pages:"245-282",authors:"Hashiguchi, Llena-Nozal, Mueller, Regalado, Rocard, Colombo (OECD)",what:"Long-term care (LTC) financing — a near-blind spot in most LMIC health policy. OECD-heavy chapter examining ageing-driven LTC demand, formal vs informal carers (gendered: Figure 2.5.3 shows women provide most informal care), and financing mechanisms.",keyConcepts:["LTC: care for people with chronic conditions who need help with daily activities","Informal care (family, mostly women) does the bulk of LTC; valuing it economically is contested","OECD trend (Figure 2.5.4): shift from residential to community LTC","Nursing home spending is the largest LTC cost category (Figure 2.5.6)","Without public LTC, older people are pushed into poverty (Figure 2.5.7)"],indiaApp:"India's old-age population is projected to nearly double from about 138 million (2021) to 230+ million by 2036 (Population Projections, NCP 2020). National Programme for Health Care of the Elderly (NPHCE) exists but is small. LTC policy is essentially absent at scale; care happens within families, with disproportionate burden on women. The chapter's OECD frame is directly usable when India's policy catches up to its demographic transition."},{id:"3.1",section:"Commissioning and purchasing",sectionRoman:"3",num:"3.1",title:"Paying for primary care",pages:"285-319",authors:"Anne Sophie Oxholm, Anthony Scott",what:"Provider payment mechanisms for primary care: capitation, fee-for-service, salary, blended models. Reviews evidence on incentive effects: capitation contains costs but risks under-provision; FFS expands volume but inflates costs; salary is neutral on volume but doesn't reward quality.",keyConcepts:["Capitation: pay per registered patient, regardless of utilisation","Fee-for-service: pay per service, drives volume","Pay-for-performance (P4P): conditional on quality indicators","Blended payment: combine mechanisms to balance incentives","Risk adjustment of capitation: morbidity, age, deprivation"],indiaApp:"Primary care payment in India is heterogeneous. Public PHCs are salaried; PM-JAY targets hospitalisation only (not primary care); the Health and Wellness Centres rolled out from 2018 are an attempt to add primary care to the financing architecture, salaried but with limited performance components. AYUSH practitioners and private GPs operate on FFS in cash markets. India has no national capitation system. The chapter's framework gives the menu of options if India ever extends national insurance to primary care."},{id:"3.2",section:"Commissioning and purchasing",sectionRoman:"3",num:"3.2",title:"Methods for paying hospitals",pages:"320-359",authors:"Stephen Duckett, Andrew Street, Chris Walters",what:"Hospital payment: line-item budgets, per-diem, DRGs (diagnosis-related groups), global budgets, P4P. Duckett and Street are leading global authorities. The chapter is a methodological reference for any country designing a hospital payment system.",keyConcepts:["DRG (Diagnosis-Related Groups): payment per case classified by clinical similarity and cost","Activity-based funding vs block grant","Volume controls: ceilings, marginal rate cuts, prospective budgets","Quality adjustment: pay-for-performance, never-events penalties","Strategic purchasing: using payment to drive system goals"],indiaApp:"PM-JAY pays empanelled hospitals under a package-rate system (HBP, Health Benefits Package) that functions like a simplified DRG. Rates are administratively set (revised in 2019 and 2022) and have been criticised by hospital associations as below cost; some have de-empanelled. The chapter's framework on volume control and quality adjustment is directly applicable as PM-JAY's payment system matures."},{id:"3.3",section:"Commissioning and purchasing",sectionRoman:"3",num:"3.3",title:"Informal payments in health care",pages:"360-404",authors:"Sara Allin, Ilias Kyriopoulos, Iva Parvanova",what:"Informal payments — under-the-counter payments from patients to providers — as a financing reality in many LMIC and post-Soviet health systems. The chapter reviews drivers (low formal salaries, gatekeeping power, weak governance) and consequences (regressive, opaque, undermines reform).",keyConcepts:["Informal payments persist where formal salaries are low and oversight is weak","They are a regressive form of financing: the poor pay disproportionately","Anti-corruption alone has limited effect; combined with salary reform and transparency, more","Patient-perception surveys as a measurement tool (despite under-reporting)","Distinguish gratitude payments (post-care) from extractive payments (pre-care)"],indiaApp:"Informal payments are well-documented in Indian public hospitals — to admit, to access better wards, to obtain medicines from supposedly free stock, to schedule surgery. Yip and Mahal (2008) document this for India. PM-JAY's empanelment of private hospitals was partly motivated by avoiding the public-hospital informal-payment problem, but research suggests informal payments persist even under PM-JAY (Sundararaman et al. 2021)."},{id:"3.4",section:"Commissioning and purchasing",sectionRoman:"3",num:"3.4",title:"Paying for medicines",pages:"405-451",authors:"Nicole Mauer, Daniela Moye Holz, Sabine Vogler, Dimitra Panteli",what:"Pharmaceutical financing: external reference pricing, internal reference pricing, generic substitution, central procurement, value-based pricing. Reviews European experience and discusses LMIC challenges.",keyConcepts:["External reference pricing: price benchmarked to other countries","Tendering and central procurement: aggregating demand to negotiate prices","Value-based pricing: pay for clinical value, not cost-plus","Patent-related access barriers; compulsory licensing as a tool","Generic medicines as a major lever for affordability"],indiaApp:"India is globally significant in pharmaceutical financing because of its generics industry (about 20% of global generics by volume). Domestically, Jan Aushadhi (PMBJP) generic outlets provide cheap generics through a state-supported retail network. The Drug Price Control Order (DPCO) under NPPA caps prices on essential drugs. India's Section 3(d) of the Patents Act 2005 (no patents for incremental innovation without enhanced efficacy) has been globally contested but supports generic access (Novartis v. Union of India, 2013 SC)."},{id:"3.5",section:"Commissioning and purchasing",sectionRoman:"3",num:"3.5",title:"Paying for integrated care",pages:"452-477",authors:"Søren Rud Kristensen, Ewout van Ginneken, Matthew Sutton",what:"Integrated care models cross-cut the primary-secondary-tertiary divide and the medical-social care divide. Payment mechanisms include bundled payments, capitation across providers, and shared-savings models. Evidence is mixed; integration is hard.",keyConcepts:["Bundled payments: single payment covering an episode of care across providers","Accountable care organisations (US) and integrated care systems (UK)","Shared savings: providers share in cost reductions if quality is maintained","Integration is mostly a structural and governance problem; payment is one lever among many","Equity concerns: integrated systems can entrench existing inequalities"],indiaApp:"India's HWC roll-out under Ayushman Bharat is a structural attempt at integration (primary screening flowing into secondary care). Financing remains siloed (HWCs funded by NHM, PM-JAY for hospitalisation, state schemes patchy). Integrated payment is not yet on the agenda; the architecture is still being built."},{id:"3.6",section:"Commissioning and purchasing",sectionRoman:"3",num:"3.6",title:"Balancing incentives to promote quality and improve long-term care",pages:"478-514",authors:"Ruth Waitzberg, Sharona Tsadok Rosenbluth",what:"Pay-for-performance (P4P) and quality incentives in the LTC and acute care contexts. Reviews evidence on what works (small effects, often) and what backfires (gaming, teaching to the test, neglect of unmeasured dimensions).",keyConcepts:["P4P design: indicator choice, reward size, attribution to providers","Gaming and teaching-to-the-test as predictable side effects","Quality measurement difficulty in LTC (process vs outcome)","Composite indicators vs single-dimension indicators","Equity adjustments to avoid penalising providers who serve high-need populations"],indiaApp:"PM-JAY rolled out a Quality Quotient in 2020 affecting payment rates. The Quality Council of India certifies hospitals; rates differ by certification level. Indian primary-care P4P experiments (Tara Khanijow's work in Tamil Nadu, the NRHM facility-grading scheme) have produced small effects with familiar gaming concerns."},{id:"3.7",section:"Commissioning and purchasing",sectionRoman:"3",num:"3.7",title:"From vertical to horizontal priority-setting",pages:"515-539",authors:"Ranjeeta Thomas, Kalipso Chalkidou",what:"How disease-specific vertical programmes (HIV/AIDS, TB, malaria, immunisation) interact with horizontal health systems strengthening. Chalkidou (IDSI, NICE-International alumna) has led much of the global HTA-for-LMIC work. The chapter argues for blended approaches rather than ideological camps.",keyConcepts:["Vertical: disease-specific, often donor-funded, parallel delivery structures","Horizontal: health-system-wide, government-led, integrated","Diagonal: vertical disease focus delivered through horizontal systems","Donor-driven verticalisation as a transaction-cost burden on ministries","HTA as a tool for horizontal priority-setting"],indiaApp:"India's NHM merged formerly vertical programmes (NACO for HIV, RNTCP for TB, NVBDCP for vector-borne diseases) under one umbrella but operationally they remain semi-vertical. Donor financing (Global Fund, GAVI) reinforces verticalisation. The chapter's diagonal framing matches what NHM increasingly does: vertical disease targets, horizontal delivery."},{id:"3.8",section:"Commissioning and purchasing",sectionRoman:"3",num:"3.8",title:"Financing pandemic preparedness",pages:"540-571",authors:"Susan Sparkes, Andrew Mirelman, Alexandra Earle, Ankur Rakesh, Jonathan Abrahams (WHO)",what:"How to finance pandemic preparedness — surveillance, early warning, surge capacity, vaccine and therapeutic stockpiles — as a public good. Post-COVID, the chapter draws on the IHR (2005) framework and the FIF (Pandemic Fund, 2022). Argues domestic resource mobilisation, not donor financing, must be the foundation.",keyConcepts:["Pandemic preparedness as a global public good with under-investment in normal times","IHR 2005 core capacities as the international floor","Pandemic Fund (FIF at the World Bank, 2022) as a global pooled financing mechanism","Domestic financing vs ODA: the financing-gap arithmetic","Surge capacity: dual-use investments in health system infrastructure"],indiaApp:"India's COVID-19 response was strong on vaccination (Co-WIN, two-dose coverage above 90% adult by 2022) but exposed weaknesses in surge capacity (the Delta wave in April-May 2021). The Pradhan Mantri Atma Nirbhar Swasth Bharat Yojana (2021) explicitly funds pandemic preparedness. India has contributed to the Pandemic Fund and hosts the WHO Global Centre for Traditional Medicine in Jamnagar (a soft-power play more than a preparedness measure)."},{id:"3.9",section:"Commissioning and purchasing",sectionRoman:"3",num:"3.9",title:"Antibiotics as global public goods",pages:"572-610",authors:"Matthew Renwick",what:"Antimicrobial resistance (AMR) financing: the broken antibiotic R&D pipeline, push-and-pull funding mechanisms, market entry rewards. Argues the existing market does not produce new antibiotics because successful new antibiotics are held in reserve, undermining the manufacturer's revenue.",keyConcepts:["AMR as a One Health problem: human, animal, environmental drivers","Push funding: support R&D regardless of commercial outcome (CARB-X)","Pull funding: rewards for successful market entry (UK NHS subscription pilot, PASTEUR Act US)","Stewardship vs access tension: restrict use to preserve efficacy but ensure access for those who need","Global pooled procurement as a possible solution"],indiaApp:"India has high AMR rates in both community and hospital settings. The National Action Plan on AMR (2017) exists but enforcement is weak. India is also the largest producer of antibiotic active pharmaceutical ingredients; the Hyderabad pharmaceutical effluent issue (Larsson et al. 2007, 2014) is a One Health environmental driver. India's policy interest in AMR is real but financing is small."},{id:"3.10",section:"Commissioning and purchasing",sectionRoman:"3",num:"3.10",title:"Financing innovation for neglected diseases",pages:"611-673",authors:"Marisa Miraldo, Mujaheed Shaikh, Mohamed Gad",what:"How to finance R&D for diseases of LMICs (NTDs, neglected tropical diseases): kala-azar, schistosomiasis, lymphatic filariasis, Chagas, Buruli ulcer. Reviews PDPs (product development partnerships), advance market commitments, priority review vouchers.",keyConcepts:["Market failure: NTDs primarily affect poor populations with low willingness/ability to pay","DNDi (Drugs for Neglected Diseases initiative) as the leading PDP","Advance market commitments (AMC): pre-commit to purchase if developed","Priority review vouchers (US FDA): tradeable accelerated-review rights as innovation reward","Open-source drug discovery (OSDD) as an alternative model"],indiaApp:"India houses the OSDD initiative (CSIR-led, launched 2008) for TB drug development. India is endemic for kala-azar (visceral leishmaniasis) in Bihar and surrounding states; the Kala-Azar Elimination Programme set a target of <1 case per 10,000 by 2020 which was largely met. Lymphatic filariasis programmes use mass drug administration. India's pharma industry can manufacture but does not typically discover NTD drugs."}],c=[{id:"1",name:"Revenue raising",description:"How funds are generated for the health system: taxation, social health insurance, community-based and voluntary insurance, and official development assistance.",color:"#1e3a5f"},{id:"2",name:"Pooling resources and defining benefits",description:"How pooled funds are organised, what services they cover, and how the design of pools and packages shapes equity and financial protection.",color:"#D4520A"},{id:"3",name:"Commissioning and purchasing",description:"How pooled funds are paid out: provider payment mechanisms for primary, hospital, and integrated care; medicines pricing; informal payments; quality incentives; and special topics like pandemic preparedness and neglected diseases.",color:"#16a34a"}],d=[{label:"High OOP share",headline:"47.1% of total health expenditure was out-of-pocket in 2019-20",details:"From National Health Accounts 2019-20 published by NHSRC in 2023. Down from about 60% a decade earlier, but still among the highest in the world. Compared to OECD average of about 20%, China at about 35%, Thailand below 15%. The book identifies high OOP as the central financial protection failure.",bookRef:"Ch 1.1 (financing mix), Ch 2.4 (user charges and catastrophic spending)"},{label:"Public spending low",headline:"Public spending on health was 1.28% of GDP in 2019-20",details:"The National Health Policy 2017 set a target of 2.5% by 2025, repeatedly reaffirmed but not met. Tax-to-GDP ratio at about 11-12% constrains the headroom. The book's Chapter 1.1 argues this is the binding constraint for UHC progress in LMICs.",bookRef:"Ch 1.1 (general taxation), Intro (UHC framing)"},{label:"Catastrophic spending",headline:"About 7% of households face catastrophic health spending each year",details:"Threshold: OOP exceeds 10% of household consumption. About 4% are pushed below the poverty line each year by health costs. The figure for the bottom quintile is much higher than for the top. Garg & Karan (2009) Health Policy & Planning; updates by Bhojani, Selvaraj, and others.",bookRef:"Ch 2.4 (Figure 2.4.2, 2.4.3)"},{label:"Fragmented pooling",headline:"At least 5 major pooling arrangements coexist",details:"PM-JAY (national, tax-financed, bottom 40%), CGHS (central govt employees), ESIS (formal private workers), state schemes (Tamil Nadu, Karnataka, Andhra Pradesh, Telangana, Rajasthan; each different), and private VHI. The residual public delivery system is the implicit pool for those outside all schemes. Coverage gaps and double coverage both exist.",bookRef:"Ch 2.1 (pooling arrangements), Ch 1.1 Box 1.1.1"},{label:"Informal economy and SHI",headline:"About 90% of workforce is informal",details:"PLFS 2022-23 data. SHI in the contributory sense (payroll-linked premiums) reaches only the formal-sector workforce. The chapter's argument that LMICs with high informality should rely primarily on tax financing rather than SHI is directly applicable. India's policy direction (PM-JAY tax-financed) reflects this logic.",bookRef:"Ch 1.1 (informal economy challenge)"},{label:"Pharmacy and outpatient drives OOP",headline:"Medicines account for over 70% of OOP",details:"NSSO 75th round (2017-18). PM-JAY covers hospitalisation but not outpatient care or routine medicines. Jan Aushadhi outlets address part of this through generics but coverage is uneven. The mismatch between where OOP burden falls (outpatient, drugs) and what PM-JAY covers (inpatient packages) is the central policy critique.",bookRef:"Ch 2.4 Figure 2.4.1, Ch 3.4 (paying for medicines)"},{label:"Hospital provider payment",headline:"PM-JAY uses package rates similar to simplified DRGs",details:"About 1,500 procedures with administratively set rates. Revised 2019, 2022. Hospital associations argue rates are below cost; some have de-empanelled. The book's Ch 3.2 framework on volume control, quality adjustment, and risk adjustment is directly applicable for PM-JAY's payment system maturation.",bookRef:"Ch 3.2 (methods for paying hospitals)"},{label:"Old age and LTC",headline:"Population aged 60+ to nearly double by 2036",details:"From ~138 million (2021) to 230+ million (2036), per UN/NCP projections. NPHCE exists but is small. National LTC policy essentially absent. Care burden falls on families, disproportionately on women. The chapter's OECD frame is directly usable when Indian policy catches up to demographic transition.",bookRef:"Ch 2.5 (long-term care)"}],f={lineHeight:1.7,color:"#1e293b",marginBottom:"1rem",fontSize:"1rem"},p={background:"white",border:"1px solid #e2e8f0",borderRadius:8,padding:"1.25rem",boxShadow:"0 1px 2px rgba(15, 23, 42, 0.04)"},h={color:"#D4520A",textDecoration:"underline"};function m({children:e}){return(0,o.jsx)("h2",{style:{fontFamily:"Inter, sans-serif",fontSize:"1.5rem",color:"#0F172A",marginTop:"2rem",marginBottom:"0.75rem",fontWeight:700,letterSpacing:"-0.01em"},children:e})}function g({children:e}){return(0,o.jsx)("div",{style:{fontFamily:"Inter, sans-serif",fontSize:"0.75rem",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.1em",color:"#1e3a5f",marginTop:"1rem",marginBottom:"0.5rem"},children:e})}function y(){return(0,o.jsxs)("div",{children:[(0,o.jsx)(m,{children:"What this book is"}),(0,o.jsxs)("p",{style:f,children:[(0,o.jsx)("em",{children:"Paying for Health: Learning from International Experience in Health Financing"})," ","(Cambridge University Press, 2025) is an edited volume from the European Observatory on Health Systems and Policies. It updates and broadens the 2002 European Observatory volume"," ",(0,o.jsx)("em",{children:"Funding Health Care: Options for Europe"}),", extending the scope from Europe to include case studies from low- and middle-income countries. Editors: Jonathan Cylus (LSE/WHO), Rebecca Forman (LSE), Nathan Shuftan (TU Berlin), Elias Mossialos (LSE), Peter C. Smith (Imperial/York). Open access via Cambridge Core."]}),(0,o.jsx)("p",{style:f,children:"The book is large — 18 substantive chapters plus introduction, over 700 pages — and contains chapter contributions from more than 50 authors. The structure follows the three functions of health financing in the WHO framework: revenue raising, pooling resources and defining benefits, and commissioning and purchasing."}),(0,o.jsx)(m,{children:"Why this matters for India"}),(0,o.jsx)("p",{style:f,children:"India's health system sits at the intersection of every problem the book identifies: high out-of-pocket spending, fragmented pooling, a large informal economy that constrains payroll-based insurance, low public spending, and a fast-evolving policy landscape (PM-JAY 2018, Health and Wellness Centres 2018-onward, the National Digital Health Mission 2020). The book treats India directly in Box 1.1.1 on parallel tax and SHI systems. Beyond that, almost every chapter's framework is immediately applicable to a current Indian policy question."}),(0,o.jsx)(m,{children:"The three-function frame"}),(0,o.jsx)("div",{style:{display:"grid",gap:"1rem",marginTop:"1rem"},children:c.map(e=>(0,o.jsxs)("div",{style:{...p,borderLeft:`4px solid ${e.color}`},children:[(0,o.jsxs)("div",{style:{fontFamily:"Inter, sans-serif",fontSize:"0.7rem",letterSpacing:"0.1em",textTransform:"uppercase",color:e.color,fontWeight:700,marginBottom:"0.3rem"},children:["Section ",e.id]}),(0 ndia series."]})]})}function v(){return(0,o.jsxs)("div",{children:[(0,o.jsx)(m,{children:"How money moves through a health system"}),(0,o.jsx)("p",{style:f,children:"The book opens with a deceptively simple diagram (Figure 0.2.1): money flows from sources (taxpayers, employers, donors, households) into financing agents (governments, SHI funds, insurers) into providers (hospitals, primary care clinics, pharmacies) which then deliver services to users. Health financing analysis is the study of how this flow is structured and how the structure produces outcomes in equity, financial protection, and efficiency."}),(0,o.jsx)("p",{style:f,children:"The three functions — revenue raising, pooling, purchasing — correspond to three nodes in this flow. Each function can be done well or badly. Each has its own policy instruments and its own evidence base. The book's contribution is to treat all three functions seriously and to insist they cannot be separated: a country can have great revenue raising and weak purchasing, and the system will still fail."}),(0,o.jsxs)("div",{style:{display:"grid",gap:"1.25rem",marginTop:"1.5rem"},children:[(0,o.jsx)(b,{number:"1",title:"Revenue raising",color:"#1e3a5f",summary:"Where the money comes from.",what:"Compulsory contributions (general taxation, social health insurance), voluntary contributions (community-based insurance, private VHI), and external sources (development assistance for health) make up the revenue mix. The book argues that compulsory prepayment mechanisms — taxes and social contributions — are essential for UHC progress; voluntary mechanisms have a limited role at best.",questions:["Tax or social health insurance? Most countries now mix the two. The book argues the distinction has blurred.","Can LMICs rely on SHI when 80%+ of the workforce is informal? No, says Tandon et al. in Ch 1.1.","Does private VHI reduce OOP? Evidence: it does not. Public spending growth reduces OOP; VHI does not.","Should ODA be the answer for LICs? Yes during transitions, but no as a sustainable model."],chapters:"1.1 General taxation and SHI · 1.2 Community-based health insurance · 1.3 Voluntary health insurance · 1.4 Official development assistance"}),(0,o.jsx)(b,{number:"2",title:"Pooling resources and defining benefits",color:"#D4520A",summary:"How money is held and what it pays for.",what:"Pooling combines contributions from many people so that risks are spread. Larger and more demographically diverse pools deliver financial protection better. Benefits-package design decides what services the pool will cover and what it will not. The chapter on user charges shows that even within a benefits package, design choices determine how much financial protection is actually delivered.",questions:["Single pool or multiple pools? Multiple pools reduce redistributive capacity (Ch 2.1).","What goes in the benefits package? Use HTA and prioritise marginal cost-effectiveness (Ch 2.2).","What should come out? Disinvestment from low-value care is politically hard but methodologically tractable (Ch 2.3).","What about user charges? They reduce utilisation, especially among the poor (Ch 2.4). The book is sceptical of them.","Long-term care? Increasingly important with ageing populations; absent in most LMIC policy frameworks (Ch 2.5)."],chapters:"2.1 Risk pooling · 2.2 Benefits package · 2.3 Disinvestment · 2.4 User charges · 2.5 Long-term care"}),(0,o.jsx)(b,{number:"3",title:"Commissioning and purchasing",color:"#16a34a",summary:"How money reaches providers.",what:"Strategic purchasing means using payment mechanisms to drive system goals — coverage, quality, efficiency, integration. The book devotes ten chapters to this section because the instruments are many and the evidence is granular: capitation vs FFS vs blended for primary care; DRGs and global budgets for hospitals; reference pricing and generic substitution for medicines; bundled payments for integrated care; P4P for quality; pull and push mechanisms for innovation.",questions:["How to pay primary care? Blended models combine capitation cost control with FFS volume incentives (Ch 3.1).","How to pay hospitals? DRG-style activity-based funding with volume controls (Ch 3.2).","What about informal payments? Endemic where formal salaries are low; reform requires more than anti-corruption rhetoric (Ch 3.3).","Medicines pricing? Reference pricing, tendering, generic substitution all work (Ch 3.4).","Integration? Bundled payments help but governance and culture matter more (Ch 3.5).","Quality? P4P helps modestly; gaming is a real problem (Ch 3.6).","Pandemic preparedness? Domestic financing is the foundation; international pooled mechanisms supplement (Ch 3.8)."],chapters:"3.1 Primary care · 3.2 Hospitals · 3.3 Informal payments · 3.4 Medicines · 3.5 Integrated care · 3.6 Quality incentives · 3.7 Vertical vs horizontal priority-setting · 3.8 Pandemic preparedness · 3.9 Antibiotics as global public goods · 3.10 Innovation for neglected diseases"})]}),(0,o.jsx)(m,{children:"The functions interact"}),(0,o.jsx)("p",{style:f,children:"The book is explicit that the three functions are not independent. A country that raises a lot of revenue but pools fragmentarily (multiple small risk pools) will not deliver financial protection well. A country that pools well but purchases poorly (e.g., paying hospitals on FFS without volume control) will spend a lot for little improvement in outcomes. The choice of revenue mechanism shapes what kind of pooling is possible: payroll-based SHI creates occupation-linked pools by default; tax financing allows for a single national pool by design."}),(0,o.jsx)("p",{style:f,children:"For Indian policymakers, the interaction is critical. PM-JAY (national pool, tax-financed) and CGHS (separate pool for central government employees) sit in parallel because of historical and political reasons, not by design choice that compared the alternatives. The book's framework helps articulate what is being given up: redistri {title:"Equity",summary:"Who pays, who benefits, who is left behind.",body:"The book's equity frame is double: equity in financing (those with greater means contribute more) and equity in benefits (those with greater need receive more). The chapters on user charges (2.4), CBHI (1.2), VHI (1.3), and informal payments (3.3) all treat equity as the central evaluative criterion. The recurring finding: regressive financing mechanisms (user charges, informal payments, flat-rate insurance) push the burden onto poorer households, while progressive mechanisms (income tax, well-designed SHI) redistribute toward those with greater need.",chapters:"1.2, 1.3, 2.4, 3.3, 3.6, 3.7"}),(0,o.jsx)(C,{title:"Financial protection",summary:"The defining UHC outcome.",body:"Financial protection means people can use needed health services without suffering financial hardship. The book operationalises this through two indicators: catastrophic health spending (OOP exceeds a threshold share of consumption) and impoverishing health spending (OOP pushes households below the poverty line). The chapters on user charges (2.4), risk pooling (2.1), and the benefits package (2.2) treat financial protection as the dependent variable. Ch 1.1 and Ch 1.3 link revenue mix to financial protection outcomes.",chapters:"1.1, 1.3, 2.1, 2.4, 2.5"}),(0,o.jsx)(C,{title:"Informal economy",summary:"The recurring LMIC obstacle to SHI.",body:"In LMICs with 50-90% informal employment (India sits at the high end at ~90%, PLFS 2022-23), payroll-based SHI cannot deliver UHC. Workers cannot be reached through employer contributions; they have no formal income to be taxed. The book's recommendation is consistent: rely on general taxation as the dominant revenue mechanism in high-informality settings. India's policy direction (PM-JAY tax-financed, displacing the contributory RSBY 2008) reflects exactly this logic.",chapters:"1.1, 1.2, 1.3"}),(0,o.jsx)(C,{title:"Fragmentation",summary:"Why multiple small pools cost equity.",b
