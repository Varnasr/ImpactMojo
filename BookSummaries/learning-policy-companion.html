ers? Investigating the Australian experience",authors:"Trish Mercer",detail:"Mercer reports on extensive interviews with Australian policy practitioners about how (or whether) they use policy theory in their work. The findings are honest and disquieting: most practitioners encountered policy theory in postgraduate education but rarely use it explicitly in daily work. Theory operates as background knowledge that shapes intuitions rather than as a tool they consciously apply.",debates:"Empirical evidence on practitioner theory use; the asymmetry between what is taught and what is used; implications for executive education."},{num:4,part:"Part 1: Theorising, Teaching, Learning",title:"Delivering public policy programs to senior executives in government: ANZSOG 2002-18",authors:"John Wanna",detail:"Wanna chronicles the Australia and New Zealand School of Government from its 2002 founding through 2018. ANZSOG was created to bridge the academic-practitioner divide with executive education for senior public servants. The chapter is both institutional history and reflective evaluation: what worked, what did not, what tensions persisted.",debates:"Institutional design for executive education; the tension between academic rigour and practitioner relevance; cross-jurisdictional learning."},{num:5,part:"Part 1: Theorising, Teaching, Learning",title:"How do policy professionals in New Zealand use academic research in their work?",authors:"Karl Löfgren, Sarah Hendrica Bickerton",detail:"A parallel empirical study to Mercer's, this time in New Zealand. Löfgren and Bickerton find a similar pattern: limited explicit use of academic research, more frequent reliance on practitioner networks and grey literature. They identify channels through which academic research does flow into practice (consultancies, ANZSOG, specific researcher-practitioner relationships) and channels through which it does not (peer-reviewed journals as a direct source).",debates:"Research-utilisation patterns; the role of grey literature and consultancies; what changes would open the channels."},{num:6,part:"Part 1: Theorising, Teaching, Learning",title:"The dilemmas of managing parliament: Public management theories for parliamentary administrators",authors:"Val Barrett",detail:"Barrett extends the theory-practice question to parliamentary administrators, a workforce often overlooked in policy studies. Parliamentary staff face distinctive constraints: serving competing political masters, supporting deliberation rather than implementing decisions, operating within constitutional rather than executive logics. The chapter argues that public management theories require adaptation before they apply to parliamentary work.",debates:"Distinct logic of parliamentary administration; constitutional vs executive policy work; tailoring theory to specialist workforces."},{num:7,part:"Part 2: Putting Theory into Practice",title:"Public policy processes in Australia: Reflections from experience",authors:"Meredith Edwards",detail:"Edwards, a former senior official, offers retrospective reflection on Australian policy processes she participated in across multiple decades. The chapter is methodologically interesting as an example of practitioner reflection that is more than memoir: she explicitly connects her experience to academic policy theory, identifying where the theory illuminates what happened and where it does not.",debates:"Practitioner reflection as a form of theory-building; the value of long-arc retrospective; the limits of memoir as evidence."},{num:8,part:"Part 2: Putting Theory into Practice",title:"Using the policy cycle: Practice into theory and back again",authors:"Russell Ayres",detail:"Ayres engages directly with the most contested model in policy studies: the policy cycle (problem definition, agenda-setting, formulation, decision, implementation, evaluation). Academics have largely abandoned it as descriptively wrong; practitioners often find it useful as a teaching device and planning heuristic. Ayres defends a sophisticated version: the cycle is wrong as description but useful as orientation.",debates:"The policy cycle controversy; descriptive vs normative theory; heuristics that survive academic critique."},{num:9,part:"Part 2: Putting Theory into Practice",title:"Succeeding and failing in crafting environment policy: Can public policy theories help?",authors:"Kathleen Mackie",detail:"Mackie takes a substantive policy domain (Australian environmental policy) and tests whether public policy theories actually help explain successes and failures. Her conclusion: some theories help (advocacy coalition framework, multiple streams, punctuated equilibrium); others do not add value beyond detailed case knowledge.",debates:"Domain-specific theory utility; environmental policy as a test case; selective theory adoption by practitioners."},{num:10,part:"Part 2: Putting Theory into Practice",title:"Understanding the policymaking enterprise: Foucault among the bureaucrats",authors:"Craig Ritchie",detail:"Ritchie brings critical theory (Foucault on power, governmentality, biopolitics) into the bureaucratic workplace. Most policy theory is liberal-pragmatist; Foucauldian analysis reveals power dynamics that liberal theory tends to miss. The chapter is unusual in this volume for its theoretical ambition and identifies a gap: practitioners may sense power dynamics that mainstream policy theory does not name.",debates:"Critical theory in policy practice; Foucauldian governmentality; what mainstream theory misses."},{num:11,part:"Part 2: Putting Theory into Practice",title:"The practical realities of policy on the run: A practitioner's response to academic policy frameworks",authors:"Louise Gilding",detail:"Gilding, a senior practitioner, responds bluntly to academic frameworks. Most policy work is not the deliberative process academic models describe; it is rapid response to crises, political pressure, media attention, and shifting ministerial priorities. The chapter reads as a productive irritant: a check on the volume's other contributors who may overstate the contemplative side of policy work.",debates:"Policy on the run vs deliberative policy; the asymmetry between political timeframes and academic timescales; what theory misses about urgency."},{num:12,part:"Part 2: Putting Theory into Practice",title:"Documenting the link between policy theory and practice: A map of sea without any land",authors:"Andrew Maurer",detail:"Maurer attempts to document, in a specific Australian government department, where and how policy theory shows up in practice. The result is paradoxical: traces of theory are everywhere (in vocabulary, in frameworks adopted, in training programmes attended) but their causal influence on decisions is hard to identify. The 'map of sea without any land' image captures the ubiquity of theoretical influence and the difficulty of pinning it down.",debates:"Tracing theoretical influence; documenting tacit knowledge; methodological challenges in studying theory uptake."},{num:13,part:"Part 3: Theory and Practice Better Informing Each Other",title:"Taking lessons from policy theory into practice",authors:"Paul Cairney",detail:"Cairney synthesises policy theory into a low-jargon story practitioners can use: policymakers operate under bounded rationality (Simon) and policy systems are complex with limited central control. Implications: abandon models of central control like the policy cycle; reconceive 'evidence-based policymaking' as evidence-informed at best; understand that policy outcomes emerge from many actors and that any single actor has limited influence.",debates:"Bounded rationality applied to policy work; complexity-aware policymaking; rejecting the central-control myth."},{num:14,part:"Part 3: Theory and Practice Better Informing Each Other",title:"Synthesising models, theories and frameworks for public policy: Implications for the future",authors:"Allan McConnell",detail:"McConnell offers a synthesis of major policy theories: Multiple Streams Framework (Kingdon), Advocacy Coalition Framework (Sabatier-Jenkins-Smith), Punctuated Equilibrium (Baumgartner-Jones), Policy Feedback (Pierson), Narrative Policy Framework, and others. He argues for selective integration rather than choosing one theory: different theories illuminate different aspects, and practitioners benefit from having multiple lenses.",debates:"Theory integration vs theory competition; the toolkit approach to policy theory; pedagogical implications of multi-theory teaching."},{num:15,part:"Part 3: Theory and Practice Better Informing Each Other",title:"Public policy theory, practice and skills: Advancing the debate",authors:"John Wanna, Russell Ayres, Brian Head, Trish Mercer",detail:"The editors' closing synthesis. Three takeaways: (1) The theory-practice gap is structural and will not close; the productive move is to build institutional bridges (like ANZSOG) rather than expect spontaneous integration. (2) Different kinds of theory are useful in different ways; vocabulary and frameworks transfer well, large explanatory theories transfer poorly. (3) Skills matter alongside theory: judgement, negotiation, political acumen, writing, presentation.",debates:"Institutional bridges between theory and practice; the skills gap; what next for policy education."}],c=[{name:"Part 1: Theorising, Teaching, Learning",colour:"#7c3aed",description:"Chapters 1-6. How policy theory is taught, how practitioners encounter it, what they do (and do not) take from it. Empirical chapters report on Australian and New Zealand evidence."},{name:"Part 2: Putting Theory into Practice",colour:"#0891b2",description:"Chapters 7-12. Practitioner reflections on whether and how theory helps with actual policy work. Mix of retrospective accounts, domain studies, and critical perspectives."},{name:"Part 3: Theory and Practice Better Informing Each Other",colour:"#16a34a",description:"Chapters 13-15. Synthesis chapters. Paul Cairney on bounded rationality and complexity, Allan McConnell on integrating multiple frameworks, and the editors' closing."}],d=[{name:"Multiple Streams Framework (MSF)",proponent:"John Kingdon (1984, 2nd ed 1995)",core:"Policy change happens when three streams (problems, policies, politics) align. Policy entrepreneurs exploit windows of opportunity when the streams are open.",use:"Useful for explaining agenda-setting and major policy windows. Less useful for explaining day-to-day implementation."},{name:"Advocacy Coalition Framework (ACF)",proponent:"Paul Sabatier and Hank Jenkins-Smith (1988, 1993)",core:"Policy subsystems contain advocacy coalitions defined by shared belief systems. Coalitions compete for influence; policy change requires either internal belief change or external shock.",use:"Useful for analysing long-running policy conflicts (environmental, drug policy, education). Less useful for routine policy work."},{name:"Punctuated Equilibrium Theory (PET)",proponent:"Frank Baumgartner and Bryan Jones (1993)",core:"Policy systems alternate between long periods of stability (incremental change) and short periods of disruption (rapid change). The pattern reflects information processing under bounded rationality.",use:"Useful for understanding why policy attention shifts dramatically at moments. Used to study issue attention dynamics."},{name:"Policy Feedback Theory",proponent:"Paul Pierson (1993) and others",core:"Existing policies shape future politics by creating constituencies, organisational capacities, and resources that affect what subsequent policies are feasible. Path dependence applied to policy.",use:"Useful for explaining why some policy paths persist even when better alternatives exist. Important for welfare state and pension reform analysis."},{name:"Narrative Policy Framework (NPF)",proponent:"Michael Jones, Mark McBeth, Elizabeth Shanahan (2010 onward)",core:"Policy actors construct narratives with characters (heroes, villains, victims), settings, plots, and morals. Narrative analysis can explain why some policy arguments persuade and others do not.",use:"Useful for analysing political communication, advocacy campaigns, media framing. Empirically applied to climate, abortion, gun policy."},{name:"The Policy Cycle (heuristic)",proponent:"Various; Harold Lasswell 1956 onward",core:"Policy work proceeds through stages: agenda-setting, formulation, decision, implementation, evaluation, termination. Largely abandoned by academic policy studies as descriptively wrong.",use:"Still widely used as a teaching device and planning heuristic. Cairney and others argue it survives because it organises thinking even when descriptively inaccurate."}],f=[{title:"The Indian theory-practice gap is wider",body:"Australia and New Zealand have built institutional bridges (ANZSOG, the Institute of Public Administration of Australia, the Public Sector Management Programme in NZ) that India lacks at equivalent scale. India's IIPA (Indian Institute of Public Administration), founded 1954, is the closest analogue but does not have ANZSOG's reach or its specific theory-practice integration mandate. LBSNAA (Lal Bahadur Shastri National Academy of Administration) trains IAS officers but emphasises generalist administration over policy theory. The institutional bridges are weaker."},{title:"Indian policy education institutions",body:"The Indian policy education ecosystem has grown rapidly: IIM Bangalore's Centre for Public Policy (CPP, founded 2000), Indian School of Public Policy (Delhi, 2018), Ashoka University's Centre for Economic Data and Analysis and Centre for Social and Behaviour Change, Azim Premji University's School of Public Policy and Governance, Jindal School of Government and Public Policy, Takshashila Institution (Bangalore), Public Affairs Centre (Bangalore), Centre for Public Policy Research (Kochi). These institutions teach versions of the policy theory the ANU volume discusses, but curricula are still relatively thin compared to Australia."},{title:"Indian executive education for the civil service",body:"LBSNAA Mussoorie (foundation course and induction training for IAS), the State Civil Services Training Institutes, the National Centre for Good Governance (NCGG) in Mussoorie, the Bureau of Parliamentary Studies and Training (Delhi). Mid-career officers attend institutions like IIM Bangalore (12-month MPP for serving officers since 2003), Harvard Kennedy School (annual Indian delegations), Lee Kuan Yew School (Singapore). The Indian equivalent to ANZSOG's EMPA is still being assembled across multiple institutions rather than concentrated in one."},{title:"Indian policy researchers prominent in the field",body:"Indian policy theorists and researchers whose work parallels or engages with the ANU volume: Pratap Bhanu Mehta (Ashoka, formerly CPR), Devesh Kapur (Johns Hopkins SAIS), Yamini Aiyar (formerly CPR), Lant Pritchett (Oxford, formerly HKS), Arvind Subramanian (former CEA, Brown), Subir Gokarn (former RBI), Bibek Debroy (former NITI Aayog), Y.V. Reddy (former RBI Governor, writer on policy practice). The Centre for Policy Research (CPR Delhi), constrained since 2023 by FCRA action but with archived outputs, was the foremost Indian institution working at the theory-practice intersection."},{title:"Applying the volume's lessons in India",body:"Cairney's bounded-rationality framing applies directly: Indian policy is made by ministers and senior officers under intense time pressure with limited information, navigating complex federal coordination problems. The policy cycle critique is even more apt in India where formal cycles often exist only on paper. The ACF and MSF frameworks have been applied to Indian agricultural policy, IT policy, and environmental policy. McConnell's multi-framework synthesis is the most practical guidance for Indian researchers: no single theory captures Indian policy realities; analytic eclecticism is the working position."},{title:"What Indian policy practitioners read",body:"Indian policy practitioners draw on a mix of Anglophone academic literature (Pressman & Wildavsky on implementation, Lipsky on street-level bureaucracy, Wilson on bureaucratic politics, more recently Cairney) and Indian writing (V.P. Menon and Krishnamachari for historical perspective, EAS Sarma for energy policy, Bibek Debroy and Y.V. Reddy for economic policy, Pratap Bhanu Mehta for constitutional and political theory). The theory-practice gap in India also has a language dimension: much practitioner discussion happens in Hindi and regional languages while most academic theory is in English."},{title:"ANZSOG-India connections",body:"ANZSOG has direct India links: alumni include Indian civil servants on ANZSOG executive programmes; some Indian academics (including TISS, Azim Premji) have ANZSOG affiliations; ANZSOG faculty have spoken at Indian policy schools. The Indian Administrative Service has occasionally sent officers to ANZSOG. None of this is at the scale of the ANZSOG-Singapore-Hong Kong axis, but the institutional channels exist."}],p={lineHeight:1.7,color:"#1e293b",marginBottom:"1rem",fontSize:"1rem"},h={background:"white",border:"1px solid #e2e8f0",borderRadius:8,padding:"1.25rem",boxShadow:"0 1px 2px rgba(15, 23, 42, 0.04)"},m={color:"#D4520A",textDecoration:"underline"};function y({children:e}){return(0,i.jsx)("h2",{style:{fontFamily:"Inter, sans-serif",fontSize:"1.5rem",color:"#0F172A",marginTop:"2rem",marginBottom:"0.75rem",fontWeight:700,letterSpacing:"-0.01em"},children:e})}function g({children:e}){return(0,i.jsx)("div",{style:{fontFamily:"Inter, sans-serif",fontSize:"0.75rem",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.1em",color:"#1e3a5f",marginTop:"1rem",marginBottom:"0.5rem"},children:e})}function v(){return(0,i.jsxs)("div",{children:[(0,i.jsx)(y,{children:"What this book is"}),(0,i.jsxs)("p",{style:p,children:[(0,i.jsx)("em",{children:"Learning Policy, Doing Policy: Interactions Between Public Policy Theory, Practice and Teaching"})," is a 2021 ANU Press volume edited by Trish Mercer, Russell Ayres, Brian Head, and John Wanna. Open access under CC BY-NC-ND 4.0; ISBN 9781760464202; DOI 10.22459/LPDP.2021. The volume grew out of a workshop supported by ANZSOG (the Australia and New Zealand School of Government) and brings together 15 chapters from academics and practitioners working on the theory-practice question."]}),(0,i.jsx)("p",{style:p,children:"The central question is whether and how academic public policy theory connects to public policy practice. The volume is unusual because it includes contributions from both sides of the divide and treats them as colleagues, not opponents. The result is a more honest account of the theory-practice gap than either pure-academic or pure-practitioner volumes typically produce."}),(0,i.jsx)(y,{children:"The three-part structure"}),(0,i.jsx)("div",{style:{display:"grid",gap:"0.75rem",marginTop:"1rem"},children:c.map(e=>(0,i.jsxs)("div",{style:{...h,borderLeft:`4px solid ${e.colour}`},children:[(0,i.jsx)("div",{style:{fontFamily:"Inter, sans-serif",fontWeight:600,fontSize:"1.1rem",color:e.colour,marginBottom:"0.3rem"},children:e.name}),(0,i.jsx)("p",{style:{...p,marginBottom:0,fontSize:"0.95rem"},children:e.description})]},e.name))}),(0,i.jsx)(y,{children:"Why this volume matters"}),(0,i.jsx)("p",{style:p,children:"Most policy theory volumes are written for an academic audience and address other academics; most practitioner reflections are memoirs or how-to guides that do not engage with theory. This volume sits in the middle, with explicit cross-talk between the two communities. ANZSOG, as the institutional sponsor, has spent two decades trying to make this conversation work, and the volume reflects what that experiment has taught."}),(0,i.jsxs)("p",{style:p,children:["Two contributors deserve particular attention. ",(0,i.jsx)("strong",{children:"Paul Cairney"})," (Chapter 13) is among the most-read contemporary policy theorists; his synthesis of bounded rationality and complexity for practitioner audiences has wide influence beyond this volume. ",(0,i.jsx)("strong",{children:"Allan McConnell"})," (Chapter 14) offers the volume's most useful integration of multiple frameworks for practitioners and students who find single-theory partisanship unhelpful."]}),(0,i.jsx)(y,{children:"For Indian readers"}),(0,i.jsx)("p",{style:p,children:"The volume is Australian and New Zealand in setting but the questions transfer. India has a growing policy education ecosystem (IIM Bangalore CPP, ISPP Delhi, Ashoka, Azim Premji, Jindal) but lacks an ANZSOG-equivalent that systematically connects senior civil service training to academic policy theory. The volume offers a well-developed account of an institutional model that Indian policy education has not yet built at scale."}),(0,i.jsx)(y,{children:"Companion structure"}),(0,i.jsxs)("ul",{style:{...p,paddingLeft:"1.5rem"},children:[(0,i.jsxs)("li",{children:[(0,i.jsx)("strong",{children:"Chapter Map"}),": all 15 chapters with authors, what each argues, and the debates each engages."]}),(0,i.jsxs)("li",{children:[(0,i.jsx)("strong",{children:"Major Frameworks"}),": six policy theory frameworks discussed across the volume."]}),(0,i.jsxs)("li",{children:[(0,i.jsx)("strong",{children:"Key Debates"}),": the recurring tensions the volume revisits in different chapters."]}),(0,i.jsxs)("li",{children:[(0,i.jsx)("strong",{children:"India Applications"}),": how the volume's questions land in Indian policy education and practice."]}),(0,i.jsxs)("li",{children:[(0,i.jsx)("strong",{children:"Ask"}),": Gemini Q&A primed on the volume and Indian policy contexts."]})]})]})}function b({expanded:e,setExpanded:t}){return(0,i.jsxs)("div",{children:[(0,i.jsx)(y,{children:"Fifteen chapters in three parts"}),(0,i.jsx)("p",{style:p,children:"Each chapter approaches the theory-practice question from a different angle. Click to expand for the chapter's argument, the author ral major policy frameworks, particularly in chapters 9 (Mackie on environmental policy), 13 (Cairney's synthesis), and 14 (McConnell's integration). The six below are the most prominent."}),(0,i.jsx)("div",{style:{display:"grid",gap:"1rem",marginTop:"1.5rem"},children:d.map(e=>(0,i.jsxs)("div",{style:{...h,borderLeft:"4px solid #16a34a"},children:[(0,i.jsx)("div",{style:{fontFamily:"Inter, sans-serif",fontWeight:600,fontSize:"1.05rem",color:"#0F172A",marginBottom:"0.3rem"},children:e.name}),(0,i.jsx)("div",{style:{fontSize:"0.82rem",color:"#94a3b8",fontFamily:"JetBrains Mono, monospace",marginBottom:"0.6rem"},children:e.proponent}),(0,i.jsx)(g,{children:"Core idea"}),(0,i.jsx)("p",{style:{...p,fontSize:"0.95rem",marginBottom:"0.5rem"},children:e.core}),(0,i.jsx)(g,{children:"When it is useful"}),(0,i.jsx)("p",{style:{...p,fontSize:"0.95rem",marginBottom:0},children:e.use})]},e.name))}),(0,i.jsx)(y,{children:"Cairney's synthesis: bounded rationality and complexity"}),(0,i.jsxs)("p",{style:p,children:["Cairney's contribution (Chapter 13) deserves separate attention because his formulation has wide influence. The synthesis: ",(0,i.jsx)("em",{children:"policymakers engage in a policy process over which they have limited knowledge and even less control"}),". Two foundations support this: bounded rationality (Simon 1976; humans have finite cognitive abilities and must combine cognition and emotion to limit information searches) and complexity (policy systems involve many actors, feedback loops, and emergent behaviour that no single actor can direct)."]}),(0,i.jsx)("p",{style:p,children:"The implications are uncomfortable for both practitioners and academics. Practitioners must give up the myth of central control and the simplicity of models like the policy cycle. Academics must accept that evidence-based policymaking is more aspirational than descriptive: at best, policy is evidence-informed alongside political, organisational, and emotional inputs."}),(0,i.jsx)(y,{children:"McConnell on integrating frameworks"}),(0,i.jsx)("p",{style:p,children:"McConnell (Chapter 14) makes the case for analytic eclecticism. No single framework captures all relevant aspects of any policy process; different frameworks illuminate different dimensions. The Multiple Streams Framework is useful for agenda-setting moments; the ACF is useful for long-running policy conflicts; PET is useful for explaining sudden attention shifts; Policy Feedback is useful for path-dependence questions. Practitioners are better off with a toolkit than with a single tool."})]})}function w(){return(0,i.jsxs)("div",{children:[(0,i.jsx)(y,{children:"Recurring debates across the volume"}),(0,i.jsx)("p",{style:p,children:"Several debates recur across multiple chapters. Each one is a productive tension rather than a question with a clean answer."}),(0,i.jsxs)("div",{style:{display:"grid",gap:"1.25rem",marginTop:"1.5rem"},children:[(0,i.jsxs)("div",{style:h,children:[(0,i.jsx)("div",{style:{fontFamily:"Inter, sans-serif",fontWeight:600,fontSize:"1.1rem",color:"#0F172A",marginBottom:"0.5rem"},children:"1. Is the theory-practice gap closeable?"}),(0,i.jsx)("p",{style:{...p,fontSize:"0.95rem",marginBottom:0},children:"The volume's editors believe the gap is narrower than it looks and that institutional bridges (ANZSOG) can sustain productive dialogue. Several practitioner contributors (Gilding, Maurer) suggest the gap is structural and partially irreducible. Cairney's position is intermediate: the gap can narrow through better theory and humbler theorists, but theory will never directly drive practice. The volume's collective answer: keep building bridges and stop expecting full integration."})]}),(0,i.jsxs)("div",{style:h,children:[(0,i.jsx)("div",{style:{fontFamily:"Inter, sans-serif",fontWeight:600,fontSize:"1.1rem",color:"#0F172A",marginBottom:"0.5rem"},children:"2. What kinds of theory transfer to practice?"}),(0,i.jsx)("p",{style:{...p,fontSize:"0.95rem",marginBottom:0},children
