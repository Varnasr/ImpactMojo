ye contact, vocal variety, pause, and gesture all need rehearsal. The 10,000-hour rule applies; TED speakers typically rehearse for months.",research:"Susan Cain rehearsed her TED talk on introverts for a full year before delivery. Amy Cuddy's 'power poses' talk went through 30+ rehearsals."},{part:"Novel",partColour:"#16a34a",num:4,title:"Teach Me Something New",summary:"Show the audience something they did not know.",detail:"TED talks succeed when they offer a genuine 'wait, what?' moment. Gallo argues the human brain rewards novelty with dopamine. Hans Rosling's data-driven myths-of-development talk works because the data overturns assumptions. Robert Ballard's deep-sea exploration talks work because the visual material is genuinely new.",research:"Cites the dopaminergic reward system literature (Bunzeck & Düzel 2006 Neuron) on novelty processing."},{part:"Novel",partColour:"#16a34a",num:5,title:"Deliver Jaw-Dropping Moments",summary:"Engineer a moment the audience will remember.",detail:"Bill Gates released mosquitos into a TED audience to illustrate malaria. Jill Bolte Taylor brought a human brain on stage. Markus Fischer flew a robotic bird above the crowd. These are explicit emotional anchors. Gallo's term: 'emotionally charged events' (ECEs) that create flashbulb memory.",research:"McGaugh on emotional memory consolidation in the amygdala. The mechanism: emotional events trigger noradrenaline release, which strengthens hippocampal encoding."},{part:"Novel",partColour:"#16a34a",num:6,title:"Lighten Up",summary:"Use humour without telling jokes.",detail:"Humour creates rapport and lowers audience defences. But Gallo distinguishes: TED speakers do not tell jokes (which depend on punchline structure and timing); they use observational humour and personal stories with funny moments. Ken Robinson's education talk is among the funniest in TED history without containing a single conventional joke.",research:"Humour activates the reward system and signals competence. Cites Provine 2000 on the social functions of laughter."},{part:"Memorable",partColour:"#1e3a5f",num:7,title:"Stick to the 18-Minute Rule",summary:"Brevity is a forcing function.",detail:"TED's 18-minute cap is non-negotiable. Gallo argues this forces speakers to identify their single most important idea and cut everything else. The constraint serves the audience: 18 minutes is roughly the limit of sustained attention without interruption. Anders Ericsson's research on cognitive load supports this.",research:"Cites the limits of working memory (Miller 1956) and attentional resources research. Universities have adopted this discipline in TEDxYouth and other formats."},{part:"Memorable",partColour:"#1e3a5f",num:8,title:"Paint a Mental Picture with Multisensory Experiences",summary:"Engage more than one sense.",detail:"The picture superiority effect: information presented as image and word together is remembered far better than word alone. Gallo argues TED speakers use this systematically: high-quality visuals, props, demonstrations, and even smells (Stefan Sagmeister's typography talk used candy). Visual + auditory together produces 65% retention after three days vs about 10% for auditory alone.",research:"Cites cognitive scientist John Medina's 'picture superiority effect' from <em>Brain Rules</em> (2008). Also Mayer's cognitive theory of multimedia learning."},{part:"Memorable",partColour:"#1e3a5f",num:9,title:"Stay in Your Lane",summary:"Be authentic; do not pretend to be someone else.",detail:"The final secret is a meta-point. TED speakers succeed by being themselves, not by imitating other TED speakers. Gallo's example: Sheryl Sandberg's talk on women in leadership succeeded because she spoke from her own experience and data, not by adopting another speaker's style. The authenticity is what audiences detect.",research:"Mehrabian's 7-38-55 rule (often misunderstood): in emotionally inconsistent communication, 7% comes from words, 38% from tone, 55% from body language. The point is congruence, not the specific percentages."}],c=[{num:1,title:"I can't see you naked",lesson:"Audiences are less scary than you think.",detail:"Berkun opens by debunking the 'imagine the audience naked' advice. His point: the audience is not the threat. Their attention is divided, they want you to succeed (boring talks waste their time too), and most of them are nervous about their own things. The chapter sets the tone for the book: pragmatic, anti-mythological, evidence-based about what actually happens in rooms with audiences."},{num:2,title:"The attack of the butterflies",lesson:"Manage anxiety with technique, not denial.",detail:"Berkun addresses speaker anxiety directly. Pre-talk anxiety is universal even among experienced speakers. Specific techniques he recommends: arrive early to check the room and equipment, do a microphone test, talk to early arrivals to find a friendly face in the crowd, breathe deliberately, accept that some anxiety helps performance (eustress vs distress)."},{num:3,title:"$30,000 an hour",lesson:"What professional speakers actually do.",detail:"An insider account of the professional speaking industry. Berkun describes the gap between visible delivery (one hour on stage) and invisible preparation (often 20+ hours per major talk for new material). Touches on speakers bureaus, fee structures, the gap between famous and substantive speakers, and why some highly paid speakers are nonetheless poor."},{num:4,title:"How to work a tough room",lesson:"Diagnose and respond to difficult audiences.",detail:"Hostile audiences, distracted audiences, exhausted post-lunch audiences, technical problems mid-talk, the heckler — Berkun covers each. His main argument: tough rooms are diagnosable. Read the audience early, identify what is going wrong (too long, too abstract, wrong topic for them, technical issues), and adapt. The willingness to abandon prepared material when the room demands it is the mark of an experienced speaker."},{num:5,title:"Do not eat the microphone",lesson:"The mechanics of using rooms, microphones, and equipment.",detail:"Practical chapter on the operational layer: types of microphones (handheld, lapel, headset, lectern), how to test sound levels, how to use a slide remote, where to stand, how to read lighting, how to handle equipment failure. The 'do not eat the microphone' refers to speakers who hold mics too close, causing distortion and amateur sound."},{num:6,title:"The science of not boring people",lesson:"Attention is the audience's gift; do not waste it.",detail:"Berkun explores what makes talks boring and what to do about it. Boring talks share characteristics: too much material for the time, too many ideas at once, no story arc, no concrete examples, monotone delivery, abstract claims without specifics. His prescription: cut ruthlessly, structure around one idea, use specific examples, vary pace."},{num:7,title:"Lessons from my 15 minutes of fame",lesson:"Public attention is not what you think it is.",detail:"Berkun reflects on his experience of viral attention after a popular talk circulated online. Lessons: visibility is mostly noise, not signal; the audience that finds you online is not the audience you imagined; criticism scales with audience size; some popular talks succeed because of timing and luck, not just quality. Cautionary about thinking a popular talk is necessarily a great talk."},{num:8,title:"The things people say",lesson:"Handle feedback and audience questions usefully.",detail:"Q&A management, handling hostile questions, recognising rambling-disguised-as-question, dealing with comments that are not questions, managing time during Q&A. Also: how to read post-talk feedback from organisers and audiences. The distinction between feedback that should change future talks and feedback that should be ignored."},{num:9,title:"The clutch is your friend",lesson:"Pause deliberately; silence is a tool.",detail:"The clutch metaphor: when a car shifts gears, the clutch disengages for a moment. Speakers need this too. Berkun argues that the most common amateur mistake is filling silence with filler words (um, uh, you know). Deliberate pauses serve multiple purposes: emphasis, processing time for the audience, recovery time for the speaker, and signalling confidence. Practising pauses is part of practice."},{num:10,title:"Confessions",lesson:"Honest reflection on failures and recoveries.",detail:"Berkun closes with personal stories of bombing on stage, losing his train of thought, being unprepared for the room, and getting humiliated. The point: even experienced speakers fail. What separates good speakers from bad is not the absence of failure but the willingness to learn from it and the toolkit to recover in the moment."}],d=[{aspect:"On rehearsal",gallo:"Rehearse extensively to sound natural. Susan Cain rehearsed for a year. Practice makes effortless delivery possible.",berkun:"Rehearse, but recognise diminishing returns. Over-rehearsal can produce flat performances. The goal is preparation, not perfection."},{aspect:"On the role of passion",gallo:"Passion is foundational. Without it, the talk fails. Find what you genuinely care about and let it drive the talk.",berkun:"Passion helps but is not enough. Many passionate speakers are bad. Competence in craft matters as much as conviction."},{aspect:"On the audience",gallo:"The audience can be moved. Speakers can engineer specific emotional and intellectual responses through technique.",berkun:"The audience is unpredictable. Plan, but expect to adapt. Sometimes the best talk fails because the room is wrong."},{aspect:"On TED itself",gallo:"TED is the gold standard. Study TED talks to learn what works.",berkun:"TED talks are one format. They have their own conventions (18 minutes, one big idea, visual polish) that do not transfer to all settings."},{aspect:"On the role of stories",gallo:"Stories activate the brain in ways data cannot. Use them centrally.",berkun:"Stories are useful but not magic. A well-told argument with clear examples can be more memorable than a poorly-told story."},{aspect:"On viral fame",gallo:"Viral TED talks change careers. Aim to make a talk that resonates beyond the room.",berkun:"Viral fame is mostly noise. The talk you give well to 50 engaged people may matter more than the talk seen by 2 million distracted ones."}],f=[{title:"Academic conferences and the research dissemination talk",body:"Indian academic conferences (ISI Delhi, NIPFP, CDS Thiruvananthapuram, IIM annual meetings, IGIDR conferences) typically allocate 20-25 minutes plus 5-10 minutes Q&A. This format sits between Berkun's professional speaking world and Gallo's TED world. The 25-minute slot does not allow Gallo-level polish; the academic audience cares about evidence over delivery. Take Berkun's pragmatism (know your room, manage your time, anticipate hostile questions) as primary; use selected Gallo techniques (one clear narrative arc, one memorable visual, one concrete story) as secondary."},{title:"Policy dissemination talks",body:"Researchers communicating to policymakers (Niti Aayog, line ministries, state government secretaries, RBI, SEBI) face a specific format: 15-30 minutes followed by sometimes-hostile Q&A. The audience is time-constrained, often politically aware of the implications, and frequently skeptical of academic claims. Berkun's Chapter 4 (tough rooms) is essential. Gallo's Chapter 8 (paint a mental picture) translates into clean dashboards rather than TED-style visuals."},{title:"TEDx India circuit",body:"TEDx events in India have proliferated: TEDxIIMBangalore, TEDxIIMA, TEDxIITDelhi, TEDxGateway (Mumbai), TEDxLBSIM, dozens of university and city events. The format is TED-licensed and TED-style: 18 minutes, one big idea, polished visuals, story-driven. Gallo's book applies directly. Notable Indian TEDx talks: Devdutt Pattanaik on mythology, Shashi Tharoor on reparations (though delivered at Oxford Union, not TED), Aparna Hegde on maternal health, Harish Hande on solar energy, Sonam Wangchuk on innovation. These illustrate Gallo's 9 secrets in Indian contexts."},{title:"Civil society and community organising talks",body:"Indian civil society speakers (Aruna Roy, Yogendra Yadav, Bezwada Wilson, Medha Patkar, Harsh Mander) face audiences that often include people from the communities being discussed, not just outsiders interested in the topic. This requires Berkun's pragmatism more than Gallo's polish. Authenticity, language choice (when to use Hindi/regional language vs English, when to translate, when to refuse to translate), and respectful framing matter more than presentation technique."},{title:"PhD defence and viva voce",body:"Indian PhD defences typically have 30-45 minute presentations followed by extensive examiner questioning. This is closer to Berkun's tough-room format than Gallo's TED format. Specific Indian conventions: open defences are common at JNU, TISS, some IITs; closed defences are standard at many central universities. Examiners often probe methodology in detail. Preparation should focus on Berkun's chapters 4 (tough room), 8 (handling Q&A), and 9 (deliberate pauses for thinking)."},{title:"Conference panels in India: the moderation problem",body:"Indian conference panels often run long, with moderators not enforcing time and speakers exceeding their slots. The result: the last speaker on the panel gets less time than promised. Two responses for the researcher who is the last speaker: prepare both a 10-minute and 15-minute version of the talk in advance, and have a clear single-slide takeaway you can show even if time is cut. Berkun's pragmatism is the relevant guide here, not Gallo's polish."}],p={lineHeight:1.7,color:"#1e293b",marginBottom:"1rem",fontSize:"1rem"},h={background:"white",border:"1px solid #e2e8f0",borderRadius:8,padding:"1.25rem",boxShadow:"0 1px 2px rgba(15, 23, 42, 0.04)"},m={color:"#D4520A",textDecoration:"underline"};function g({children:e}){return(
