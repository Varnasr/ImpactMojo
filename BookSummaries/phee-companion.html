ansitionStatus()},y="19.2.6"});var i={};i=a("ck0m1");var o=a("5EwbY"),s={};!function e(){if("u">typeof __REACT_DEVTOOLS_GLOBAL_HOOK__&&"function"==typeof __REACT_DEVTOOLS_GLOBAL_HOOK__.checkDCE)try{__REACT_DEVTOOLS_GLOBAL_HOOK__.checkDCE(e)}catch(e){console.error(e)}}(),s=a("an7Tv");var o=a("5EwbY");let u=[{num:1,part:"Part 1: A Primer",title:"What are health inequalities and why monitor them?",detail:"Foundational distinctions: inequality (any difference in health) vs inequity (unjust differences arising from social arrangements). The chapter establishes the moral and policy case for monitoring: without disaggregated data, average health indicators hide systematic disadvantage that policy is failing to address."},{num:2,part:"Part 1: A Primer",title:"Approaches to health inequality monitoring",detail:"Three approaches: monitoring inequality across the social gradient (rich-poor, educated-uneducated continua), monitoring excluded groups (specific marginalised populations), monitoring against equity targets (numerical goals for closing gaps). Each approach answers different policy questions."},{num:3,part:"Part 1: A Primer",title:"Health indicators and dimensions of inequality",detail:"Selecting health indicators (mortality, morbidity, access, financial protection) and inequality dimensions (income, education, sex, place of residence, ethnicity, age, disability). The PROGRESS-Plus framework. India-relevant dimensions include caste, religion, scheduled tribe status."},{num:4,part:"Part 1: A Primer",title:"Health inequality monitoring: a shared responsibility",detail:"Roles: national statistical offices, health ministries, civil society, academic institutions, international agencies. The chapter argues for institutional arrangements that ensure monitoring is sustained across political cycles."},{num:5,part:"Part 1: A Primer",title:"Monitoring considerations across different contexts",detail:"Adapting monitoring to country context. Subnational federations (India), small island states, fragile and conflict-affected settings, ageing societies, climate-affected populations. The chapter recognises one-size-fits-all monitoring is methodologically and politically untenable."},{num:6,part:"Part 2: Generating Impact",title:"Embedding inequality monitoring within health information systems",detail:"How to make inequality monitoring routine rather than episodic. Integration with HMIS, civil registration and vital statistics, household surveys, and administrative data. India's HMIS, SRS, and NFHS provide the infrastructure; the chapter discusses how to systematically extract inequality information from these sources."},{num:7,part:"Part 2: Generating Impact",title:"Communicating about health inequalities",detail:"Communicating inequality findings to different audiences: ministers, parliamentarians, civil society, media, affected populations. Avoiding both alarmism and complacency. Visualisation choices matter: how inequality is displayed affects what policymakers do with the evidence."},{num:8,part:"Part 2: Generating Impact",title:"Equity-oriented policy-making",detail:"Moving from data to action. Universal health coverage as an equity instrument. Progressive universalism (universal coverage with progressive prioritisation). The chapter notes that monitoring alone does not produce equity; political commitment must follow."},{num:9,part:"Part 2: Generating Impact",title:"Social determinants of health: from monitoring to multisectoral action",detail:"Health inequality is mostly produced outside the health sector: by income, education, housing, employment, environmental exposure. Monitoring must connect to multisectoral policy. The WHO Commission on Social Determinants of Health (Marmot 2008) framework is the reference."},{num:10,part:"Part 2: Generating Impact",title:"Health inequality monitoring on the path to a just society",detail:"Closing argument for the primer half of the book. Sustainable Development Goals as a framework for health equity work. The 'leave no one behind' commitment as a measurable goal, not a slogan."},{num:11,part:"Part 3: Data for Monitoring",title:"Data requirements for health inequality monitoring",detail:"What data you need and at what disaggregation level. Sample size considerations for disaggregated estimates (the small-sample problem applies acutely here). Confidentiality and disclosure risk. Standardising data collection across surveys."},{num:12,part:"Part 3: Data for Monitoring",title:"Population-based data sources",detail:"Household surveys: DHS, MICS, World Health Survey, country-specific (India's NFHS, NSSO, PLFS). Strengths: large samples, rich socioeconomic detail. Limitations: timing (5-year cycles), rural undercoverage in some settings, recall bias."},{num:13,part:"Part 3: Data for Monitoring",title:"Institution-based data sources",detail:"Civil registration and vital statistics, hospital records, programme administrative data. Strengths: continuous, often disaggregated by individual. Limitations: facility-based undercounts populations who do not access services, miscoding, lack of social variables."},{num:14,part:"Part 3: Data for Monitoring",title:"Surveillance systems, health facility assessments and other sources",detail:"Disease surveillance, sentinel sites, facility assessments (SARA, SPA), private sector data. Useful for specific diseases and service-delivery quality but rarely sufficient on their own for inequality monitoring."},{num:15,part:"Part 3: Data for Monitoring",title:"Selecting data sources and addressing data gaps",detail:"How to choose the right data source for a specific inequality question. Triangulating across sources. Identifying and addressing data gaps systematically. The chapter is operational, with decision rules for analysts."},{num:16,part:"Part 3: Data for Monitoring",title:"Emerging and novel data sources",detail:"Mobile phone data, social media, satellite imagery, citizen-generated data. Promise and risks. The chapter is cautiously open: these sources can complement but rarely replace traditional sources, and they raise distinctive ethics and privacy concerns."},{num:17,part:"Part 4: Analysis and Reporting",title:"Preparing disaggregated health data",detail:"Step-by-step data preparation: variable harmonisation, missing data handling, weighting, dealing with small subgroups. The technical core of the book's how-to component."},{num:18,part:"Part 4: Analysis and Reporting",title:"Interpreting disaggregated health data",detail:"What disaggregated estimates mean and what they do not. Statistical significance versus substantive significance. Avoiding misleading comparisons (ecological fallacy, Simpson's paradox)."},{num:19,part:"Part 4: Analysis and Reporting",title:"Assessing inequality using summary measures of health inequality",detail:"Overview of inequality measures: absolute vs relative, simple vs complex. The choice of measure is itself a value-laden decision; the chapter walks through implications transparently."},{num:20,part:"Part 4: Analysis and Reporting",title:"Pairwise summary measures of health inequality",detail:"Differences and ratios between two groups (poorest vs richest, urban vs rural). Simple to compute, easy to communicate, limited in what they capture beyond two-group comparisons."},{num:21,part:"Part 4: Analysis and Reporting",title:"Complex summary measures of health inequality",detail:"Concentration index, slope index of inequality, relative index of inequality, between-group variance. These measures incorporate the full social gradient and are more demanding analytically."},{num:22,part:"Part 4: Analysis and Reporting",title:"Interpreting summary measures of health inequality",detail:"What each measure tells you and what it does not. The choice between absolute and relative measures has substantial implications for whether progress looks favourable or unfavourable. The chapter is candid about this."},{num:23,part:"Part 4: Analysis and Reporting",title:"Reporting disaggregated data and summary measures of health inequality",detail:"Reporting standards. Health Equity Assessment Toolkit (HEAT) software and the HEAT Plus extension. WHO's online inequality monitoring portal. National Health Equity Reports as institutional outputs."},{num:24,part:"Part 4: Analysis and Reporting",title:"Using health inequality analyses in evidence-informed decision-making",detail:"Connecting monitoring to policy decisions. Equity Impact Assessments. Working with policymakers and civil society to translate findings into action. The honest assessment: data alone do not change policy; data plus political organisation can."},{num:25,part:"Part 4: Analysis and Reporting",title:"Further quantitative inequality analysis approaches and measures",detail:"Decomposition analyses (which factors explain inequality), counterfactual analyses (what would inequality be under different conditions), trend analyses. More advanced methods for analysts who have completed the basics."}],c=[{num:1,part:"Part I: Health Equity",title:"The Concern for Equity in Health",author:"Sudhir Anand",detail:"Anand establishes why health equity matters as a distinct concern from health overall. The argument: health is special among capabilities because it conditions all others; inequality in health is therefore especially serious. Anand draws on Sen's capabilities approach to ground the argument theoretically."},{num:2,part:"Part I: Health Equity",title:"Why Health Equity?",author:"Amartya Sen",detail:"Sen's contribution to the volume he co-edited. Health equity is defended not as derived from a broader principle of justice but as a freestanding concern that any account of social justice must accommodate. Sen argues against reducing health equity to health utility or health resource allocation; equity has its own demands."},{num:3,part:"Part II: Health, Society, Justice",title:"Social Causes of Social Inequalities in Health",author:"Michael Marmot",detail:"Marmot summarises the Whitehall studies and his broader social epidemiological work. The social gradient in health is universal across the development spectrum: in every society, lower social position is associated with worse health, and the gradient is steep. The findings underpin the WHO Commission on Social Determinants of Health that Marmot later chaired."},{num:4,part:"Part II: Health, Society, Justice",title:"Health and Inequality, or, Why Justice is Good for Our Health",author:"Norman Daniels, Bruce Kennedy, Ichiro Kawachi",detail:"Daniels develops the Rawlsian framework for health justice. Health is special among goods because it is necessary for fair equality of opportunity. Inequalities in health are unjust when they restrict the range of opportunities available to individuals. Kennedy and Kawachi bring social epidemiological evidence on the pathways through which inequality damages health."},{num:5,part:"Part II: Health, Society, Justice",title:"Health Equity and Social Justice",author:"Fabienne Peter",detail:"Peter (one of the volume's editors) develops a contractualist account of health equity. The argument links health equity to political legitimacy: societies with severe health inequities cannot fully justify themselves to their members. The chapter is methodologically distinctive in the volume for its explicit political philosophy framing."},{num:6,part:"Part III: Responsibility",title:"Personal and Social Responsibility for Health",author:"Daniel Wikler",detail:"Wikler examines the tension between individual responsibility for health (smoking, diet, exercise) and social responsibility (poverty, working conditions, environmental exposure). The chapter is sceptical of strong individual-responsibility framings: many 'lifestyle choices' are shaped by structural conditions that limit genuine choice."},{num:7,part:"Part III: Responsibility",title:"Relational Conceptions of Justice: Responsibilities for Health Outcomes",author:"Thomas W. Pogge",detail:"Pogge applies his work on global justice to health. Wealthy countries and their institutions bear responsibility for ill health in poorer countries not just through aid failures but through structural features of the global economy (trade rules, intellectual property regimes, debt structures). The chapter remains directly relevant to current TRIPS-WTO debates."},{num:8,part:"Part III: Responsibility",title:"Just Health Care in a Pluri-National Country",author:"Philippe Van Parijs",detail:"Van Parijs (Belgian basic income theorist) examines how health care should be organised in countries with multiple national or linguistic communities (Belgium, Canada, Switzerland, India). The argument has direct application to Indian federalism and state-level health system variation."},{num:9,part:"Part IV: Ethics and Measurement",title:"Disability-Adjusted Life Years: A Critical Review",author:"Sudhir Anand and Kara Hanson",detail:"Anand and Hanson critique the DALY (the WHO-Bank-Harvard Global Burden of Disease metric). Their concerns: age-weighting, time discounting, disability weights, and the implicit ethical framework. The chapter has been highly influential in subsequent revisions of GBD methodology and remains the reference critique."},{num:10,part:"Part IV: Ethics and Measurement",title:"Ethical Issues in the Use of Cost Effectiveness Analysis for the Prioritisation of Health Care Resources",author:"Dan W. Brock",detail:"CEA in health care prioritisation has built-in ethical commitments that are rarely made explicit. Brock surfaces these: assumptions about equal weight to each unit of health gain, neutrality between treatment and prevention, no special weight for the severely ill. The chapter shows that CEA is not ethically neutral and must be evaluated as one ethical framework among others."},{num:11,part:"Part IV: Ethics and Measurement",title:"Deciding Whom to Help, Health-Adjusted Life Years and Disabilities",author:"Frances M. Kamm",detail:"Kamm examines specific moral dilemmas in health care priority setting: whether to prefer treating those who can be restored to full functioning over those who can only be partially restored, whether disability discounting in QALYs and DALYs is defensible, and whether 'rule of rescue' identifiable-victim claims should override average expected health gain."},{num:12,part:"Part IV: Ethics and Measurement",title:"The Value of Living Longer",author:"John Broome",detail:"Broome examines the question of how to value extended life in priority-setting frameworks. Should ten years added to a 30-year-old be worth more than ten years added to a 70-year-old? What ethical framework justifies the answer? The chapter is technical but accessible, important for anyone working with health-economic evaluation."},{num:13,part:"Part V: Conflicting Perspectives",title:"Health Achievement and Equity: External and Internal Perspectives",author:"Amartya Sen",detail:"Sen's second contribution. The distinction between external perspectives on health (epidemiology, statistics, expert assessment) and internal perspectives (lived experience, perceived health, cultural meanings). Both are essential; neither is sufficient. The chapter has been influential in qualitative health research and in mixed-method evaluations."},{num:14,part:"Part V: Conflicting Perspectives",title:"Ethics and Experience: An Anthropological Approach to Health Equity",author:"Arthur Kleinman",detail:"Kleinman (Harvard medical anthropologist) brings ethnographic methods to bear on health equity questions. The chapter argues that health equity work that ignores cultural meaning-making misses what makes health inequities matter to the people experiencing them. The methodological argument: ethnography is not a soft alternative to epidemiology but a necessary complement."},{num:15,part:"Part V: Conflicting Perspectives",title:"Equity of the Ineffable: Cultural and Political Constraints on Ethnomedicine as a Health Problem in Contemporary Tibet",author:"Vincanne Adams",detail:"Adams examines the politics of Tibetan medicine within the Chinese state. The chapter raises questions about whose health frameworks count, what happens when state-sponsored biomedicine displaces indigenous health systems, and what health equity requires when minority cultural practices are at stake. Reads as a case study with wider implications for Adivasi health practices in India, Aboriginal health in Australia, and similar contexts."}],d=[{title:"Health inequality monitoring in India",body:"India has substantial data infrastructure for inequality monitoring: NFHS (5 rounds since 1992-93; NFHS-5 in 2019-21), NSSO health rounds (60th 2004, 71st 2014, 75th 2017-18), SRS for mortality, HMIS for facility data, Census for population baseline, PLFS for employment-health linkages, LASI (Longitudinal Ageing Study in India) for older populations. The WHO HIM framework applies directly. The Indian Public Health Standards and the National Health Profile (CBHI annual) provide policy context. State-level health departments produce inequality reports of varying quality."},{title:"Indian dimensions of health inequality",body:"India-specific dimensions not always emphasised in WHO frameworks: caste (SC/ST/OBC/General categorisation, with internal heterogeneity), religion (Hindu/Muslim/Christian/Sikh/others), tribal status (PVTGs as a particularly disadvantaged subgroup), region (state, district, sub-district), urban-rural with rural-urban migration as a separate dimension. Maternal mortality, child stunting, immunisation coverage all show substantial inequality along these axes. The PROGRESS-Plus framework needs Indian extensions."},{title:"Indian policy frameworks for health equity",body:"Ayushman Bharat (2018-) includes Pradhan Mantri Jan Arogya Yojana (PMJAY) covering ~500 million for hospitalisation, and Health and Wellness Centres for primary care. The National Health Policy 2017 explicitly invokes health equity. The 15th Finance Commission allocations included health. State-level Mukhyamantri schemes vary widely (Aarogyasri in undivided AP, RSBY successors, state-specific MAA schemes). PMJAY data is a major underused resource for inequality analysis."},{title:"Anand, Sen, and the Indian intellectual tradition",body:"The Anand-Peter-Sen volume sits within a distinctive Indian intellectual tradition of writing on poverty, capabilities, and equity. Amartya Sen's work (Choice of Techniques 1960, Poverty and Famines 1981, Development as Freedom 1999, Idea of Justice 2009) is the core. Sudhir Anand has been central to UNDP Human Development Reports and to health-equity-specific work. Indian contributors to the field include Jean Drèze (food security, gender, health), Reetika Khera (food and welfare schemes), Aashish Gupta and Diane Coffey (open defecation and child stunting), the IIPS Mumbai analytical tradition."},{title:"DALYs and the Indian disease burden",body:"Anand and Hanson's critique of DALYs (Ch 9 of Anand/Peter/Sen) is methodologically important for any Indian researcher using GBD estimates. India has its own state-level burden of disease estimates (PHFI-ICMR-IHME India State-Level Disease Burden Initiative, published 2017-). These should be used critically with awareness of the DALY's built-in ethical commitments. The disability weighting question particularly matters for India given high disability burdens in poorer states."},{title:"Caste and health: an underdocumented Indian inequality",body:"Caste is constitutionally recognised as a basis for affirmative action in India but is under-measured in health statistics. NFHS captures SC/ST/OBC/General; finer caste detail is not routine. The Sachar Committee (2006) on Muslim status, the Mishra Commission on minority status, and various state-level commissions have generated targeted data. Caste inequality in child mortality, maternal mortality, nutrition, and life expectancy is substantial and well-documented in academic studies (Subramanian et al. 2007, Geruso and Spears 2018 economics) but rarely featured in mainstream health reports. The WHO HIM and Anand/Peter/Sen ethical frameworks both apply."},{title:"Indian institutions for health equity research",body:"Indian Institute of Public Health (IIPH) network (PHFI: Delhi, Gandhinagar, Hyderabad, Bhubaneswar, Shillong), AIIMS (Delhi and the newer AIIMS network), PGI Chandigarh, CMC Vellore, NIE Chennai, NCDC Delhi, ICMR institutes (NIN Hyderabad, NIRRH Mumbai, NIRT Chennai), IIPS Mumbai for demographic-health, JIPMER Puducherry. Academic centres at JNU Centre of Social Medicine, AIIMS Centre for Community Medicine, TISS School of Health Systems Studies. The PHFI-ICMR-IHME India State-Level Disease Burden Initiative is the major contemporary collaborative effort."}],f={lineHeight:1.7,color:"#1e293b",marginBottom:"1rem",fontSize:"1rem"},p={background:"white",border:"1px solid #e2e8f0",borderRadius:8,padding:"1.25rem",boxShadow:"0 1px 2px rgba(15, 23, 42, 0.04)"},h={color:"#D4520A",textDecoration:"underline"};function m({children:e}){return(0,i.jsx)("h2",{style:{fontFamily:"Inter, sans-serif",fontSize:"1.5rem",color:"#0F172A",marginTop:"2rem",marginBottom:"0.75rem",fontWeight:700,letterSpacing:"-0.01em"},children:e})}function g(){return(0,i.jsxs)("div",{children:[(0,i.jsx)(m,{children:"What this companion covers"}),(0,i.jsxs)("p",{style:f,children:["This companion pairs two complementary texts on health equity. The WHO's ",(0,i.jsx)("em",{children:"Health Inequality Monitoring: Harnessing Data to Advance Health Equity"})," (Geneva 2024, CC BY-NC-ND 3.0 IGO, ISBN 978-92-4-010260-6) provides the operational methodology for measuring and tracking health inequalities. Anand, Peter, and Sen's ",(0,i.jsx)("em",{children:"Public Health, Ethics, and Equity"})," (Oxford University Press 2004) provides the philosophical framework for why health equity matters and how to think about specific ethical problems in health policy."]}),(0,i.jsxs)("p",{style:f,children:["The two texts answer different questions but together address the central concern of health equity work: ",(0,i.jsx)("strong",{children:"what should we measure, and why does it matter?"})," ","The WHO volume addresses the what; Anand-Peter-Sen address the why. Researchers and practitioners need both."]}),(0,i.jsx)(m,{children:"WHO Health Inequality Monitoring (2024)"}),(0,i.jsxs)("p",{style:f,children:["25 chapters in 4 parts (Primer, Generating Impact, Data for Monitoring, Analysis and Reporting) plus annexes. Successor to WHO's 2013 ",(0,i.jsx)("em",{children:"Handbook on Health Inequality Monitoring"}),". Substantially expanded for data revolution, multisectoral action, and the Sustainable Development Goals 'leave no one behind' agenda. Free open-access publication with companion software (HEAT and HEAT Plus) and online portal."]}),(0,i.jsx)(m,{children:"Anand, Peter, and Sen, Public Health, Ethics, and Equity (2004)"}),(0,i.jsx)("p",{style:f,children:"15 chapters in 5 parts. Contributors include Amartya Sen (two chapters), Sudhir Anand (two chapters), Michael Marmot (social determinants), Norman Daniels (Rawlsian framework), Thomas Pogge (global justice), Daniel Wikler (responsibility), Philippe Van Parijs (pluri-national federalism), Frances Kamm and John Broome (philosophical ethics), Arthur Kleinman (medical anthropology). The volume is the reference text in philosophical health-equity scholarship and remains current 20+ years after publication."}),(0,i.jsx)(m,{children:"Why pair these texts"}),(0,i.jsx)("p",{style:f,children:"Three reasons. First, monitoring without ethical framing produces numbers without purpose. The WHO volume includes ethical considerations but does not develop the philosophical foundation that Anand-Peter-Sen provide. Second, ethical framing without measurement remains abstract. Anand-Peter-Sen describe what we ought to track; the WHO volume describes how to track it. Third, both texts share a commitment to taking inequality seriously rather than treating it as a side concern to average health improvement. Average improvement can mask widening inequality; both volumes resist that complacency."}),(0,i.jsx)(m,{children:"For Indian readers"}),(0,i.jsx)("p",{style:f,children:"Both texts have direct Indian relevance. The WHO methodology applies to Indian data infrastructure (NFHS, NSSO, SRS, HMIS, PLFS, LASI, PMJAY data). Anand and Sen are Indian by origin and their work draws on Indian experience throughout, even when examples are framed in general terms. The Indian health inequality landscape (caste, religion, tribal status, region, gender) raises distinctive analytical and ethical questions that neither text fully addresses but both equip readers to engage."}),(0,i.jsx)(m,{children:"Companion structure"}),(0,i.jsxs)("ul",{style:{...f,paddingLeft:"1.5rem"},children:[(0,i.jsxs)("li",{children:[(0,i.jsx)("strong",{children:"WHO Methodology"}),": all 25 WHO chapters across 4 parts."]}),(0,i.jsxs)("li",{children:[(0,i.jsx)("strong",{children:"Ethics and Justice"}),": all 15 Anand-Peter-Sen chapters across 5 parts."]}),(0,i.jsxs)("li",{children:[(0,i.jsx)("strong",{children:"Key Concepts"}),": terms and frameworks used across both texts."]}),(0,i.jsxs)("li",{children:[(0,i.jsx)("strong",{children:"India Applications"}),": data sources, dimensions, institutions, and unresolved questions in Indian health equity work."]}),(0,i.jsxs)("li",{children:[(0,i.jsx)("strong",{children:"Ask"}),": Gemini Q&A primed on both texts and Indian context."]})]})]})}function y({expanded:e,setExpanded:t}){return(0,i.jsxs)("div",{children:[(0,i.jsx)(m,{children:"WHO 2024: Health Inequality Monitoring"}),(0,i.jsx)("p",{style:f,children:"25 chapters across 4 parts plus annexes. The operational methodology for tracking health inequalities. Companion software (HEAT, HEAT Plus) and online portal at WHO data hub. Free under CC BY-NC-ND 3.0 IGO licence."}),["Part 1: A Primer","Part 2: Generating Impact","Part 3: Data for Monitoring","Part 4: Analysis and Reporting"].map(n=>{let r=u.filte Inequity: differences that are unjust because they arise from social arrangements that could be changed. The terminological distinction is foundational in both texts. WHO uses inequality as the empirical descriptor; equity captures the normative judgement."},{term:"Capabilities approach (Sen)",detail:"Wellbeing is best assessed by what people can actually do and be (capabilities), not by resources or utility. Health is a basic capability that conditions other capabilities. Health equity is therefore central to social justice rather than a side concern."},{term:"Social determinants of health (CSDH)",detail:"Conditions in which people are born, live, work, and age that shape health outcomes. WHO Commission on Social Determinants of Health (chaired by Marmot, 2008) framework. Anand-Peter-Sen Ch 3 (Marmot's contribution) is foundational reading."},{term:"PROGRESS-Plus framework",detail:"Categories for stratifying health inequality analysis: Place of residence, Race/ethnicity, Occupation, Gender/sex, Religion, Education, Socioeconomic status, Social capital, Plus (age, disability, sexual orientation, others). Used in Cochrane Equity, WHO HIM, many systematic reviews."},{term:"Universal Health Coverage (UHC)",detail:"All people receive needed health services without financial hardship. Three dimensions: population coverage, service coverage, financial protection. Equity dimension: who is included, what services are covered, and how the system is financed."},{term:"Progressive universalism",detail:"Universal coverage achieved with explicit prioritisation of the worst-off in design and rollout. Endorsed in the WHO HIM and discussed in Anand-Peter-Sen contributions on resource allocation. Defends universality against equity-only critiques and prioritisation against universalist critiques."},{term:"Concentration index",detail:"Summary measure of socioeconomic inequality in health. Ranges -1 to +1; zero means no inequality. Used heavily in health economics; one of the complex
