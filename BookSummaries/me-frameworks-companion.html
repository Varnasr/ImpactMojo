replication."},{area:"Learning",resource:"CLA Toolkit (Collaborating, Learning, and Adapting)",what:"USAID's framework for integrating learning into program management. Five components: collaborating, learning, adapting, enabling conditions, internal collaboration."},{area:"Learning",resource:"Theory of Change Workbook",what:"Step-by-step process for developing or strengthening a theory of change for an Activity. Required input for the MEL Plan."},{area:"Learning",resource:"Learning Agendas",what:"Strategic questions an organisation commits to answering through its M&E activities. USAID's 2023 snapshot identified five most important things to know about learning agendas."},{area:"Learning",resource:"Pause & Reflect, After-Action Reviews",what:"Structured reflection moments built into the program cycle. Pause & Reflect for mid-cycle adjustment; AARs after milestone events."},{area:"Communities",resource:"Communities of Practice",what:"Thematic groups (e.g., health, education, governance) for cross-Mission learning. Function as informal peer review."},{area:"Data",resource:"Agency Data Resources",what:"Foreign Aid Explorer (foreignassistance.gov), Development Data Library (DDL), Country Development Cooperation Strategy (CDCS) documents. Most are publicly available."}],c=[{num:1,page:"pp. 3-4",title:"What is monitoring and evaluation?",what:"Foundational distinction. Monitoring is systematic ongoing collection of information aimed at efficiency and effectiveness, internal to management. Evaluation is the comparison of actual project impacts against agreed strategic plans, formative (during) or summative (after). The 'check-up vs autopsy' analogy: monitoring is a check-up, evaluation is an autopsy."},{num:2,page:"pp. 5-6",title:"Why do monitoring and evaluation?",what:"M&E is not just for donor reporting. It is an internal management tool. Without M&E you may continue using resources to no useful end. The tendency in CSOs to do M&E only when donors insist is treated as a problem to overcome."},{num:3,page:"p. 7",title:"More about M&E: what each involves",what:"Monitoring involves: establishing indicators of efficiency/effectiveness/impact, setting up systems to collect information, collecting and recording, analysing, using information for day-to-day management. Evaluation involves: looking at intended impact, assessing progress toward targets, examining strategy, examining how it worked."},{num:4,page:"pp. 8-11",title:"Common evaluation terms and approaches",what:"Formative vs summative. Internal vs external. Participatory vs externally driven. The toolkit distinguishes these clearly so practitioners can specify what kind of evaluation they need rather than defaulting to donor-imposed terms."},{num:5,page:"p. 12",title:"Planning for M&E",what:"M&E must be part of planning, not retrofitted. First information gathering should take place at needs assessment. Indicators provide the framework. The toolkit links to companion CIVICUS toolkits on planning, strategic planning, action planning, and logical framework analysis (LFA)."},{num:6,page:"p. 13-15",title:"What do we want to know? Indicators",what:"Indicators for internal issues (organisational performance, financial efficiency) and external issues (programme outputs, outcomes, impact). The chapter distinguishes input, output, outcome, and impact indicators; warns against indicator inflation."},{num:7,page:"p. 16-19",title:"Baselines and reporting",what:"How to establish baselines before the project starts. Reporting cycles aligned with management and donor requirements. The discipline of comparing later data to baseline rather than to memory."},{num:8,page:"p. 20-27",title:"Designing a monitoring system",what:"Practical process: what to monitor, how often, who collects, who analyses, who acts. Case study of an organisation designing its monitoring system included."},{num:9,page:"pp. 28-29",title:"Damage control",what:"What to do when monitoring reveals problems. The chapter recognises that M&E findings are sometimes bad news and that organisations need protocols for engaging with bad news constructively rather than defensively."},{num:10,page:"pp. 30-33",title:"Methods",what:"Data collection methods for M&E: surveys, interviews, focus groups, observation, document review, case studies, most significant change. Strengths and limits of each."},{num:11,page:"p. 35",title:"Taking action",what:"The action loop: use M&E findings to change practice. The toolkit insists this loop is the point of M&E; without it, M&E becomes a reporting exercise."},{num:12,page:"p. 36",title:"Reporting",what:"Internal reporting (to management, board, staff), external reporting (to donors, beneficiaries, partners). Different audiences need different reports; one document for all audiences fails most of them."},{num:13,page:"pp. 37-47",title:"Best practice and resources",what:"Case studies, templates, sample indicators, and references. Includes example indicators across sectors that NGOs can adapt."},{num:14,page:"pp. 48-50",title:"Glossary of terms",what:"Definitions of M&E vocabulary: indicator, baseline, target, outcome, impact, opportunity cost, replicability, going to scale. The glossary alone is a useful reference."}],d=[{aspect:"Primary audience",usaid:"USAID Missions, implementing partners (large INGOs, contractors), grantees",civicus:"Civil society organisations, particularly mid-size NGOs in Global South"},{aspect:"Scale of activities envisaged",usaid:"Multi-million dollar Activities running 3-5 years across districts or country",civicus:"Smaller projects, sometimes single-site, often $50K-$2M and 1-3 years"},{aspect:"M&E architecture",usaid:"Performance Indicators (PIs), MEL Plan, Theory of Change, Learning Agenda — all mandatory artefacts with templates",civicus:"Indicators, monitoring system, evaluation plan — design choices left more open to the practitioner"},{aspect:"Underlying frame",usaid:"CLA (Collaborating, Learning, Adapting) as the cross-cutting management philosophy",civicus:"Efficiency, effectiveness, impact as the three evaluative criteria; participatory action is implicit"},{aspect:"Indicator-setting approach",usaid:"Linked to Country Development Cooperation Strategy (CDCS) Results Framework; harmonised across Activities",civicus:"Project-level, drawn from the organisation's own strategic plan and theory of change"},{aspect:"Evaluation rigour expectations",usaid:"Performance evaluations are mandatory above thresholds; impact evaluations expected for evidence-generating Activities",civicus:"External evaluations encouraged but not mandated; participatory evaluation acceptable"},{aspect:"Learning emphasis",usaid:"Learning Lab, ProgramNet, Communities of Practice, formal Learning Agendas",civicus:"Internal learning culture; reflection moments; case study sharing"},{aspect:"Documentation overhead",usaid:"High: MEL Plan, PIRS for each indicator, evaluation SOWs, AAR reports",civicus:"Moderate: monitoring records, evaluation reports, internal review notes"}],f=[{title:"USAID/India Country Development Cooperation Strategy 2024-2029",body:"USAID India operates under a CDCS that frames work in three Development Objectives: improved health outcomes, climate-resilient and inclusive economic growth, accountable democratic systems. All Activities funded under the CDCS must align with the Results Framework and apply the M&E architecture covered in the Program Cycle Mechanism. Indian implementing partners (PHFI, IIPS, university research groups, NGO consortia) work to USAID MEL Plan standards."},{title:"NITI Aayog's Development Monitoring and Evaluation Office (DMEO)",body:"DMEO, established in 2015, leads M&E for centrally sponsored schemes and central sector schemes. Its Output-Outcome Monitoring Framework (OOMF) covers about 100 government schemes. The framework borrows from the international M&E vocabulary but operates at a different scale (programmes covering hundreds of districts and crores of rupees). Indian researchers and consultancy firms working on DMEO assignments use both USAID-style and CIVICUS-style methods."},{title:"M&E for state government schemes",body:"Several state governments have established their own M&E units (Tamil Nadu, Karnataka, Andhra Pradesh, Telangana, Odisha). The Karnataka Evaluation Authority and the AP State Performance Review and Monitoring System are examples. These units commission independent evaluations and feed findings into state planning. The CIVICUS framework's emphasis on efficiency, effectiveness, and impact maps closely onto these state government M&E vocabularies."},{title:"Foundation-funded M&E in India",body:"Major foundations active in India (Tata Trusts, Bharti Foundation, Azim Premji Foundation, BMGF India, MacArthur Foundation, Rockefeller, Bloomberg Philanthropies, Wadhwani Foundation) have their own M&E expectations. These typically sit somewhere between USAID's rigour and CIVICUS's flexibility. The PRIA Centre for Public Participation has published Indian-context guidance on foundation M&E."},{title:"Civil society M&E ecosystem",body:"NGO Connect India, Sambhav Foundation, Sattva Consulting, Dasra, IDinsight, J-PAL South Asia, 3ie India regional office, and Sambodhi all play roles in the CSO M&E ecosystem. Sattva and Dasra do significant programme design and evaluation work for Indian NGOs that mirrors what CIVICUS recommends. IDinsight and J-PAL operate at the rigorous-evaluation end (often RCT-based) that aligns more with USAID's impact evaluation expectations."},{title:"MGNREGA and the social audit framework",body:"MGNREGA's mandatory social audit framework (since 2011) is an Indian innovation in participatory M&E. Social audits run twice a year in each gram panchayat. Mazdoor Kisan Shakti Sangathan (MKSS), Andhra Pradesh's Social Audit Unit, and several state SAUs have institutionalised this. The model influences but does not align cleanly with either USAID or CIVICUS frameworks: it is closer to participatory rural appra
