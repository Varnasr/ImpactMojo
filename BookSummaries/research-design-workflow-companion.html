ntence-case or title-case consistently; do not mix."]},{title:"Source types and citations",what:"Mix of source types signals breadth: peer-reviewed journal articles, books, government reports, dissertations, classics. The example shows citations like Ambrose et al. 1997, Etzkowitz 2008, Matusovich et al. 2010, Preston 2004 woven into prose with author-year format. Older sources are included to provide historical perspective on the topic.",callouts:["Cite consistently using one style (APA, Chicago, MLA) per institutional requirements.","Older sources provide context for the longevity of the topic; do not avoid them.","Integrate citations into argument rather than stacking them as a list."]},{title:"Synthesising rather than summarising",what:"The lit review's purpose is to synthesise, not to summarise. The annotated example shows this through thematic organisation (history → barriers → legislation → contemporary state) rather than source-by-source summary. Each paragraph carries an argument about the field, supported by multiple citations, not a recap of one paper.",callouts:["Each paragraph should make an argument or observation, not just describe a paper.","Group sources by theme, not by reading order.","When sources disagree, name the disagreement and take a position."]},{title:"Connection to the study",what:"The lit review must connect to the study being proposed. The annotated example ends the chapter by linking historical barriers to the study's motivation framework, signalling that the dissertation will examine employee motivation, turnover, and retention in STEM.",callouts:["Conclude the chapter with the gap that the study fills.","Forward-link to the methodology chapter."]}],c=[{title:"What is qualitative formative research?",body:"Qualitative or formative research is an activity conducted at the start of the Social and Behavior Change Communication (SBCC) project design process. Qualitative research is a key step to create program materials, tools, and approaches that are culturally appropriate given the local context. Qualitative methods collect data and answer questions such as 'why' and 'how' and, although they provide rich detail, they are not meant to generalise to an entire population."},{title:"Why conduct it?",body:"To gain insight into the health issue or behavior the project intends to address; relevant characteristics of primary and secondary audiences; communication access, habits and preferences; and the main factors that hinder and drive behavior. Use qualitative methods when programme planners need to understand attitudes, habits, and behaviors of the audience but do not need to estimate the proportion of attitudes, beliefs, or knowledge levels."},{title:"Who should conduct it?",body:"Research staff in close collaboration with programme staff and any government or NGO counterparts who are designing the programme and have clear knowledge of programme goals. Using qualitative methods requires interviewing and group discussion skills, and an understanding of what the programme needs to know to design appropriate strategies and materials."},{title:"When to conduct it?",body:"At the beginning of SBCC programmes. Helps researchers and programme managers discover and explore themes or processes, provide personal narratives, and uncover attitudes or ideas common among members of a population. This method cannot determine the proportion of people who think or act in a particular way; for that, use quantitative methods later."}],d=[{method:"Focus Group Discussions (FGDs)",definition:"Group discussions intended to identify the beliefs and opinions of a selected group of people on a specific topic.",bestFor:"Surfacing shared beliefs and group norms; observing interaction between participants; exploring how opinions form in group settings; relatively quick coverage of multiple voices.",avoid:"Sensitive topics where individuals will not speak openly in a group (sexual behavior, IPV, mental health); topics with strong power asymmetries between potential participants; when individual lived experiences need depth rather than group consensus."},{method:"In-Depth Interviews (IDIs)",definition:"One-on-one discussions designed to provide a detailed picture of an individual participant's views about the area of interest.",bestFor:"Sensitive topics; understanding individual decision-making and life history; topics where social desirability bias would distort group responses; surfacing minority experiences that group dynamics would suppress.",avoid:"When the research interest is precisely in how views form in social interaction; when time or budget constraints make many interviews infeasible; when participant comfort comes from peer presence."}],f=[{title:"The paradigm war",body:"Quantitative and qualitative research have historically been associated with different philosophical paradigms — positivism (quant) and interpretivism (qual). Critics of mixed methods argue these paradigms are incommensurable and cannot be coherently combined. Defenders (Creswell, Tashakkori, Teddlie) argue pragmatism resolves the tension: methods should be chosen based on the research question, not philosophical purity.",citing:"Creswell 2011; Creswell & Plano Clark 2007; Tashakkori & Teddlie 2003; Johnson et al. 2007"},{title:"Three integration designs",body:"Tashakkori and Teddlie (1998) identify three integration approaches: (1) Concurrent mixed analysis — analyse qualitative and quantitative data simultaneously; (2) Sequential qualitative-quantitative — analyse qual data first, then quant; (3) Sequential quantitative-qualitative — analyse quant data first, then qual. The choice depends on whether qual is exploring before measurement or explaining after measurement.",citing:"Tashakkori & Teddlie 1998; Venkatesh et al. 2016"},{title:"Validity vs Tracy's 'Big Tent' criteria",body:"Quantitative validity rests on the precision of measurement and reliability of instruments. Qualitative rigour cannot use these same standards. Tracy's (2010) 'Eight Big Tent' criteria for excellent qualitative research provide an alternative: worthy topic, rich rigour, sincerity, credibility, resonance, significant contribution, ethics, meaningful coherence.",citing:"Tracy 2010; Fletcher et al. 2005; Heale & Twycross 2015"},{title:"Historical depth",body:"Mixed methods are not new. DuBois (1898) engaged in fieldwork to obtain data while studying 8000 inhabitants of a Philadelphia slum, using in-depth house-to-house interviews — a mix that seemed strange at the time. The methodology gathered traction in social sciences and health services through the mid-20th century, with formal designations developing in the 1980s.",citing:"Bulmer et al. 1991 as cited in Jerabek 2016; Maxwell 2016"},{title:"When NOT to use mixed methods",body:"Mixed methods is not a default. It is appropriate when the research question genuinely requires both types of evidence and when the team has the methodological capacity for both. Common failure modes: weak qual or weak quant components dressed up as mixed methods; tokenistic qual at the end of a quant study; integration that never happens beyond presenting both in parallel.",citing:"Adu et al. 2022 implicit critique"}],p=[{criterion:"Worthy topic",what:"Is the research topic relevant, timely, significant, interesting?"},{criterion:"Rich rigour",what:"Are the theoretical constructs, data, time in field, sample, contexts, and analytic processes sufficient and complex?"},{criterion:"Sincerity",what:"Self-reflexivity about subjective values, biases, and inclinations of the researcher; transparency about methods and challenges."},{criterion:"Credibility",what:"Thick description, triangulation, member reflections, multivocality. Does the work feel believable?"},{criterion:"Resonance",what:"Aesthetic merit; transferability; evocative writing. Does the work move readers and affect their understanding?"},{criterion:"Significant contribution",what:"Theoretical, practical, methodological, heuristic. Does the work meaningfully advance the field?"},{criterion:"Ethics",what:"Procedural ethics (IRB), situational ethics (in-field judgment), relational ethics, exiting ethics."},{criterion:"Meaningful coherence",what:"Does the study achieve what it claims to be about? Are the literature, research questions, findings, and interpretations connected?"}],h=[{section:"Question design",items:[{practice:"Respect memory limitations",detail:"Long retrospective questions ('How many times did you check your investment portfolio over the last year?') exceed normal recall capacity. Shorten the time horizon (e.g., 'over the last week') to improve response validity. Citations: Bradburn et al. 1979/1987; Converse & Traugott 1986; Sudman & Bradburn 1982."},{practice:"Avoid context-dependent introspection",detail:"Questions like 'How was your choice to sell stock XYZ related to its ranking as the 10th best performer?' assume participants can access the causal influence of context on their decisions. They typically cannot (Nisbett & Wilson 1977). Reframe as direct behavior questions or use field data."},{practice:"Treat detailed estimates as relative, not absolute",detail:"Coarse facts ('Did you trade in your portfolio yesterday?') can be reported accurately. Detailed estimates ('What is the probability you will purchase Stock XYZ next week?') are subject to context, ordering, and framing effects. Use relative comparisons across conditions, not absolute levels."}]},{section:"Platform tooling",items:[{practice:"Qualtrics for survey programming",detail:"Industry-standard survey platform for academic research. Supports complex skip logic, randomisation, embedded experimental conditions, and integration with participant pools. Most universities have institutional licenses."},{practice:"Amazon Mechanical Turk (MTurk) for participant recruitment",detail:"Crowdsourced participant pool. Provides quick recruitment of US, UK, and other country samples. Caveats: MTurk participants are not representative of general populations and have been over-sampled in social science. Increasingly used alongside Prolific Academic for diversity."},{practice:"Pre-registration",detail:"Register hypotheses and analysis plans before data collection at OSF (Open Science Framework) or AsPredicted. The paper argues this is increasingly standard in finance and economics surveys, both to demonstrate confirmatory analysis and to insulate against reviewer requests for additional 'exploratory' tests."}]},{section:"Experimental design",items:[{practice:"Between-subjects vs within-subjects",detail:"Between-subjects designs assign each participant to one condition; within-subjects designs expose participants to all conditions. Within-subjects designs are statistically more powerful but introduce order effects and demand characteristics. The paper recommends between-subjects for survey-based experiments unless the research question requires within-subjects comparison."},{practice:"Manipulation checks",detail:"Confirm that the intended experimental manipulation actually changed what you intended (e.g., the high-fee vs low-fee description was perceived as such). Without manipulation checks, null effects could mean either the hypothesis is wrong or the manipulation failed."},{practice:"Attention checks",detail:"Identify inattentive responses. Standard versions include instructional manipulation checks ('Select option C to show you are reading') and trap questions. Exclude inattentive participants pre-registered. Note: excessive attention checks themselves can affect participant behavior."}]},{section:"Sample considerations",items:[{practice:"Sample size justification",detail:"Survey experiments typically use power analysis to justify sample size. For comparing two means with medium effect (Cohen's d = 0.5) at 80% power and α = 0.05, n ≈ 64 per condition. Adjust for the actual expected effect size and inclusion of covariates."},{practice:"Representative vs convenience samples",detail:"MTurk and Prolific samples are convenience samples, not nationally representative. For descriptive statistics about populations, use nationally representative panels (NORC AmeriSpeak, KnowledgePanel, etc.). For testing causal mechanisms via experiments, convenience samples are often acceptable."}]}],m=[{title:"Literature review for an Indian dissertation",body:"The Writing Center guide is US-centric (citing ProQuest, ERIC, SAGE; using the women in STEM example). For Indian research, supplement databases with Shodhganga (the InflibNet repository of Indian doctoral theses), J-Gate (Indian academic journal aggregator), and EconLit-South Asia content. Cite Indian government data sources directly: NFHS rounds via DHS Program, PLFS via MoSPI, NSS rounds via NSO. Indian dissertation citation conventions vary by institution; UGC has not enforced uniform standards. Common at JNU, TISS: APA-modified; common at IIM/IIT social sciences: Chicago author-date."},{title:"Formative research for Indian SBCC programmes",body:"Major SBCC formative research traditions in India: PRADAN's gender-focused formative work in Jharkhand and Bihar; UNICEF India's formative research preceding GARIMA, UDAYA, and Anandi programmes; Tata Trusts' formative work for Swasth Bharat Prerak; Center for Catalyzing Change (formerly CEDPA India) on adolescent girls. IDI-vs-FGD choice in Indian contexts: FGDs work for adolescent peer groups, women's collectives (SHGs), male decision-makers; IDIs work for IPV survivors, healthcare seekers with stigma, intra-household decision-making questions. The Compass for SBC guide is implementable with Indian field teams; major SBCC consultancies (Population Council India, FHI 360 India, Sambhav, Centre for Catalyzing Change) use this exact methodology."},{title:"Mixed methods in Indian development research",body:"Indian mixed-methods research strong in: NFHS-companion qualitative work (IIPS, Population Council); J-PAL South Asia and IFPRI Delhi qual-quant integration in evaluation; CPR Delhi mixed work on urban policy; SEWA Bharat's own monitoring combining quant (member numbers, savings) with qual (testimonies, life histories). Tracy's Big Tent criteria are not yet standard in Indian methodology training but are taught at TISS Mumbai, Azim Premji University, and the Hyderabad-based Center for Economic and Social Studies (CESS). The DuBois 1898 historical anchor in Adu et al. has an Indian parallel in the Annie Besant-led empirical studies of caste discrimination from 1898-1916, though these are not in mainstream mixed-methods historiography."},{title:"Online surveys for Indian research",body:"Bergman et al.'s assumptions (Qualtrics + MTurk, English-language) need adjustment for India. MTurk India workers are concentrated in a few demographic strata (young, urban, English-literate, mostly male); they are not representative of India. Alternative platforms: Centiment-India, BluerPanel-India, Kantar India panels, IPSOS India, Nielsen India. For phone surveys (often preferred over online in India), CATI services from sigma research, Centric Consulting, Sambodhi. For SMS-based surveys, Viamo (the former VOTO Mobile), GeoPoll. Pre-registration at OSF/AsPredicted is rare in Indian research; encouraging this is one cheap way to improve research quality."},{title:"Putting the four sources in sequence for an Indian PhD",body:"Year 1: Lit review (Writing Center guide adapted with Shodhganga and Indian databases); identify gap and develop research question. Year 1 end / Year 2: Formative research (Compass for SBC adapted for the specific Indian context — KIIs with stakeholders, FGDs with the target population). Year 2: Mixed methods design decisions (Adu et al. — concurrent or sequential, with Tracy's Big Tent for qual rigour). Year 2-3: Survey design and fielding (Bergman et al. adapted for Indian platforms and multi-language considerations). Year 3-4: Analysis and write-up. Total: 4-5 years which matches typical Indian PhD timelines at IITs, JNU, IIMs, and central universities."}],g={lineHeight:1.7,color:"#1e293b",marginBottom:"1rem",fontSize:"1rem"},y={background:"white",border:"1px solid #e2e8f0",borderRadius:8,padding:"1.25rem",boxShadow:"0 1px 2px rgba(15, 23, 42, 0.04)"},v={color:"#D4520A",textDecoration:"underline"};function b({children:e}){return(0,l.jsx)("h2",{style:{fontFamily:"Inter, sans-serif",fontSize:"1.5rem",color:"#0F172A",marginTop:"2rem",marginBottom:"0.75rem",fontWeight:700,letterSpacing:"-0.01em"},children:e})}function w({children:e}){return(0,l.jsx)("div",{style:{fontFamily:"Inter, sans-serif",fontSize:"0.75rem",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.1em",color:"#1e3a5f",marginTop:"1rem",marginBottom:"0.5rem"},children:e})}function k(){return(0,l.jsxs)("div",{children:[(0,l.jsx)(b,{children:"Four pieces of a research design workflow"}),(0,l.jsx)("p",{style:g,children:"This companion brings together four practical references that, in sequence, cover the early-to-middle stages of an empirical research project: organising existing literature, conducting formative qualitative research, deciding on mixed-methods integration, and designing online surveys. None of the four is a textbook; each is a working guide intended for graduate students or early-career researchers learning the operational details of their craft."}),(0,l.jsxs)("div",{style:{display:"grid",gap:"1rem",marginTop:"1.5rem"},children:[(0,l.jsx)(S,{colour:"#7c3aed",stage:"Stage 1",title:"Annotated literature review chapter",source:"University Writing Center sample (annotated dissertation Chapter II)",pages:"30 pages · STEM women workforce example",summary:"A worked example of a dissertation literature review chapter with margin annotations showing search strategy, organisation, heading levels, citation conventions, and how to synthesise rather than summarise."}),(0,l.jsx)(S,{colour:"#0891b2",stage:"Stage 2",title:"How to Conduct Qualitative Formative Research",source:"thecompassforsbc.org (John
