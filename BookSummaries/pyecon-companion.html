mparisons.",keyTopics:["Matrix algebra in numpy","Coefficient interpretation in multivariate context","Omitted variable bias formula","VIF computation","Frisch-Waugh-Lovell intuition"]},{num:4,title:"Multiple Regression Analysis: Inference",section:"Cross-Section Foundations",detail:"Hypothesis testing in regression. Standard errors, t statistics, p values. Confidence intervals for coefficients. F tests for joint hypotheses (including the overall F test). Testing linear restrictions. Wald tests in statsmodels. The chapter is where most applied econometrics happens.",keyTopics:["t tests and p values from statsmodels","F tests for joint significance","Linear restrictions testing","Wald and LR tests"]},{num:5,title:"Multiple Regression Analysis: OLS Asymptotics",section:"Cross-Section Foundations",detail:"Large-sample properties of OLS. Consistency, asymptotic normality, asymptotic efficiency. Monte Carlo demonstrations of asymptotic behaviour. Conditions for asymptotic results. The chapter justifies inference when normality of errors is questionable but the sample is large.",keyTopics:["Consistency demonstrations via Monte Carlo","Asymptotic standard errors","Departures from normality and sample size"]},{num:6,title:"Multiple Regression Analysis: Further Issues",section:"Cross-Section Foundations",detail:"Functional form decisions: logs, quadratics, interactions. Standardised coefficients (beta coefficients). Prediction intervals. Model specification tests (RESET). Diagnostics for influential observations. The chapter handles the practical decisions that follow basic estimation.",keyTopics:["Log and log-log specifications","Quadratics and interaction effects","Prediction intervals","RESET test","Influence diagnostics"]},{num:7,title:"Multiple Regression Analysis with Qualitative Information",section:"Cross-Section Foundations",detail:"Dummy variables for binary and multi-category regressors. Interaction terms with dummies (slope differences across groups). Chow test for structural change. Linear probability model (LPM) as a stepping stone to probit/logit (Ch 17). The chapter is foundational for evaluating heterogeneous treatment effects.",keyTopics:["Dummy variable coding in pandas","Interaction terms","Chow test","LPM coefficient interpretation"]},{num:8,title:"Heteroscedasticity",section:"Cross-Section Foundations",detail:"Detection of heteroscedasticity: Breusch-Pagan, White tests. Robust standard errors (Eicker-Huber-White). Generalised least squares (GLS) and feasible GLS. When to use robust vs GLS. statsmodels HC0/HC1/HC2/HC3 options.",keyTopics:["Breusch-Pagan and White tests in statsmodels","Robust standard errors (HC0-HC3)","GLS and FGLS implementation","When robust SE is sufficient"]},{num:9,title:"More on Specification and Data Issues",section:"Cross-Section Foundations",detail:"Measurement error in regressors and dependent variables. Missing data: MCAR, MAR, MNAR. Listwise deletion vs imputation. Proxy variables for unobserved factors. Outliers and robust regression alternatives. Specification searches and pre-analysis plans.",keyTopics:["Measurement error consequences","Missing data treatment in pandas","Proxy variable validity","Robust regression alternatives"]},{num:10,title:"Basic Regression Analysis with Time Series Data",section:"Time Series",detail:"Time series properties: stationarity, trends, seasonality. Static and finite distributed lag models. Trend and seasonal dummies. Time series in pandas (DatetimeIndex, resample, rolling). Why time series breaks the standard cross-section assumptions.",keyTopics:["pandas time series operations","Static and FDL models","Trend and seasonal handling","Stationarity introduction"]},{num:11,title:"Further Issues with OLS and Time Series",section:"Time Series",detail:"Asymptotic properties of time series OLS. Weakly dependent time series. Highly persistent (integrated) series. Random walks and unit roots. The implications of non-stationarity for inference. Spurious regression.",keyTopics:["Weakly dependent vs persistent series","Unit roots and ADF tests","Spurious regression demonstration","Differencing as a remedy"]},{num:12,title:"Serial Correlation and Heteroscedasticity in Time Series Regressions",section:"Time Series",detail:"Serial correlation tests: Durbin-Watson, Breusch-Godfrey. Newey-West (HAC) standard errors for time series. Cochrane-Orcutt and Prais-Winsten estimators. Time-series specific heteroscedasticity (ARCH/GARCH introduction).",keyTopics:["DW and BG tests","HAC standard errors in statsmodels","Cochrane-Orcutt implementation","ARCH/GARCH preview"]},{num:13,title:"Pooling Cross Sections Across Time",section:"Panel and Causal Methods",detail:"Pooled cross sections (different individuals each year). Time dummy variables. Interaction with time dummies. Difference-in-differences as a special case. The chapter is the gateway to causal panel methods.",keyTopics:["Pooled OLS with time dummies","DiD estimator implementation","Two-by-two and generalised DiD","Parallel trends assumption"]},{num:14,title:"Advanced Panel Data Methods",section:"Panel and Causal Methods",detail:"Fixed effects (FE) and random effects (RE) estimators. Within and between transformations. Hausman test for FE vs RE. Two-way fixed effects. Cluster-robust standard errors for panel data. linearmodels package for Python panel analysis (alongside statsmodels).",keyTopics:["linearmodels.panel for FE/RE","Within transformation","Hausman test","Cluster-robust SEs","Two-way FE"]},{num:15,title:"Instrumental Variables Estimation",section:"Panel and Causal Methods",detail:"Endogeneity sources: omitted variables, measurement error, simultaneity. IV estimation: 2SLS implementation. Instrument relevance (first-stage F statistic, rule of thumb F>10) and validity (exclusion restriction). Over-identification tests (Sargan, Hansen J). Weak instrument problems and their consequences.",keyTopics:["linearmodels.iv.IV2SLS","First-stage F and weak IV","Sargan/Hansen overid tests","Wu-Hausman endogeneity test"]},{num:16,title:"Simultaneous Equations Models",section:"Panel and Causal Methods",detail:"Structural vs reduced form equations. Identification (order and rank conditions). Indirect least squares, 2SLS, 3SLS, FIML, LIML. Empirical examples from supply-demand systems. Less common in modern applied work but conceptually important.",keyTopics:["Identification conditions","2SLS and 3SLS for systems","Supply-demand identification","Modern relevance for structural modelling"]},{num:17,title:"Limited Dependent Variable Models",section:"Advanced Topics",detail:"Probit and logit models for binary dependent variables. Multinomial logit and probit. Ordered probit and logit. Tobit for censored outcomes. Sample selection (Heckman). Count data (Poisson, negative binomial). statsmodels.discrete implementation. Marginal effects calculation.",keyTopics:["Probit and logit in statsmodels","Marginal effects at means vs average marginal effects","Multinomial logit interpretation","Tobit and selection models","Count data models"]},{num:18,title:"Advanced Time Series Topics",section:"Advanced Topics",detail:"Cointegration and error correction models (Engle-Granger, Johansen). Vector autoregressions (VAR) for multivariate time series. Forecasting with VARs. Impulse response functions. ARCH/GARCH for volatility. The chapter is the gateway to time series econometrics beyond regression.",keyTopics:["Engle-Granger cointegration","VAR estimation and IRFs in statsmodels","ARCH/GARCH with arch package","Forecasting metrics"]},{num:19,title:"Carrying Out an Empirical Project",section:"Advanced Topics",detail:"Project workflow: research question, data acquisition, cleaning, exploratory analysis, model selection, robustness checks, writing up. Reproducibility practices: scripts, version control, documentation. Pre-registration considerations. Replication packages. The chapter ties the technical content to professional practice.",keyTopics:["End-to-end project workflow","Reproducibility (Git, environments)","Pre-registration","Writing economics papers"]}],c=[{name:"Foundations",colour:"#7c3aed",desc:"Chapter 1. Python setup and statistical foundations needed for the rest of the book."},{name:"Cross-Section Foundations",colour:"#0891b2",desc:"Chapters 2-9. Simple and multiple regression in cross-section data. The core of introductory econometrics."},{name:"Time Series",colour:"#16a34a",desc:"Chapters 10-12. Time series properties, stationarity, autocorrelation. Different assumptions and methods from cross-section."},{name:"Panel and Causal Methods",colour:"#dc2626",desc:"Chapters 13-16. Pooled cross-sections, panel data with fixed effects, instrumental variables, simultaneous equations. The empirically most important methods in applied microeconomics."},{name:"Advanced Topics",colour:"#D4520A",desc:"Chapters 17-19. Limited dependent variables, advanced time series, empirical project workflow."}],d=[{pkg:"numpy",purpose:"Numerical arrays and matrix algebra. The foundation of scientific Python.",typical:"Vectors, matrices, random number generation, linear algebra operations."},{pkg:"pandas",purpose:"DataFrames for structured (tabular) data. Reading CSV, Excel, Stata files.",typical:"Data manipulation, time series with DatetimeIndex, groupby operations, merging datasets."},{pkg:"matplotlib",purpose:"Plotting. Base graphics library that other packages build on.",typical:"Scatter plots, histograms, time series plots, regression diagnostic plots."},{pkg:"statsmodels",purpose:"Statistical models including OLS, GLS, GLM, time series, hypothesis tests.",typical:"OLS estimation, robust standard errors, time series models (ARIMA, VAR), probit/logit."},{pkg:"scipy.stats",purpose:"Probability distributions and statistical tests.",typical:"Density functions, CDF computation, random draws, hypothesis tests."},{pkg:"linearmodels",purpose:"Panel data and IV estimation. Fills gaps in statsmodels for panel work.",typical:"Fixed effects (PanelOLS), random effects, 2SLS (IV2SLS), GMM panel estimators."},{pkg:"wooldridge",purpose:"Datasets from Wooldridge's textbook, directly importable in Python.",typical:"Load Wooldridge example datasets by name; matches the original Wooldridge problem sets."},{pkg:"arch",purpose:"Financial econometrics, ARCH/GARCH volatility models, bootstrap inference.",typical:"GARCH estimation, volatility forecasting, unit root tests, bootstrap standard errors."}],f=[{title:"Heiss-Brunner alongside Wooldridge in Indian econometrics teaching",body:"Wooldridge's <em>Introductory Econometrics</em> (2020, 7th ed., Cengage) is the standard textbook in Indian econometrics courses at undergraduate honours level (DSE, JNU CESP, IIM PGP economics, Ashoka, Krea, Azim Premji, Jindal, IIT economics programmes) and postgraduate level. Heiss and Brunner provide the Python translation. Stata remains the dominant teaching language in many Indian programmes, but Python is gaining ground rapidly, especially in IIM and IIT programmes and in computational social science work. The book serves as a transition resource: students who learn Wooldridge in Stata can pick up Python for research applications."},{title:"Indian datasets in Python",body:"Major Indian datasets readable in Python: NFHS (5 rounds via IIPS, available as Stata .dta files readable by pandas.read_stata), NSSO various rounds (CSV from MoSPI or DSE Open Data), PLFS quarterly bulletins (XML/CSV), HMIS (Excel from MoHFW), India Human Development Survey (IHDS via ICPSR, .dta and .sav), Census tables (CSV from censusindia.gov.in), state budget data, RBI's DBIE (Database on Indian Economy, XLS/CSV/JSON), IMF and World Bank data via API. The pandas data handling chapter (Ch 1) prepares students for this work; subsequent chapters provide the econometric methods."},{title:"Indian Python econometrics community",body:"PyData India (annual conferences), Bangalore Python user groups, Hyderabad and Delhi data science meetups have growing econometrics representation. The Indian Statistical Institute has Python-based teaching in its computational courses. IIM Bangalore's data science programmes use Python heavily. Research economists at ISI, JNU, DSE, IIM Ahmedabad and Bangalore, Ashoka, ISB Hyderabad increasingly publish replication code in Python alongside Stata. The 3ie replication initiative accepts Python code."},{title:"Causal inference in Indian applied work",body:"Indian applied econometrics is rich in causal inference applications: J-PAL South Asia RCTs (Ch 13-14 methods), MGNREGA evaluations using DiD (Imbert and Papp 2015, Berg et al 2018), AfDB-funded RCTs in financial inclusion (Karlan, Banerjee, Duflo), regression discontinuity work on caste-based reservations (Pande 2003 onwards, Bhalotra and Clots-Figueras), Aadhaar-related natural experiments (Muralidharan et al on PDS, NREGS). Heiss-Brunner Ch 13-16 provide the toolkit; Indian applications are abundant."},{title:"Limitations of Heiss-Brunner for Indian work",body:"Three limitations specific to Indian application. First, the book follows Wooldridge's US-context examples (wages, schooling returns, crime, sports). Indian datasets and policy questions are not featured. Second, the book uses standard sampling assumptions; Indian sample design (NFHS, NSSO have complex multi-stage clustering) requires additional code for design-based inference. The svy commands in Stata or survey package in R have less seamless Python equivalents. Third, the book does not address spatial econometrics, increasingly important for Indian agricultural and urban research (the pysal ecosystem fills this gap)."},{title:"Heiss-Brunner alongside other resources",body:"For Indian econometrics learners using Python: pair Heiss-Brunner with: (a) Wooldridge (2020) for theory and US examples; (b) Angrist and Pischke <em>Mostly Harmless Econometrics</em> (2009) for causal inference orientation; (c) Cunningham <em>Causal Inference: The Mixtape</em> (2021) with code in R/Stata/Python for modern causal methods; (d) Huntington-Klein <em>The Effect</em> (2021) similar coverage with Python notebooks; (e) Mostly Harmless Econometrics by Angrist and Pischke for IV and DiD; (f) Imbens and Rubin (2015) for the design-based approach to causal inference at advanced level."}],p={lineHeight:1.7,color:"#1e293b",marginBottom:"1rem",fontSize:"1rem"},m={background:"white",border:"1px solid #e2e8f0",borderRadius:8,padding:"1.25rem",boxShadow:"0 1px 2px rgba(15, 23, 42, 0.04)"},h={color:"#D4520A",textDecoration:"underline"};function g({children:e}){return(0,o.jsx)("h2",{style:{fontFamily:"Inter, sans-serif",fontSize:"1.5rem",color:"#0F172A",marginTop:"2rem",marginBottom:"0.75rem",fontWeight:700,letterSpacing:"-0.01em"},children:e})}function y({children:e}){return(0,o.jsx)("div",{style:{fontFamily:"Inter, sans-serif",fontSize:"0.75rem",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.1em",color:"#1e3a5f",marginTop:"1rem",marginBottom:"0.5rem"},children:e})}function v(){return(0,o.jsxs)("div",{children:[(0,o.jsx)(g,{children:"What this book is"}),(0,o.jsxs)("p",{style:p,children:["Florian Heiss (Heinrich Heine University Düsseldorf) and Daniel Brunner published the second edition of ",(0,o.jsx)("em",{children:"Using Python for Introductory Econometrics"})," in 2024 (first edition 2020). Free open-access. Companion website: ",(0,o.jsx)("a",{style:h,href:"https://www.UPfIE.net",children:"UPfIE.net"})," ","with datasets, code, and errata."]}),(0,o.jsxs)("p",{style:p,children:["The book is a Python translation of Jeffrey Wooldridge's ",(0,o.jsx)("em",{children:"Introductory Econometrics: A Modern Approach"})," (Cengage, 7th edition 2020). Chapter numbering and structure follow Wooldridge exactly: 19 chapters covering simple and multiple regression, time series, panel data, instrumental variables, limited dependent variables, and empirical project workflow. Each chapter shows how to do the Wooldridge methods in Python using numpy, pandas, statsmodels, and linearmodel
