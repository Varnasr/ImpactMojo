# CI — broken link checks, pa11y accessibility audit, and HTML validation
# Note: axe-core accessibility testing is handled by accessibility.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily at 06:17 UTC — catches any i18n/encoding regression even with no push.
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  encoding:
    name: Encoding / mojibake guard
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check for mojibake / encoding corruption
        run: python3 scripts/check-mojibake.py

  i18n-quality:
    name: i18n translation-quality guard
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check for translation corruption (cross-script, brand, artifacts, char-runs)
        run: python3 scripts/check-i18n-quality.py

  asset-stamps:
    name: Asset stamp freshness
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check asset stamps
        run: python3 scripts/stamp-assets.py --check

  diagram-contrast:
    name: Diagram text contrast
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check diagram contrast
        run: python3 scripts/check-diagram-contrast.py

  conflict-markers:
    name: Merge-conflict-marker guard
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check for committed conflict markers
        run: python3 scripts/check-conflict-markers.py

  internal-links:
    name: Internal-link guard
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check internal links resolve
        run: python3 scripts/check-internal-links.py

  counts:
    name: Content-count drift guard
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check content counts match data/counts.json
        run: python3 scripts/check-counts.py

  supabase-writes:
    name: Supabase write-path guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Static only: needs no credentials, so it runs on every push. Catches a
      # write whose result is discarded — the shape that hid the dead
      # user_progress sync for eight months, since supabase-js resolves with
      # { data, error } rather than throwing.
      - name: Every Supabase write surfaces its errors
        run: python3 scripts/check-supabase-writes.py

  supabase-writes-live:
    name: Supabase write-path guard (live insert counts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Hits the live database, so schedule/dispatch only — same reasoning as
    # supabase-anon below. Skips gracefully when SUPABASE_PAT is absent.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - name: Assert every written table has ever received a row
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: python3 scripts/check-supabase-writes.py --live

  supabase-anon:
    name: Supabase anon-exposure guard
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    # Hits the live PostgREST API, so it runs on the daily schedule and on
    # demand — not on every PR, where third-party latency would add flake and
    # contributors can't act on the result anyway.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - name: Probe anon exposure against the expected contract
        run: python3 scripts/check-supabase-anon.py

  book-companions:
    name: Book-companion blank-page guard
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check every companion has renderable DATA (no blank pages)
        run: python3 scripts/check-book-companions.py

  service-worker:
    name: Service worker behaviour test
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test service worker routing & lifecycle
        run: node scripts/test-service-worker.mjs

  search-coverage:
    name: Site-search coverage
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The sitemap is what we tell Google exists; the search index is what our
      # own visitors can find. They had drifted 127 pages apart -- posters,
      # reading companions, course lexicons and premium tools were live and
      # crawlable and site search returned none of them, because adding a page
      # updates the sitemap and the index is a separate file nobody must touch.
      - name: Check every sitemap page is findable in site search
        run: python3 scripts/check-search-coverage.py

  social-images:
    name: Social preview image guard
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # A missing og:image is invisible from inside the site: the page renders
      # perfectly and only shares without a picture, on somebody else's
      # timeline. Four were live when this was written, including a blog post
      # published the same morning.
      - name: Check every social preview image resolves
        run: python3 scripts/check-social-images.py

  theme-contrast:
    name: Theme contrast (both themes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # A colour is only ever half-chosen: a value picked against one theme's
      # surfaces can be unreadable against the other's, and the page looks
      # fine either way. .card-number carried a comment recording the 6.90:1
      # it was fixed to in light; in dark the same ink was 1.37:1. axe runs
      # both themes but only ten pages and never a :hover state; pa11y runs
      # the default theme only.
      - name: Check every colour pair clears AA in both themes
        run: python3 scripts/check-theme-contrast.py

  min-css-fresh:
    name: Minified CSS matches its source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # index.html loads css/imx-main.min.css. There was no script to build it,
      # so an edit to the source silently failed to reach the busiest page on
      # the site -- the contrast fixes landed in imx-main.css while the min
      # copy still served the old values.
      - name: Check imx-main.min.css is not stale
        run: python3 scripts/build-min-css.py --check

  tap-traps:
    name: Invisible tap-blocking overlays
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # An opacity-0 element still receives taps. The mobile menu backdrop was
      # displayed unconditionally on phones, so every tap on blog.html landed
      # on an invisible full-viewport div and no blog post could be opened.
      # Nothing rendered wrong and nothing errored.
      - name: Check no invisible overlay swallows taps
        run: python3 scripts/check-tap-traps.py

  fundamentals-index:
    name: Fundamentals index counts what ships
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The landing page said "Four so far" while listing five frameworks, for
      # as long as the fifth had been live. check-counts.py scans root-level
      # pages for platform totals and does not reach this one; a person found
      # it by reading the page.
      - name: Check the Fundamentals index counts and links its frameworks
        run: python3 scripts/check-fundamentals-index.py

  fundamentals-privacy:
    name: Fundamentals questionnaire privacy guard
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The wheel's twelve questions cover caste, sexual orientation, religion
      # and disability, and the page promises the answers never leave the
      # browser. That promise is about code, so it is checked by code: the
      # questionnaire files must contain no network primitive at all, and the
      # page must still carry the promise.
      - name: Check the questionnaire cannot transmit
        run: python3 scripts/check-fundamentals-privacy.py

  form-submission:
    name: Form submission contract tests
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Both guard the same class of bug: fetch() resolves on 404 and 500, so a
      # handler that only wires .catch() reports a rejected submission as
      # received. That shipped on all 69 form handlers and silently lost work.
      - name: Test the shared Netlify submit helper
        run: node scripts/test-form-submit.mjs

      - name: Test the challenge-submit endpoint's validation gate
        run: node scripts/test-challenge-submit.mjs

      - name: Test the generic form-submit endpoint's allowlist and caps
        run: node scripts/test-form-submit-endpoint.mjs

  broken-links:
    name: Check broken links
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Broken link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --verbose
            --no-progress
            --accept 200,204,301,302,403
            --exclude-path ./netlify-env-files
            --exclude 'chat.whatsapp.com'
            --exclude 'discord.gg'
            --exclude 't.me'
            --exclude 'localhost'
            --exclude 'impactmojo@ibl'
            '**/*.html'
            '**/*.md'
          # Never block a PR on third-party flakiness, but DO fail the daily
          # scheduled run — otherwise link rot (which happens with no commit at
          # all) is invisible: the job stayed green no matter what it found.
          # A failed scheduled run notifies the repo owner.
          fail: ${{ github.event_name == 'schedule' }}

      - name: Upload link check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: broken-links-report
          path: ./lychee/out.md

  accessibility:
    name: Accessibility audit (pa11y-ci)
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 20
    # Scoped permissions: read the repo, write sticky PR comments.
    # Required by the 'Comment on PR with accessibility results' step below,
    # which uses marocchino/sticky-pull-request-comment@v3.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pa11y-ci and http-server
        run: npm install -g pa11y-ci http-server

      - name: Start local server
        run: npx http-server -p 8080 -s &

      - name: Wait for server
        run: sleep 3

      - name: Run pa11y-ci accessibility audit
        id: pa11y
        run: |
          set +e
          # Direct redirection: stdout (JSON) -> file, stderr -> log.
          # Avoids `tee` + `2>&1` which mixes stderr into the JSON file and
          # can corrupt or truncate the output. Also avoids PIPESTATUS pitfalls
          # since there's no pipe — $? is pa11y-ci's exit code directly.
          pa11y-ci --config .pa11yci --json > pa11y-results.json
          PA11Y_EXIT=$?
          echo "pa11y-results.json size: $(wc -c < pa11y-results.json) bytes"
          # Extract summary from JSON output for the report.
          # pa11y-ci --json emits a single top-level JSON object to stdout, but
          # `2>&1 | tee` mixes stderr (status messages) into the same file. We
          # use depth-counted brace walking to extract the first balanced JSON
          # object instead of relying on indexOf/lastIndexOf which break when
          # there's extra output before/after the JSON.
          node -e "
            const fs = require('fs');
            try {
              const raw = fs.readFileSync('pa11y-results.json', 'utf8');
              const start = raw.indexOf('{');
              if (start === -1) {
                fs.writeFileSync('pa11y-report.md', '## Accessibility Audit Results\n\nNo JSON output produced. Check workflow logs.\n');
                process.exit(0);
              }
              // Walk forward from the first { counting depth, respecting strings
              let depth = 0, end = -1, inString = false, escape = false;
              for (let i = start; i < raw.length; i++) {
                const c = raw[i];
                if (escape) { escape = false; continue; }
                if (c === '\\\\') { escape = true; continue; }
                if (c === '\"') { inString = !inString; continue; }
                if (inString) continue;
                if (c === '{') depth++;
                else if (c === '}') {
                  depth--;
                  if (depth === 0) { end = i; break; }
                }
              }
              if (end === -1) {
                fs.writeFileSync('pa11y-report.md', '## Accessibility Audit Results\n\nIncomplete JSON output. Check workflow logs.\n');
                process.exit(0);
              }
              const data = JSON.parse(raw.slice(start, end + 1));
              let md = '## Accessibility Audit Results (WCAG 2.1 AA)\n\n';
              const total = data.total || 0;
              const passes = data.passes || 0;
              const errors = data.errors || 0;
              md += '| Metric | Count |\n|--------|-------|\n';
              md += '| Pages tested | ' + total + ' |\n';
              md += '| Pages passed | ' + passes + ' |\n';
              md += '| Pages with errors | ' + errors + ' |\n\n';
              if (data.results) {
                for (const [url, issues] of Object.entries(data.results)) {
                  if (issues.length > 0) {
                    const page = url.replace('http://localhost:8080/', '');
                    md += '<details><summary>' + page + ' (' + issues.length + ' issues)</summary>\n\n';
                    issues.forEach(i => {
                      md += '- **' + i.type + '**: ' + i.message + '\n';
                      if (i.selector) md += '  - Selector: \`' + i.selector + '\`\n';
                    });
                    md += '\n</details>\n\n';
                  }
                }
              }
              if (errors > 0) {
                md += '> **Note:** Critical WCAG 2.1 AA violations detected. Please fix before merging.\n';
              } else {
                md += '> All pages passed accessibility checks.\n';
              }
              fs.writeFileSync('pa11y-report.md', md);
            } catch(e) {
              // Surface the actual error so we can debug parser failures.
              const msg = (e && e.message) ? e.message : String(e);
              fs.writeFileSync('pa11y-report.md', '## Accessibility Audit Results\n\nFailed to parse results: ' + msg + '\n\nSee workflow logs for details.\n');
              console.error('parser error:', msg);
            }
          "
          echo "exit_code=$PA11Y_EXIT" >> "$GITHUB_OUTPUT"

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-report
          path: |
            pa11y-report.md
            pa11y-results.json

      - name: Comment on PR with accessibility results
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: accessibility-audit
          path: pa11y-report.md

      - name: Fail on critical violations
        if: steps.pa11y.outputs.exit_code != '0'
        run: |
          echo "::error::Accessibility audit failed with critical WCAG 2.1 AA violations."
          exit 1

  html-validate:
    name: Validate HTML
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install html-validate
        run: npm install -g html-validate

      - name: Validate key pages
        run: |
          html-validate \
            --config '{"extends":["html-validate:recommended"],"rules":{"no-inline-style":"off","no-trailing-whitespace":"off","attribute-boolean-style":"off","element-permitted-content":"off","heading-level":"off"}}' \
            index.html login.html signup.html premium.html about.html || true
