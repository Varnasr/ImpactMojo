name: Sync Wiki

# Mirrors the repo's changelog and roadmap into the GitHub Wiki.
# Runs automatically when either source file changes on main, or on demand.
# Needs a repo-scoped PAT stored as the WIKI_PAT secret (the default
# GITHUB_TOKEN cannot push to wikis). Skips gracefully if the secret is absent.
on:
  push:
    branches: [main]
    paths:
      - 'docs/changelog.md'
      - 'ROADMAP.md'
      # The wiki quotes these counts, so a change here has to reach it too.
      - 'data/counts.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Mirror changelog + roadmap into the wiki
        env:
          WIKI_PAT: ${{ secrets.WIKI_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${WIKI_PAT:-}" ]; then
            echo "::warning::WIKI_PAT secret is not set — skipping wiki sync. Add a repo-scoped PAT as the WIKI_PAT repository secret to enable it."
            exit 0
          fi

          git config --global user.email "actions@users.noreply.github.com"
          git config --global user.name "Wiki Sync Bot"

          git clone --depth 1 "https://x-access-token:${WIKI_PAT}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki

          REPO_URL="https://github.com/${GITHUB_REPOSITORY}/blob/main"

          {
            echo "# Changelog"
            echo
            echo "_Mirrored automatically from [docs/changelog.md](${REPO_URL}/docs/changelog.md) — edit the source, not this page._"
            echo
            sed '1{/^# Changelog$/d}' docs/changelog.md
          } > wiki/Changelog.md

          {
            echo "# Roadmap"
            echo
            echo "_Mirrored automatically from [ROADMAP.md](${REPO_URL}/ROADMAP.md) — edit the source, not this page._"
            echo
            sed '1{/^# Roadmap$/d}' ROADMAP.md
          } > wiki/Roadmap.md

          # Refresh live counts across every narrative wiki page from
          # data/counts.json, using the same guard that enforces them on the
          # site (scripts/check-counts.py). Changelog.md and Roadmap.md are
          # skipped by the script itself — they mirror historical prose.
          #
          # This replaced a sed pass that rewrote two hardcoded phrases on
          # three of the eleven pages. Everything it did not cover drifted
          # unnoticed: on 2026-08-19 the Book-Summaries and Premium pages were
          # still advertising 163 reading companions, 34 labs, 22 deep dives
          # and 89 handouts to anyone reading the wiki.
          python3 scripts/check-counts.py --wiki wiki --fix
          python3 scripts/check-counts.py --wiki wiki

          cd wiki
          if git diff --quiet; then
            echo "Wiki already up to date — nothing to push."
            exit 0
          fi
          git add -A
          git commit -m "Sync wiki: changelog + roadmap + live counts from repo"
          git push
          echo "### ✅ Wiki synced (Changelog + Roadmap + narrative counts)" >> "$GITHUB_STEP_SUMMARY"
