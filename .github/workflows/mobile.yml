# Mobile-first guard — fails the build if any key page has horizontal overflow
# at a 390px phone viewport. Renders real pages in headless Chromium.
name: Mobile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mobile-overflow:
    name: Mobile overflow audit (390px)
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Step-level timeouts, not just the job-level one above. On 2026-08-19
      # this step wedged inside `playwright install` and was still reported
      # in_progress 26 minutes in -- six minutes past the job's own 20-minute
      # limit, because a job timeout is enforced by the runner process and a
      # wedged runner never fires it. The PR read as "CI still running" with
      # every other check green and no way to cancel or re-run it from an
      # integration token (403). A step timeout fails the step, which the job
      # can then report.
      - name: Install Playwright + Chromium
        timeout-minutes: 8
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run mobile overflow audit
        timeout-minutes: 8
        run: python3 scripts/mobile/audit.py
