[build]
  # Update version.json on every deploy so auto-refresh detects changes
  command = "echo '{\"v\":\"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'\"}' > version.json"
  publish = "."
  functions = "netlify/functions"

# Pin the build + Functions runtime to Node 22 (Active LTS). Node 20 reached
# end-of-life in 2026; 22 keeps Functions on a supported, security-patched runtime.
[build.environment]
  NODE_VERSION = "22"

# Podcast unpublished (2026-07): the page was placeholder-only. Redirect to the roadmap.
[[redirects]]
  from = "/podcast.html"
  to = "/updates.html"
  status = 301
  force = true
[[redirects]]
  from = "/podcast"
  to = "/updates.html"
  status = 301
  force = true

# HTML pages — short edge cache so TTFB drops from ~1.4s to <100ms on
# repeat hits. must-revalidate + Netlify's auto-cache-purge on deploy
# means visitors still see fresh content within seconds of a push.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# Long cache for static assets — images, logos, favicons rarely change.
# Browsers will still revalidate via ETag if Netlify regenerates them.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# CSS files (custom stylesheets, not inline) — same revalidation pattern as JS
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# Short cache for JS/CSS so updates propagate quickly
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/Games/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# 101 courses — clean URLs without .html extension
[[redirects]]
  from = "/101-courses/:slug"
  to = "/101-courses/:slug.html"
  status = 200
  force = false

# Cache 101 course HTML files (5 min)
[[headers]]
  for = "/101-courses/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# Documentation — self-hosted Docsify (SPA fallback)
[[redirects]]
  from = "/docs"
  to = "/docs/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/docs/*"
  to = "/docs/index.html"
  status = 200
  force = false

# Internal ops notes (money-flow runbook etc.) — never served on the web
[[redirects]]
  from = "/ops/*"
  to = "/404.html"
  status = 404
  force = true

# ToR Builder moved out of BookCompanionTools to /tools/
[[redirects]]
  from = "/BookCompanionTools/tor-generator.html"
  to = "/premium-tools/tor-builder.html"
  status = 301
  force = true

# Sample Size Calculator consolidated into the Sampling Design Studio, which is
# a superset (guided design, strategy, cluster optimiser, defensible plan).
[[redirects]]
  from = "/BookCompanionTools/sample-size-calculator.html"
  to = "/Labs/sampling-design-lab.html"
  status = 301
  force = true

# /tools/ interim path -> final premium-tools home
[[redirects]]
  from = "/tools/tor-builder.html"
  to = "/premium-tools/tor-builder.html"
  status = 301
  force = true

# ToC Workbench consolidated into the Labs gallery — Labs/toc-lab.html is the
# canonical Theory of Change builder; the old standalone copy redirects there.
# (The /101-courses/toc-workbench course deck is separate and unaffected.)
[[redirects]]
  from = "/toc-workbench.html"
  to = "/Labs/toc-lab"
  status = 301
  force = true

[[redirects]]
  from = "/toc-workbench"
  to = "/Labs/toc-lab"
  status = 301
  force = true
